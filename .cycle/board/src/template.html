<title>Sultai Pile Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a scouting console. Masthead and deck strip, sticky pile tabs, then a dense card list beside a
   sticky detail pane that shows the full card. Decks take their accent from their own main colour. */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --idW:#b39a3e; --idU:#2f6fb0; --idB:#4a4246; --idR:#b9472f; --idG:#2f7a45; --idC:#999b95;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:12px}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch}
.pip{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;border-radius:999px;font:700 .72rem/1 var(--ui);color:var(--pip-ink);background:var(--pC);border:1px solid rgba(0,0,0,.22)}
.mast .pip{font-size:.78rem}

/* deck strip */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
details.deck{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--dc);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);min-width:0}
details.deck > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;align-items:center}
details.deck > summary::-webkit-details-marker{display:none}
.portrait{grid-row:1 / span 2;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--dc);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent);background:var(--raise)}
.portrait img{width:180%;max-width:none;margin:-34% 0 0 -40%;display:block}
details.deck h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.04em;color:var(--dc);overflow-wrap:anywhere}
.sumline{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
details.deck[open] .sumline{color:var(--muted)}
.dmeta{font-size:.82rem;color:var(--muted);margin:8px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem}
.kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.chg{color:var(--accent)}
.protlist{font-size:.82rem;color:var(--muted);margin-top:6px} .protlist summary{cursor:pointer;color:var(--accent);width:max-content}
.protlist p{margin:4px 0 0}

.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:.88rem}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding-top:4px}
.tab{position:relative;background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab .n{font-family:var(--mono);font-size:.76rem;margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc)}
.tab.pile::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--tc) var(--pct,0%),color-mix(in srgb,var(--tc) 18%,transparent) var(--pct,0%))}
.intro{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:90ch;font-size:.95rem}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.toolbar label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.toolbar input[type=search]{width:min(260px,100%)}
.toolbar label.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--ink);padding-bottom:5px}
.count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-bottom:6px}
.filtbtn{display:none;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer;width:max-content}
@media (max-width:760px){ .filtbtn{display:inline-block} .toolbar:not(.open) > label:not(:first-child){display:none} .toolbar > label:first-child{flex:1 1 100%} .toolbar input[type=search]{width:100%} }

/* console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.console.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:1000px){ .console{grid-template-columns:minmax(0,1fr)} .console > .detail{display:none} }
.rows{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.row{display:grid;grid-template-columns:5px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--raise)}
.row.sel{background:var(--sel)}
.row .stripe{align-self:stretch;background:var(--stripe)}
.row .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .main{all:unset;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.row .main:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cost{display:inline-flex;gap:2px;flex:none}
.row .l2{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:.84rem;color:var(--muted)}
.row .why1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seal{font:600 .64rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);border-radius:2px;padding:3px 5px;flex:none}
.tag{font-size:.7rem;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tag.in{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.tag.prot{color:var(--dc);border-color:var(--dc);font-weight:600}
.row .q{display:flex;gap:4px;align-items:center}
.qb{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font:500 .74rem/1.3 var(--mono);cursor:pointer;color:var(--muted)}
.qb:hover{border-color:var(--qc)}
.qb[aria-pressed="true"]{background:var(--qc);border-color:var(--qc);color:var(--panel)}
.noteDot{font-size:.8rem;color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:var(--read);font-style:italic}

/* detail */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--brass) 70%,transparent);border-radius:6px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.dimg{display:flex;align-items:center;gap:6px;justify-content:center}
.dimg button.big{all:unset;cursor:zoom-in;display:block;max-width:300px;width:100%}
.dimg button.big:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.dimg img{width:100%;border-radius:12px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.step{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none;font-size:1.1rem;line-height:1}
.dname{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtype{margin:-6px 0 0;color:var(--muted);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.reason{font-family:var(--read);font-size:.98rem;line-height:1.55;margin:0}
.reason .seal{display:inline-block;margin-right:6px;vertical-align:2px}
.reason code{font-family:var(--mono);font-size:.82em;background:var(--raise);border-radius:3px;padding:0 3px}
.reason.pending{color:var(--muted);font-style:italic}
.rules{font-size:.86rem}
.rules summary{cursor:pointer;color:var(--accent);width:max-content}
.rules p{white-space:pre-wrap;margin:6px 0 0;font-family:var(--read)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.pb:hover{border-color:var(--qc,var(--accent))}
.pb[aria-pressed="true"]{background:color-mix(in srgb,var(--qc,var(--accent)) 16%,var(--panel));border-color:var(--qc,var(--accent));font-weight:600}
.field-l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select.pair,textarea.note,.addform textarea,.addform input,.addform select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.88rem;color:var(--ink)}
textarea.note{resize:vertical;min-height:3.2em;font-family:var(--read)}
.ghost{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;cursor:pointer;width:max-content;font-size:.84rem}
.saved{font-size:.78rem;color:var(--accent);min-height:1em}
.kbd{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.kbd span{border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:2px}

/* sheet (phone detail) */
dialog#sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:14px 14px 0 0;background:var(--panel);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(0,0,0,.5)}
dialog#sheet .detail{position:static;max-height:none;border:none;box-shadow:none;border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheetbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}

/* full-width views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.dlist{border-top:2px solid var(--dc)}
.dlist h3{color:var(--dc)}
.tablewrap{overflow-x:auto}
.dlist table,.proj table{width:100%;border-collapse:collapse;font-size:.86rem}
.dlist th,.dlist td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dlist thead th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dlist td:first-child{font-family:var(--mono);color:var(--muted)}
.dlist tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--raise) 70%,transparent)}
.dlist tr.cutrow td{background:var(--sel)}
.dlist tr.protsep th{color:var(--dc);font-family:var(--display);font-weight:400;padding-top:12px;border-bottom:1px solid var(--dc)}
.linkish{all:unset;cursor:zoom-in;border-bottom:1px dotted var(--muted)}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 7px;font-size:.76rem;cursor:pointer}
.mini[aria-pressed="true"]{background:color-mix(in srgb,var(--dc) 18%,var(--panel));border-color:var(--dc);font-weight:600}
.proj{border-left:2px solid var(--dc);background:var(--raise);border-radius:4px;padding:8px 10px;margin:0 0 10px}
.proj h4{margin:0 0 4px;font-size:.9rem}
.proj th[scope=row]{text-align:left;font-weight:500;padding:2px 10px 2px 0}
.proj td{font-family:var(--mono);padding:2px 10px 2px 0}
.warnline{color:var(--warn);font-size:.85rem;margin:6px 0 0}
.status{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--panel);border:none;border-radius:5px;padding:7px 14px;cursor:pointer;font-weight:600}
.plist h3{font-size:1rem;margin-top:12px} .plist ul{margin:0;padding-left:18px} .plist li{margin:3px 0}
.addform{display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reqs{padding-left:18px;margin:6px 0 10px} .reqs li{margin-bottom:6px}

/* dialogs */
dialog#zoom{border:none;padding:0;background:transparent;max-width:min(92vw,488px)}
dialog#zoom::backdrop{background:rgba(0,0,0,.72)}
dialog#zoom img{display:block;width:100%;border-radius:14px}
.zoombar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.zoombar span{color:#fff;font-size:.88rem;text-shadow:0 1px 2px #000}
.zoombar button{border:none;border-radius:999px;padding:4px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
dialog#cmp{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(96vw,900px);padding:16px}
dialog#cmp::backdrop{background:rgba(0,0,0,.6)}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:8px 0 12px}
.cmpside img{width:100%;max-width:240px;border-radius:10px;display:block}
.cmplab{font:600 .7rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.cmpside .rules p{font-size:.86rem}
@media (prefers-reduced-motion:no-preference){ .row{transition:background-color .12s} .pb,.qb{transition:background-color .12s,border-color .12s} }
</style>

<div class="wrap">
  <header class="mast">
    <h1 id="title">Sultai Pile Board</h1>
    <p id="subtitle"></p>
  </header>
  <section class="decks" id="decks" aria-label="The decks"></section>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Piles"></nav>
  <p class="intro" id="intro"></p>
  <button type="button" id="filtbtn" class="filtbtn" aria-expanded="false" aria-controls="toolbar">Show filters</button>
  <div class="toolbar" id="toolbar">
    <label for="q">Search<input type="search" id="q" placeholder="Name, type or rules text"></label>
    <label for="mem">In list<select id="mem"><option value="all">Any</option><option value="neither">In neither</option><option value="T">In deck 1</option><option value="G">In deck 2</option><option value="both">In both</option></select></label>
    <label for="grp">Reason<select id="grp"><option value="all">Any</option></select></label>
    <label for="role">Role<select id="role"><option value="all">Any</option><option>Interaction</option><option>Card advantage</option><option>Ramp</option><option>Recursion</option><option>Payoff / engine</option><option value="none">No detected role</option></select></label>
    <label for="mvf">Mana value<select id="mvf"><option value="all">Any</option><option value="lo">0–2</option><option value="mid">3–4</option><option value="hi">5+</option></select></label>
    <label for="ownf">Owned<select id="ownf"><option value="all">Any</option><option value="own">Owned</option><option value="craft">To craft</option></select></label>
    <label for="rar">Rarity<select id="rar"><option value="all">Any</option><option value="M">Mythic</option><option value="R">Rare</option><option value="U">Uncommon</option><option value="C">Common</option></select></label>
    <label for="sort">Sort<select id="sort"><option value="group">Swap candidates first</option><option value="name">Name</option><option value="mv">Mana value</option></select></label>
    <label class="check" for="swaponly"><input type="checkbox" id="swaponly"> Swap candidates only</label>
    <label class="check" for="hidemarked"><input type="checkbox" id="hidemarked"> Hide marked</label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main class="console" id="console">
    <div class="rows" id="rows" role="list" aria-label="Cards"></div>
    <aside class="detail" id="detail" aria-label="Selected card"></aside>
  </main>
</div>

<dialog id="sheet" aria-label="Card detail"><div class="sheetbar"><span class="status">Card detail</span><button type="button" class="ghost" id="sheetclose">Close</button></div><div id="sheetbody"></div></dialog>
<dialog id="zoom" aria-labelledby="zoomcap"><img id="zoomimg" alt=""><div class="zoombar"><button type="button" id="zoomprev" aria-label="Previous card">‹</button><span id="zoomcap"></span><button type="button" id="zoomnext" aria-label="Next card">›</button><button type="button" id="zoomclose">Close</button></div></dialog>
<dialog id="cmp" aria-labelledby="cmptitle"><h3 id="cmptitle" class="cmplab" style="font-size:.8rem">Add vs cut</h3><div class="cmpgrid" id="cmpgrid"></div><button type="button" id="cmpclose" class="btn">Close</button></dialog>

<script type="application/json" id="data">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const CARDS = DATA.cards, META = DATA.meta, LIVE = META.live || {};
const GROUP = META.groups || {};
const slug = n => n.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,180) || "card";
CARDS.forEach(c => c.id = slug(c.n));
const BYID = Object.fromEntries(CARDS.map(c => [c.id, c]));

/* Decks: label from the commander's first name, accent from the deck's most-produced colour. */
function mainColour(src){ let best="C",n=-1; (src||"").split("·").forEach(t=>{ const m=t.trim().match(/^([WUBRG])(\d+)/); if(m && +m[2]>n){ n=+m[2]; best=m[1]; } }); return best; }
const DECKS = {};
Object.entries(LIVE).forEach(([k,L])=>{ DECKS[k]={ key:k, label:(L.cmd||L.name||k).split(",")[0].split(" ")[0], full:L.name||"", id:L.id||"", cmd:L.cmd||"",
  size:L.size||100, lands:L.lands||0, list:L.list||[], dc:`var(--id${mainColour(L.sources)})` }; });
const DK = Object.keys(DECKS);
const PILES = [
  {k:"T", hash:"pile1", label:`${DECKS.T.label}'s pile`, intro:"Cards that fit Thranduil's Elves-and-graveyard deck better. Thranduil borrows the activated abilities of Elf cards in your graveyard and loots whenever a legendary Elf enters, so a non-Elf card has to beat an Elf for its slot."},
  {k:"G", hash:"pile2", label:`${DECKS.G.label}'s pile`, intro:"Cards that fit Glarb's draw-to-mill deck better. Every draw mills the opponent, Bruvac and The Water Crystal multiply it, and Glarb casts mana value 4+ straight off the top."},
  {k:"B", hash:"pile3", label:"Either deck", intro:"Cards that work in both decks: shared removal, ramp and fixing, scry Elves, planeswalkers. Copies are shared in Arena, so one card can sit in both lists."},
  {k:"N", hash:"neither", label:"Fits neither", intro:"Cards that fit neither deck, each with the reason. Listed so nothing is silently dropped."},
  {k:"lists", hash:"lists", label:"Deck lists", intro:"Each deck's current nonland cards, weakest fit first by deck.py cuts (1 = most cuttable). It is a shortlist: it cannot see spice or signature cards. Protected cards are listed last."},
  {k:"add", hash:"add-cards", label:"Add cards", intro:"Paste card names and choose where they go. This queues a request; when you tell Claude to process the board's requests, Claude reads, grades and adds each card."},
  {k:"picks", hash:"picks", label:"Your picks", intro:"Everything you have marked or noted. Claude reads this back when you ask."}
];
const PILEC = {T:DECKS.T.dc, G:DECKS.G.dc, B:"var(--accent)", N:"var(--muted)"};
const PICKLAB = {addT:`Add to ${DECKS.T.label}`, cutT:`Cut from ${DECKS.T.label}`, addG:`Add to ${DECKS.G.label}`, cutG:`Cut from ${DECKS.G.label}`, bench:"Bench", out:"Keep out"};
document.getElementById("subtitle").textContent = `${CARDS.length} cards split between ${DK.map(k=>`${DECKS[k].label} (${DECKS[k].full})`).join(" and ")}. Mark a card and Claude reads your picks back.`;
document.querySelector('#mem option[value="T"]').textContent=`In ${DECKS.T.label}`; document.querySelector('#mem option[value="G"]').textContent=`In ${DECKS.G.label}`;

let picks = {}, reasons = {}, requests = {};
let db = null, canWrite = true, view = "T", VISIBLE = [], SEL = null;

const esc = s => String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const fmt = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const plain = s => String(s||"").replace(/\*\*|`/g,"");
function pips(cost){
  return (String(cost||"").split(" // ")[0].match(/\{[^}]+\}/g)||[]).map(t=>{
    const s=t.slice(1,-1), parts=s.split("/"), col=x=>({W:"--pW",U:"--pU",B:"--pB",R:"--pR",G:"--pG"})[x];
    const bg = parts.length===2&&col(parts[0])&&col(parts[1]) ? `linear-gradient(135deg,var(${col(parts[0])}) 50%,var(${col(parts[1])}) 50%)` : col(parts[0])?`var(${col(parts[0])})`:"var(--pC)";
    return `<span class="pip" style="background:${bg}" title="${esc(t)}">${esc(parts.length===2&&parts[1]==="P"?parts[0]:s.length>2?s[0]:s)}</span>`; }).join("");
}
function stripe(c){ const cols=[...new Set(((c.c||"").split(" // ")[0].match(/[WUBRG]/g)||[]))].sort((a,b)=>"WUBRG".indexOf(a)-"WUBRG".indexOf(b));
  const v=(cols.length?cols:["C"]).map(x=>`var(--id${x})`); if(v.length===1) v.push(v[0]); return `linear-gradient(${v.join(",")})`; }
function reasonOf(c){ const r=reasons[c.id]; if(r&&r.text) return {g:r.group||"",w:r.text}; return c.w?{g:c.g,w:c.w}:null; }
const isSwap = c => { const r=reasonOf(c); return !!r && (r.g==="A"||r.g==="Swap candidate"); };
const groupLabel = g => GROUP[g]||g||"Reason";
const gk = c => { const g=(reasonOf(c)||{}).g||"zz"; return (g==="A"||g==="Swap candidate")?"00":g; };
const marked = id => ((picks[id]||{}).picks||[]).length>0;
const hasNote = id => !!((picks[id]||{}).note||"").trim();
function firstLine(c){ const r=reasonOf(c); if(!r) return c.iT||c.iG ? "In the list" : (c.n4||""); let t=plain(r.w).replace(/^(Thranduil|Glarb):\s*/,""); const m=t.match(/^(.{20,140}?[.;])\s/); return m?m[1]:t.slice(0,140); }
function own(c){ return c.o ? `Owned ×${c.o}` : `Craft ${({M:"mythic",R:"rare",U:"uncommon",C:"common"})[c.r]||c.r}`; }

/* ---------- rows ---------- */
function quick(c){ const p=(picks[c.id]||{}).picks||[];
  return DK.map(k=>{ const inK=c["i"+k], v=(inK?"cut":"add")+k; return `<button type="button" class="qb" style="--qc:${DECKS[k].dc}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${inK?"−":"+"}${esc(DECKS[k].label[0])}</button>`; }).join(""); }
function rowHTML(c){
  const tags = DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected":"In"} ${esc(DECKS[k].label)}</span>`).join("");
  return `<div class="row ${c.id===SEL?"sel":""}" role="listitem" id="r-${c.id}" data-row="${c.id}" style="--stripe:${stripe(c)}">
    <span class="stripe" aria-hidden="true"></span>
    <span class="th"><img src="img/${c.id}.jpg" alt="" loading="lazy" width="34" height="47"></span>
    <button type="button" class="main" data-sel="${c.id}" aria-current="${c.id===SEL}">
      <span class="l1"><span class="nm">${esc(c.n)}</span><span class="cost">${pips(c.c)}</span>${hasNote(c.id)?`<span class="noteDot" title="Has a note">✎</span>`:""}</span>
      <span class="l2">${isSwap(c)?`<span class="seal">Swap</span>`:""}${tags}${(c.ro||[]).slice(0,1).map(r=>`<span class="tag">${esc(r)}</span>`).join("")}<span class="why1">${esc(firstLine(c))}</span></span>
    </button>
    <span class="q">${quick(c)}</span>
  </div>`;
}
/* ---------- detail ---------- */
function pairSelects(c){ const p=picks[c.id]||{}, v=p.picks||[];
  return DK.filter(k=>v.includes("add"+k)).map(k=>{ const d=DECKS[k], cur=(p.pair||{})[k]||"";
    const opt=x=>`<option value="${esc(x.n)}" ${x.n===cur?"selected":""}>${x.prot?"":`#${x.r??"–"} `}${esc(x.n)}</option>`;
    return `<label class="field-l" for="pair-${k}-${c.id}">In ${esc(d.label)}, this replaces</label><select class="pair" id="pair-${k}-${c.id}" data-id="${c.id}" data-k="${k}"><option value="">Choose a card (weakest fit first)</option>${d.list.filter(x=>!x.prot).map(opt).join("")}<optgroup label="Protected">${d.list.filter(x=>x.prot).map(opt).join("")}</optgroup></select>`; }).join(""); }
function compareBtns(c){ const p=picks[c.id]||{}; return DK.filter(k=>(p.picks||[]).includes("add"+k)&&(p.pair||{})[k]&&BYID[slug(p.pair[k])]).map(k=>`<button type="button" class="ghost" data-cmp="${c.id}" data-cut="${slug(p.pair[k])}">Compare with ${esc(p.pair[k])}</button>`).join(""); }
function detailHTML(c, inSheet){
  if(!c) return `<p class="empty">Choose a card from the list.</p>`;
  const p=picks[c.id]||{}, v=p.picks||[], r=reasonOf(c), idx=VISIBLE.indexOf(c.id);
  const pb=(val,label)=>`<button type="button" class="pb" style="--qc:${val.endsWith("T")?DECKS.T.dc:val.endsWith("G")?DECKS.G.dc:val==="out"?"var(--bad)":"var(--accent)"}" data-id="${c.id}" data-v="${val}" aria-pressed="${v.includes(val)}">${label}</button>`;
  const chips=[...DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected in":"In"} ${esc(DECKS[k].label)}</span>`), `<span class="tag">${esc(own(c))}</span>`, ...(c.ro||[]).map(x=>`<span class="tag">${esc(x)}</span>`)].join("");
  return `<div class="dimg">${idx>-1&&VISIBLE.length>1?`<button type="button" class="step" data-step="-1" aria-label="Previous card">‹</button>`:""}
      <button type="button" class="big" data-zoom="${c.id}" aria-label="Show ${esc(c.n)} full screen"><img src="img/${c.id}.jpg" alt="${esc(c.n)}"></button>
      ${idx>-1&&VISIBLE.length>1?`<button type="button" class="step" data-step="1" aria-label="Next card">›</button>`:""}</div>
    <h2 class="dname">${esc(c.n)} <span class="cost">${pips(c.c)}</span></h2>
    <p class="dtype">${esc(c.t)}${idx>-1?` · ${idx+1} of ${VISIBLE.length}`:""}</p>
    <div class="chips">${chips}</div>
    ${r?`<p class="reason">${isSwap(c)?"":`<span class="seal">${esc(groupLabel(r.g))}</span>`}${isSwap(c)?`<span class="seal">Swap candidate</span>`:""}${fmt(r.w)}</p>`:`<p class="reason pending">${c.iT||c.iG?"In the list.":"No reason written yet."}</p>`}
    <details class="rules"><summary>Rules text</summary><p>${esc(c.x||"(no rules text)")}</p></details>
    <div class="picks" role="group" aria-label="Your pick for ${esc(c.n)}">${DK.map(k=>c["i"+k]?pb("cut"+k,`− ${esc(DECKS[k].label)}`):pb("add"+k,`+ ${esc(DECKS[k].label)}`)).join("")}${pb("bench","Bench")}${pb("out","Keep out")}</div>
    ${pairSelects(c)}${compareBtns(c)}
    <label class="field-l" for="n-${c.id}${inSheet?"-s":""}">Note for Claude</label>
    <textarea class="note" id="n-${c.id}${inSheet?"-s":""}" data-id="${c.id}" rows="2" placeholder="A question, a hunch, a combo to check">${esc(p.note||"")}</textarea>
    <span class="saved" id="saved-${c.id}${inSheet?"-s":""}" aria-live="polite"></span>
    ${inSheet?"":`<p class="kbd"><span>j</span><span>k</span> move · <span>1</span><span>2</span> ${esc(DECKS.T.label)} / ${esc(DECKS.G.label)} · <span>b</span> bench · <span>o</span> keep out · <span>n</span> note · <span>/</span> search · <span>z</span> zoom</p>`}`;
}
function renderDetail(){ const c=BYID[SEL]; document.getElementById("detail").innerHTML=detailHTML(c,false);
  const sh=document.getElementById("sheet"); if(sh.open) document.getElementById("sheetbody").innerHTML=`<div class="detail">${detailHTML(c,true)}</div>`; }
const narrow = () => window.matchMedia("(max-width: 1000px)").matches;
function select(id, scroll){ SEL=id; document.querySelectorAll(".row.sel").forEach(r=>{r.classList.remove("sel"); r.querySelector(".main").setAttribute("aria-current","false");});
  const r=document.getElementById("r-"+id); if(r){ r.classList.add("sel"); r.querySelector(".main").setAttribute("aria-current","true"); if(scroll) r.scrollIntoView({block:"nearest"}); }
  renderDetail(); }

/* ---------- other views ---------- */
function pairedTo(k,name){ return Object.entries(picks).filter(([id,p])=>(p.picks||[]).includes("add"+k)&&p.pair&&p.pair[k]===name).map(([id])=>BYID[id]?BYID[id].n:id); }
function bandOf(k,i,c){ const R=LIVE[k].req||{}; for(const b of ["A","B","C"]){ const r=R[b]; if(r&&i>=r[0]&&i+c>=r[1]) return b; } return "D"; }
function project(k){ const L=LIVE[k], adds=[], cutset=new Set();
  Object.entries(picks).forEach(([id,p])=>{ const v=p.picks||[], c=BYID[id]; if(!c) return;
    if(v.includes("add"+k)&&!c["i"+k]){ adds.push(c); const pc=(p.pair||{})[k]; if(pc) cutset.add(pc); }
    if(v.includes("cut"+k)&&c["i"+k]) cutset.add(c.n); });
  const cuts=[...cutset].map(n=>BYID[slug(n)]).filter(Boolean), sum=(xs,f)=>xs.reduce((a,x)=>a+(x[f]||0),0);
  const i0=L.interaction, c0=L.ca, i1=i0+sum(adds,"ri")-sum(cuts,"ri"), c1=c0+sum(adds,"rc")-sum(cuts,"rc");
  const nl=xs=>xs.filter(x=>!x.land&&x.mf!=null), n0=L.avg_mv_n||1;
  const mv1=(L.avg_mv*n0+sum(nl(adds),"mf")-sum(nl(cuts),"mf"))/Math.max(1,n0+nl(adds).length-nl(cuts).length);
  const craft=xs=>xs.filter(x=>!x.o).length;
  return {adds,cuts,i0,i1,c0,c1,f0:bandOf(k,i0,c0),f1:bandOf(k,i1,c1),mv0:L.avg_mv,mv1:Math.round(mv1*100)/100,cr0:L.crafts,cr1:L.crafts+craft(adds)-craft(cuts),size0:L.size,size1:L.size+adds.length-cuts.length,changed:adds.length+cuts.length>0}; }
function projHTML(k){ const pr=project(k); if(!pr.changed) return `<p class="status">Mark adds and cuts for this deck and their effect shows here.</p>`;
  const row=(l,a,b)=>`<tr><th scope="row">${l}</th><td>${a}</td><td>${a===b?"—":`<b class="chg">${b}</b>`}</td></tr>`;
  return `<div class="proj"><h4>With your picks (+${pr.adds.length} / −${pr.cuts.length})</h4><table><thead><tr><th></th><th scope="col">Now</th><th scope="col">After</th></tr></thead><tbody>
    ${row("Tier floor",pr.f0,pr.f1)}${row("Interaction",pr.i0,pr.i1)}${row("Card advantage",pr.c0,pr.c1)}${row("Avg mana value",pr.mv0,pr.mv1)}${row("Cards to craft",pr.cr0,pr.cr1)}${row("Deck size",pr.size0,pr.size1)}</tbody></table>
    ${pr.size1!==pr.size0?`<p class="warnline">The deck would be ${pr.size1} cards, not ${pr.size0}: ${pr.size1>pr.size0?"pick a cut for each add":"add a card for each cut"}.</p>`:""}
    <p class="status">Interaction and card advantage add up card by card, so these match deck.py. Run the copied swap --package line to confirm before applying.</p></div>`; }
function listsHTML(){ return `<div class="lists">`+DK.map(k=>{ const d=DECKS[k]; return `<section class="panel dlist" style="--dc:${d.dc}" aria-label="${esc(d.label)} list"><h3>${esc(d.label)} · ${d.list.length} nonland cards + ${d.lands} lands</h3>${projHTML(k)}
  <div class="tablewrap"><table><thead><tr><th scope="col">Cut rank</th><th scope="col">Card</th><th scope="col">MV</th><th scope="col">Roles</th><th scope="col">Your marks</th></tr></thead><tbody>
  ${[...d.list.filter(c=>!c.prot),null,...d.list.filter(c=>c.prot)].map(c=>{ if(c===null) return `<tr class="protsep"><th colspan="5" scope="rowgroup">Protected — never offered as a cut</th></tr>`;
    const id=slug(c.n), have=!!BYID[id], p=(picks[id]||{}).picks||[], adds=pairedTo(k,c.n);
    return `<tr class="${p.includes("cut"+k)?"cutrow":""}"><td>${c.prot?"—":(c.r??"–")}</td><td>${have?`<button type="button" class="linkish" data-zoom="${id}">${esc(c.n)}</button>`:esc(c.n)}</td><td>${c.mv??""}</td><td>${esc((c.roles||[]).join(", "))}</td>
    <td>${have?`<button type="button" class="mini" style="--dc:${d.dc}" data-id="${id}" data-v="cut${k}" aria-pressed="${p.includes("cut"+k)}">Cut</button>`:""}${adds.length?` <span class="status">replaced by ${esc(adds.join(", "))}</span>`:""}</td></tr>`; }).join("")}
  </tbody></table></div></section>`; }).join("")+`</div>`; }
function picksHTML(){ const groups={}; Object.entries(picks).forEach(([id,p])=>(p.picks||[]).forEach(v=>(groups[v]=groups[v]||[]).push(id)));
  const noted=Object.keys(picks).filter(id=>hasNote(id)&&BYID[id]).sort();
  if(!Object.keys(groups).length&&!noted.length) return `<div class="panel"><p class="empty">No picks or notes yet. Mark cards in any pile and they gather here.</p></div>`;
  const li=(id,extra)=>`<li><a href="#${PILES.find(p=>p.k===BYID[id].p).hash}" data-jump="${id}">${esc(BYID[id].n)}</a>${extra||""}</li>`;
  return `<div class="panel plist">${noted.length?`<h3>Notes (${noted.length})</h3><ul>${noted.map(id=>li(id,` — ${esc(picks[id].note)}`)).join("")}</ul>`:""}
  ${["addT","cutT","addG","cutG","bench","out"].filter(v=>groups[v]).map(v=>`<h3>${esc(PICKLAB[v])} (${groups[v].length})</h3><ul>${groups[v].sort().map(id=>{ const pr=((picks[id]||{}).pair||{})[v.slice(-1)];
    return li(id, v.startsWith("add")?(pr?` <span class="status">replaces ${esc(pr)}</span>`:` <span class="status">no cut chosen</span>`):""); }).join("")}</ul>`).join("")}
  <p><button type="button" class="btn" id="copy">Copy as text</button> <span class="status" id="copied" aria-live="polite"></span></p></div>`; }
const DESTS={T:`${DECKS.T.label}'s pile`,G:`${DECKS.G.label}'s pile`,B:"Either deck",N:"Fits neither",auto:"Let Claude decide",addT:`Add to ${DECKS.T.label}'s deck`,addG:`Add to ${DECKS.G.label}'s deck`};
function parseNames(txt){ const out=[]; (txt||"").split(/\r?\n/).forEach(l=>{ l=l.trim(); if(!l||/^(deck|commander|sideboard|companion|maybeboard)$/i.test(l)) return;
  l=l.replace(/^\d+x?\s+/i,"").replace(/\s+\([A-Z0-9]{2,6}\)\s*\S*\s*$/,"").replace(/\s+\*F\*$/,"").trim(); if(l&&!out.includes(l)) out.push(l); }); return out; }
function addHTML(){ const reqs=Object.entries(requests).sort((a,b)=>(b[1].at||"").localeCompare(a[1].at||""));
  return `<section class="panel addform"><label class="field-l" for="addnames">Card names, one per line</label>
    <textarea id="addnames" rows="6" placeholder="Krang, the All-Powerful&#10;1 Deathrite Shaman (MH1) 198"></textarea>
    <div class="addrow"><label class="field-l" for="adddest">Where</label><select id="adddest" style="width:auto">${Object.entries(DESTS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></div>
    <label class="field-l" for="addnote">Note for Claude (optional)</label><input id="addnote" placeholder="e.g. found these in a draft">
    <div class="addrow"><button type="button" class="btn" id="addsubmit">Queue for Claude</button><span class="status" id="addstatus" aria-live="polite"></span></div><p class="status" id="addpreview"></p></section>
  <section class="panel"><h3>Requests (${reqs.length})</h3>${reqs.length?`<ul class="reqs">${reqs.map(([id,r])=>`<li><b>${r.status==="done"?"Done":"Waiting for Claude"}</b> · ${esc(DESTS[r.dest]||r.dest)} · ${r.names.map(esc).join("; ")}${r.note?` — ${esc(r.note)}`:""}${r.reply?`<br><span class="status">Claude: ${esc(r.reply)}</span>`:""}</li>`).join("")}</ul><button type="button" class="ghost" id="addcopy">Copy requests as text</button>`:`<p class="status">No requests yet.</p>`}</section>`; }
function setAddStatus(t){ const el=document.getElementById("addstatus"); if(el) el.textContent=t; }
async function submitRequest(){ const names=parseNames(document.getElementById("addnames").value), dest=document.getElementById("adddest").value, note=document.getElementById("addnote").value.trim();
  if(!names.length){ setAddStatus("Paste at least one card name."); return; }
  const on=names.filter(n=>BYID[slug(n)]), id="r-"+Date.now(), r={names,dest,note,at:new Date().toISOString(),status:"pending"};
  if(db&&canWrite){ try{ await db.collection("requests").doc(id).set(r); }catch(e){ setAddStatus("The request could not be saved. Try again."); return; } }
  else { requests[id]=r; try{ localStorage.setItem("sultai-board-requests",JSON.stringify(requests)); }catch(e){} }
  render(); setAddStatus(`Queued ${names.length} card(s).`+(on.length?` Already on the board: ${on.join("; ")}. Claude will move them instead.`:"")+(db?"":" This browser cannot share it with Claude: copy the requests below.")); }

/* ---------- deck strip, tabs ---------- */
function renderDecks(){ const compact=narrow();
  document.getElementById("decks").innerHTML=DK.map(k=>{ const d=DECKS[k], L=LIVE[k], pr=project(k);
    let a=0,c=0; Object.values(picks).forEach(p=>{ const v=p.picks||[]; if(v.includes("add"+k))a++; if(v.includes("cut"+k))c++; });
    const delta=(x,y)=>x===y?`${x}`:`${x} → <span class="chg">${y}</span>`;
    return `<details class="deck" style="--dc:${d.dc}" ${compact?"":"open"}>
      <summary><span class="portrait"><img src="img/${slug(d.cmd||"")}.jpg" alt="" loading="lazy"></span><h2>${esc(d.full)}</h2>
      <span class="sumline">${esc(d.label)} · floor ${esc(pr.f1)} · int ${pr.i1} · ca ${pr.c1}${(a||c)?` · +${a}/−${c}`:""}</span></summary>
      <div class="dmeta">Deck ${esc(d.id)} · commander ${esc(d.cmd)} · ${d.size} cards · read from the deck file ${esc(META.refreshed||"")}</div>
      <div class="kv"><span>Floor <b>${delta(pr.f0,pr.f1)}</b></span><span>Interaction <b>${delta(pr.i0,pr.i1)}</b></span><span>Card adv. <b>${delta(pr.c0,pr.c1)}</b></span><span>Sources <b>${esc(L.sources)}</b></span><span>Tapped-land cost <b>${esc(L.tapped)}</b></span><span>Avg MV <b>${delta(pr.mv0,pr.mv1)}</b></span><span>Crafts <b>${delta(pr.cr0,pr.cr1)}</b></span><span>Your marks <b>+${a} / −${c}</b></span></div>
      <details class="protlist"><summary>Protected cards (${(L.protect||[]).length})</summary><p>${(L.protect||[]).map(esc).join(" · ")}</p></details></details>`; }).join(""); }
function renderTabs(){ document.getElementById("tabs").innerHTML=PILES.map(p=>`<button class="tab ${PILEC[p.k]?"pile":""}" role="tab" type="button" data-k="${p.k}" id="tab-${p.hash}" aria-selected="false" style="--tc:${PILEC[p.k]||"var(--ink)"}">${esc(p.label)}<span class="n"></span></button>`).join(""); }
function updateTabCounts(){ PILES.forEach(p=>{ const t=document.querySelector(`.tab[data-k="${p.k}"]`), el=t&&t.querySelector(".n"); if(!el) return;
  if(p.k==="lists"){ el.textContent=""; return; }
  if(p.k==="add"){ const n=Object.values(requests).filter(r=>r.status!=="done").length; el.textContent=n||""; return; }
  if(p.k==="picks"){ el.textContent=Object.values(picks).filter(x=>(x.picks||[]).length||(x.note||"").trim()).length||""; return; }
  const xs=CARDS.filter(c=>c.p===p.k), dn=xs.filter(c=>marked(c.id)).length; el.textContent=`${dn}/${xs.length}`;
  t.style.setProperty("--pct",(xs.length?Math.round(100*dn/xs.length):0)+"%"); t.setAttribute("aria-label",`${p.label}: ${dn} of ${xs.length} marked`); }); }

/* ---------- main render ---------- */
function filtered(){ const q=document.getElementById("q").value.trim().toLowerCase(), mem=document.getElementById("mem").value, sort=document.getElementById("sort").value;
  let xs=CARDS.filter(c=>c.p===view);
  const grpSel=document.getElementById("grp"), present=[...new Set(xs.map(c=>(reasonOf(c)||{}).g).filter(Boolean))].sort(), cur=grpSel.value;
  grpSel.innerHTML=`<option value="all">Any</option>`+present.map(g=>`<option value="${esc(g)}">${esc(groupLabel(g))}</option>`).join(""); grpSel.value=present.includes(cur)?cur:"all";
  const role=document.getElementById("role").value, mvf=document.getElementById("mvf").value, ownf=document.getElementById("ownf").value, rar=document.getElementById("rar").value;
  xs=xs.filter(c=>{ if(q&&!(c.n.toLowerCase().includes(q)||(c.x||"").toLowerCase().includes(q)||(c.t||"").toLowerCase().includes(q))) return false;
    if(mem==="neither"&&(c.iT||c.iG)) return false; if(mem==="T"&&!c.iT) return false; if(mem==="G"&&!c.iG) return false; if(mem==="both"&&!(c.iT&&c.iG)) return false;
    if(grpSel.value!=="all"&&(reasonOf(c)||{}).g!==grpSel.value) return false;
    const ro=c.ro||[]; if(role==="none"?ro.length:(role!=="all"&&!ro.includes(role))) return false;
    const mv=c.mv??0; if((mvf==="lo"&&mv>2)||(mvf==="mid"&&(mv<3||mv>4))||(mvf==="hi"&&mv<5)) return false;
    if((ownf==="own"&&!c.o)||(ownf==="craft"&&c.o)) return false; if(rar!=="all"&&c.r!==rar) return false;
    if(document.getElementById("hidemarked").checked&&marked(c.id)&&c.id!==SEL) return false;
    if(document.getElementById("swaponly").checked&&!isSwap(c)) return false; return true; });
  return xs.sort((a,b)=> sort==="mv"?(a.mv??99)-(b.mv??99)||a.n.localeCompare(b.n) : sort==="group"?gk(a).localeCompare(gk(b))||a.n.localeCompare(b.n) : a.n.localeCompare(b.n)); }
function render(){
  const pile=PILES.find(p=>p.k===view); document.getElementById("intro").textContent=pile.intro;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.k===view)); updateTabCounts();
  const isPile=["T","G","B","N"].includes(view), con=document.getElementById("console"), rows=document.getElementById("rows");
  document.getElementById("toolbar").classList.toggle("hidden",!isPile); document.getElementById("filtbtn").classList.toggle("hidden",!isPile);
  con.classList.toggle("full",!isPile); document.getElementById("detail").classList.toggle("hidden",!isPile);
  rows.className = isPile ? "rows" : ""; rows.setAttribute("role", isPile?"list":"region");
  if(!isPile){ document.getElementById("count").textContent=""; rows.innerHTML = view==="lists"?listsHTML():view==="add"?addHTML():picksHTML(); return; }
  const xs=filtered(), all=CARDS.filter(c=>c.p===view), done=all.filter(c=>marked(c.id)).length;
  VISIBLE=xs.map(c=>c.id); if(!VISIBLE.includes(SEL)) SEL=VISIBLE[0]||null;
  document.getElementById("count").textContent=`${xs.length} shown · ${done}/${all.length} reviewed`;
  rows.innerHTML = xs.length ? xs.map(rowHTML).join("") : `<p class="empty">No cards match. Clear the search or the filters.</p>`;
  renderDetail(); }
function refreshRow(id){ const r=document.getElementById("r-"+id), c=BYID[id]; if(r&&c){ r.outerHTML=rowHTML(c); } updateTabCounts(); renderDetail(); renderDecks(); }
function setView(k,push){ view=k; if(push){ const h=PILES.find(p=>p.k===k).hash; if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); } render(); }
function fromHash(){ const p=PILES.find(p=>"#"+p.hash===location.hash); setView(p?p.k:"T",false); }

/* ---------- zoom, compare, sheet ---------- */
let ZLIST=[], ZI=0;
function showZoom(){ const c=BYID[ZLIST[ZI]], im=document.getElementById("zoomimg"); im.src="img/"+c.id+".jpg"; im.alt=c.n;
  document.getElementById("zoomcap").textContent=c.n+(ZLIST.length>1?` · ${ZI+1} of ${ZLIST.length}`:"");
  document.getElementById("zoomprev").hidden=document.getElementById("zoomnext").hidden=ZLIST.length<2; document.getElementById("zoom").dataset.from=c.id; }
function openZoom(id,list){ ZLIST=(list&&list.includes(id))?list.slice():[id]; ZI=ZLIST.indexOf(id); showZoom(); const d=document.getElementById("zoom"); if(!d.open&&d.showModal) d.showModal(); }
function stepZoom(n){ if(ZLIST.length<2) return; ZI=(ZI+n+ZLIST.length)%ZLIST.length; showZoom(); }
function openCompare(addId,cutId,from){ const side=(c,label)=>{ const r=reasonOf(c); return `<div class="cmpside"><p class="cmplab">${label}</p><img src="img/${c.id}.jpg" alt="${esc(c.n)}" loading="lazy">
  <h3 class="dname" style="font-size:1.1rem">${esc(c.n)} <span class="cost">${pips(c.c)}</span></h3><p class="dtype">${esc(c.t)}</p><div class="rules"><p>${esc(c.x||"")}</p></div>${r?`<p class="reason" style="font-size:.9rem"><span class="seal">${esc(groupLabel(r.g))}</span>${fmt(r.w)}</p>`:""}</div>`; };
  document.getElementById("cmpgrid").innerHTML=side(BYID[addId],"Add")+side(BYID[cutId],"Cut"); const d=document.getElementById("cmp"); d._from=from; if(d.showModal) d.showModal(); }
function openSheet(id){ SEL=id; const sh=document.getElementById("sheet"); document.getElementById("sheetbody").innerHTML=`<div class="detail">${detailHTML(BYID[id],true)}</div>`; if(!sh.open&&sh.showModal) sh.showModal(); }

/* ---------- persistence ---------- */
function banner(msg){ const b=document.getElementById("banner"); if(msg){ b.textContent=msg; b.hidden=false; } else b.hidden=true; }
const LS="sultai-board-picks";
const saveLocal=()=>{ try{ localStorage.setItem(LS,JSON.stringify(picks)); }catch(e){} };
const loadLocal=()=>{ try{ return JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ return {}; } };
const writing={};
function flashSaved(id,local){ ["saved-"+id,"saved-"+id+"-s"].forEach(x=>{ const el=document.getElementById(x); if(!el) return; el.textContent=local?"Saved in this browser":"Saved"; clearTimeout(el._t); el._t=setTimeout(()=>{el.textContent="";},2500); }); }
async function persist(id){ const p=picks[id]||{picks:[],note:""};
  if(!db){ saveLocal(); flashSaved(id,true); return; }
  if(writing[id]){ writing[id].again=true; return; } writing[id]={again:false};
  try{ const ref=db.collection("picks").doc(id);
    if(!(p.picks||[]).length&&!p.note) await ref.delete();
    else await ref.set({card:BYID[id].n,picks:p.picks||[],note:p.note||"",pair:p.pair||{},pile:BYID[id].p,at:new Date().toISOString()});
  }catch(e){ if(e&&e.code==="invalid_argument"){ canWrite=false; banner("You can view this board but not save picks on it."); } else if(e&&e.code==="quota_exceeded") banner("The board's storage is full, so this pick was not saved."); else banner("A pick could not be saved just now. Try again."); }
  const again=writing[id].again; delete writing[id]; if(again) persist(id); else flashSaved(id); }
function togglePick(id,v){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const p=picks[id]||(picks[id]={picks:[],note:""}); const s=new Set(p.picks||[]);
  if(s.has(v)) s.delete(v); else { s.add(v); if(v==="out") ["addT","addG","bench"].forEach(x=>s.delete(x)); if(v.startsWith("add")||v==="bench") s.delete("out"); }
  p.picks=[...s]; persist(id); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(t){ setView(t.dataset.k,true); return; }
  const b=e.target.closest("[data-v]"); if(b){ const id=b.dataset.id; togglePick(id,b.dataset.v);
    if(["T","G","B","N"].includes(view)){ refreshRow(id); const again=document.querySelector(`${b.closest("#sheet")?"#sheet ":b.closest(".detail")?"#detail ":`#r-${id} `}[data-v="${b.dataset.v}"]`); if(again) again.focus(); }
    else { render(); renderDecks(); } return; }
  const sel=e.target.closest("[data-sel]"); if(sel){ if(narrow()) openSheet(sel.dataset.sel); else select(sel.dataset.sel,false); return; }
  const row=e.target.closest("[data-row]"); if(row&&!e.target.closest("button")){ if(narrow()) openSheet(row.dataset.row); else select(row.dataset.row,false); return; }
  const st=e.target.closest("[data-step]"); if(st){ const i=VISIBLE.indexOf(SEL), n=VISIBLE[(i+ +st.dataset.step+VISIBLE.length)%VISIBLE.length]; if(n){ select(n,true); const s2=document.querySelector(`#detail [data-step="${st.dataset.step}"]`); if(s2) s2.focus(); } return; }
  const z=e.target.closest("[data-zoom]"); if(z){ openZoom(z.dataset.zoom, z.closest(".dlist")?null:VISIBLE); return; }
  if(e.target.id==="zoomprev"||e.target.id==="zoomnext"){ stepZoom(e.target.id==="zoomnext"?1:-1); return; }
  if(e.target.id==="zoomclose"||e.target.id==="zoom"){ document.getElementById("zoom").close(); return; }
  const cm=e.target.closest("[data-cmp]"); if(cm){ openCompare(cm.dataset.cmp,cm.dataset.cut,cm); return; }
  if(e.target.id==="cmpclose"||e.target.id==="cmp"){ const d=document.getElementById("cmp"); d.close(); if(d._from&&document.contains(d._from)) d._from.focus(); return; }
  if(e.target.id==="sheetclose"||e.target.id==="sheet"){ document.getElementById("sheet").close(); const r=document.querySelector(`#r-${SEL} .main`); if(r) r.focus(); return; }
  if(e.target.id==="filtbtn"){ const tb=document.getElementById("toolbar"), o=tb.classList.toggle("open"); e.target.setAttribute("aria-expanded",o); e.target.textContent=o?"Hide filters":"Show filters"; return; }
  if(e.target.id==="addsubmit"){ submitRequest(); return; }
  if(e.target.id==="addcopy"){ const txt=Object.values(requests).map(r=>`${r.dest}: ${r.names.join("; ")}${r.note?" — "+r.note:""}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setAddStatus("Copied."),()=>setAddStatus("Copy was blocked; select the list instead.")); return; }
  const j=e.target.closest("[data-jump]"); if(j){ e.preventDefault(); const c=BYID[j.dataset.jump]; SEL=c.id; setView(c.p,true); select(c.id,true); return; }
  if(e.target.id==="copy"){ const lines=[];
    const noted=Object.keys(picks).filter(id=>hasNote(id)&&BYID[id]).sort(); if(noted.length){ lines.push("Notes:"); noted.forEach(id=>lines.push("  - "+BYID[id].n+" — "+picks[id].note)); }
    ["addT","cutT","addG","cutG","bench","out"].forEach(v=>{ const ids=Object.keys(picks).filter(id=>(picks[id].picks||[]).includes(v)&&BYID[id]); if(ids.length){ lines.push(PICKLAB[v]+":"); ids.sort().forEach(id=>lines.push("  - "+BYID[id].n)); } });
    lines.push(""); DK.forEach(k=>{ const d=DECKS[k], pairs=[], loose=[];
      Object.keys(picks).sort().forEach(id=>{ const p=picks[id]; if(!(p.picks||[]).includes("add"+k)||!BYID[id]) return; const cut=(p.pair||{})[k]; if(cut) pairs.push(`"${cut}=${BYID[id].n}"`); else loose.push(BYID[id].n); });
      const paired=new Set(Object.values(picks).map(p=>(p.pair||{})[k]).filter(Boolean));
      const cutsOnly=Object.keys(picks).filter(id=>(picks[id].picks||[]).includes("cut"+k)&&BYID[id]&&!paired.has(BYID[id].n)).map(id=>BYID[id].n);
      if(!pairs.length&&!loose.length&&!cutsOnly.length) return; lines.push(`${d.label} (${d.id}):`);
      if(pairs.length) lines.push(`  python3 scripts/deck.py swap ${d.id} --package ${pairs.join(" ")}`);
      if(loose.length) lines.push(`  adds with no cut chosen: ${loose.join("; ")}`); if(cutsOnly.length) lines.push(`  cuts with no add: ${cutsOnly.join("; ")}`); });
    (navigator.clipboard?navigator.clipboard.writeText(lines.join("\n")):Promise.reject()).then(()=>document.getElementById("copied").textContent="Copied.",()=>document.getElementById("copied").textContent="Copy was blocked here; select the list above instead."); return; }
});
const noteTimer={};
document.addEventListener("input",e=>{
  if(e.target.classList.contains("note")){ const id=e.target.dataset.id; (picks[id]=picks[id]||{picks:[]}).note=e.target.value;
    clearTimeout(noteTimer[id]); noteTimer[id]=setTimeout(()=>{ persist(id); const r=document.getElementById("r-"+id); if(r) r.outerHTML=rowHTML(BYID[id]); updateTabCounts(); },700); return; }
  if(e.target.id==="addnames"){ const n=parseNames(e.target.value), on=n.filter(x=>BYID[slug(x)]), pv=document.getElementById("addpreview"); if(pv) pv.textContent=n.length?`${n.length} name(s) read${on.length?`; already on the board: ${on.join("; ")}`:""}.`:""; return; }
  if(e.target.id==="q") render(); });
["mem","grp","sort","role","mvf","ownf","rar","hidemarked","swaponly"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.addEventListener("change",e=>{ const s=e.target.closest("select.pair"); if(!s) return; if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const id=s.dataset.id, p=picks[id]||(picks[id]={picks:[],note:""}); p.pair=Object.assign({},p.pair||{},{[s.dataset.k]:s.value}); persist(id); renderDecks(); renderDetail(); });
document.getElementById("tabs").addEventListener("keydown",e=>{ if(!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const tabs=[...document.querySelectorAll(".tab")], i=tabs.findIndex(t=>t.dataset.k===view), n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length]; setView(n.dataset.k,true); n.focus(); });
document.addEventListener("keydown",e=>{
  if(document.getElementById("zoom").open){ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); stepZoom(e.key==="ArrowRight"?1:-1); } return; }
  if(document.querySelector("dialog[open]")) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag)||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!["T","G","B","N"].includes(view)||!VISIBLE.length) return;
  const i=Math.max(0,VISIBLE.indexOf(SEL)), go=n=>{ const id=VISIBLE[(n+VISIBLE.length)%VISIBLE.length]; select(id,true); const m=document.querySelector(`#r-${id} .main`); if(m) m.focus(); };
  if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); go(i+1); }
  else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); go(i-1); }
  else if(e.key==="1"||e.key==="2"){ const k=DK[+e.key-1], c=BYID[SEL]; if(c){ togglePick(SEL,(c["i"+k]?"cut":"add")+k); refreshRow(SEL); } }
  else if(e.key==="b"&&SEL){ togglePick(SEL,"bench"); refreshRow(SEL); }
  else if(e.key==="o"&&SEL){ togglePick(SEL,"out"); refreshRow(SEL); }
  else if(e.key==="n"&&SEL){ e.preventDefault(); const t=document.getElementById("n-"+SEL); if(t) t.focus(); }
  else if(e.key==="/"){ e.preventDefault(); document.getElementById("q").focus(); }
  else if(e.key==="z"&&SEL){ openZoom(SEL,VISIBLE); } });
window.addEventListener("hashchange",fromHash);
window.matchMedia("(max-width: 1000px)").addEventListener("change",()=>{ renderDecks(); });

renderTabs(); picks=loadLocal(); try{ requests=JSON.parse(localStorage.getItem("sultai-board-requests")||"{}")||{}; }catch(e){ requests={}; } renderDecks(); fromHash();

(async()=>{ let api=null;
  try{ api=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ api=null; }
  if(!api){ banner("Picks are saved in this browser only, so Claude cannot read them here. Open the board on claude.ai to share them."); return; }
  db=api;
  try{ const u=await window.claude.use("user"); if(u&&u.can){ const w=await u.can("data.write"); if(w===false){ canWrite=false; banner("You can view this board but not save picks on it."); } } }catch(e){}
  const timer=setTimeout(()=>banner("Saved picks have not loaded yet. Marks you make now still save."),10000);
  db.collection("picks").onSnapshot(snap=>{ if(!snap.metadata.fromCache){ clearTimeout(timer); if(canWrite) banner(""); }
    const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(BYID[d.id]) next[d.id]={picks:Array.isArray(x.picks)?x.picks.filter(v=>PICKLAB[v]):[],note:typeof x.note==="string"?x.note:"",pair:(x.pair&&typeof x.pair==="object")?{T:typeof x.pair.T==="string"?x.pair.T:"",G:typeof x.pair.G==="string"?x.pair.G:""}:{}}; });
    const local=loadLocal(), migrate=[]; Object.keys(local).forEach(id=>{ if(!next[id]&&BYID[id]&&((local[id].picks||[]).length||local[id].note)){ next[id]=local[id]; migrate.push(id); } });
    const focusedNote=document.activeElement&&document.activeElement.classList.contains("note");
    picks=next; if(!focusedNote){ render(); } else { updateTabCounts(); } renderDecks();
    if(migrate.length){ try{ localStorage.removeItem(LS); }catch(e){} migrate.forEach(persist); }
  },err=>{ clearTimeout(timer); banner("Saved picks could not be loaded. Reload the page to try again."); });
  db.collection("requests").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(Array.isArray(x.names)) next[d.id]={names:x.names.filter(n=>typeof n==="string").slice(0,300),dest:String(x.dest||""),note:typeof x.note==="string"?x.note:"",at:String(x.at||""),status:String(x.status||"pending"),reply:typeof x.reply==="string"?x.reply:""}; });
    requests=next; updateTabCounts(); if(view==="add") render(); },()=>{});
  db.collection("reasons").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(BYID[d.id]&&typeof x.text==="string") next[d.id]={group:typeof x.group==="string"?x.group:"",text:x.text}; });
    reasons=next; if(["T","G","B","N"].includes(view)) render(); },()=>{});
})();
</script>
