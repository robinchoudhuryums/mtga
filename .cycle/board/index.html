<title>Sultai pile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* First paint: a stored theme choice wins (shared with the dashboard's mtga-prefs), else the OS scheme. */
(function(){ try{ var p=JSON.parse(localStorage.getItem("mtga-prefs")||"{}")||{}; if(p.theme==="light"||p.theme==="dark") document.documentElement.setAttribute("data-theme",p.theme); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Builder page — generated by scripts/builder.py render from this template + builds/<slug>/build.json.
   PAGE = TEMPLATE + DATA: styling never touches card data. Layout: masthead and deck strip, sticky pile
   tabs, then a dense card list beside a collapsible sticky detail pane. Each deck's accent comes from its
   own main colour, so nothing here is tied to one deck or clan. */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --idW:#b39a3e; --idU:#2f6fb0; --idB:#4a4246; --idR:#b9472f; --idG:#2f7a45; --idC:#999b95;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;min-width:0}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch;flex:1 1 30ch}
.mast .homelink{margin-left:auto;color:var(--accent);font-size:.88rem;align-self:center}
.mast .homelink:not([hidden]) ~ .undobtn{margin-left:0}
.mast .undobtn{margin-left:auto}
.themebtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.themebtn:hover{color:var(--ink);border-color:var(--brass)}
.pip{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;border-radius:999px;font:700 .72rem/1 var(--ui);color:var(--pip-ink);background:var(--pC);border:1px solid rgba(0,0,0,.22)}

/* deck strip */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
details.deck{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--dc);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);min-width:0}
details.deck > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;align-items:center}
details.deck > summary::-webkit-details-marker{display:none}
.portrait{grid-row:1 / span 2;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--dc);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent);background:var(--raise)}
.portrait img{width:180%;max-width:none;margin:-34% 0 0 -40%;display:block}
details.deck h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.04em;color:var(--dc);overflow-wrap:anywhere;min-width:0}
.sumline{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.dmeta{font-size:.82rem;color:var(--muted);margin:8px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem}
.kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.chg{color:var(--accent)}
.protlist{font-size:.82rem;color:var(--muted);margin-top:6px} .protlist summary{cursor:pointer;color:var(--accent);width:max-content}
.protlist p{margin:4px 0 0}

.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:.88rem}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding-top:4px}
.tab{position:relative;background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab .n{font-family:var(--mono);font-size:.76rem;margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc)}
.tab.pile::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--tc) var(--pct,0%),color-mix(in srgb,var(--tc) 18%,transparent) var(--pct,0%))}
.intro{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:90ch;font-size:.95rem}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.toolbar label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.toolbar input[type=search]{width:min(260px,100%)}
.toolbar label.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--ink);padding-bottom:5px}
.count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-bottom:6px}
.panebtn{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--muted);font-size:.84rem;margin-bottom:3px}
.panebtn:hover{color:var(--ink);border-color:var(--accent)}
.filtbtn{display:none;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer;width:max-content}
@media (max-width:1000px){ .panebtn{display:none} }
@media (max-width:760px){ .filtbtn{display:inline-block} .toolbar:not(.open) > label:not(:first-child){display:none} .toolbar > label:first-child{flex:1 1 100%} .toolbar input[type=search]{width:100%} }

/* console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.console.full,.console.nopane{grid-template-columns:minmax(0,1fr)}
.console.nopane > .detail{display:none}
@media (min-width:1001px){ .console.nopane > .rows{max-width:940px} }
@media (max-width:1000px){ .console{grid-template-columns:minmax(0,1fr)} .console > .detail{display:none} }
.rows{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.rw{border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:none}
.row{display:grid;grid-template-columns:5px 34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px 6px 0;cursor:pointer}
.row:hover{background:var(--raise)}
.row.sel{background:var(--sel)}
.row .stripe{align-self:stretch;background:var(--stripe)}
.row .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.row .main{all:unset;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.row .main:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cost{display:inline-flex;gap:2px;flex:none}
.row .l2{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:.84rem;color:var(--muted)}
.row .why1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seal{font:600 .64rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);border-radius:2px;padding:3px 5px;flex:none}
.tag{font-size:.7rem;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tag.in{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.tag.prot{color:var(--dc);border-color:var(--dc);font-weight:600}
/* quick picks: deck toggles on the top row; Bench and Keep out (per deck, scoped to the pile) underneath */
.q{display:grid;grid-template-columns:repeat(var(--qn,2),minmax(30px,auto));gap:3px}
.qb{display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 6px;min-height:22px;font:500 .74rem/1.3 var(--mono);cursor:pointer;color:var(--muted)}
.qb svg{width:12px;height:12px;display:block}
.qb .qi{display:inline-flex;align-items:center;gap:2px}
.qb:hover{border-color:var(--qc);color:var(--ink)}
.qb[aria-pressed="true"]{background:var(--qc);border-color:var(--qc);color:var(--panel)}
.noteDot{font-size:.8rem;color:var(--accent)}
.tag.own{font-family:var(--mono)}
.tag.sus{border-style:dotted;color:var(--warn);border-color:var(--warn)}
.tag.hid{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.tag.done{color:var(--accent);border-color:var(--accent);font-weight:600}
.rw.applied .row{opacity:.62}
.row .rank{font:500 .72rem/1 var(--mono);color:var(--muted);min-width:2.2em;text-align:right;flex:none}
.rw.paired .row{box-shadow:inset 3px 0 0 var(--dc,var(--accent));background:color-mix(in srgb,var(--dc,var(--accent)) 10%,var(--panel))}
.pairbtn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.pairbtn:hover:not(:disabled){border-color:var(--dc,var(--accent));color:var(--ink)}
.pairbtn:disabled{opacity:.4;cursor:default}
.conf{border:1px solid var(--warn);border-radius:6px;padding:8px 12px;background:var(--panel);font-size:.86rem;color:var(--ink)}
.conf b{color:var(--warn)} .conf ul{margin:4px 0 0;padding-left:18px}
.ownrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ownrow input{width:4.5em;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:var(--ink)}
.undobtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.undobtn:disabled{opacity:.45;cursor:default}
.undobtn:hover:not(:disabled){color:var(--ink);border-color:var(--brass)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 16px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
/* alternate Arena printings (view-only) */
details.arts summary{cursor:pointer;color:var(--accent);width:max-content;font-size:.86rem}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:6px}
.artbtn{all:unset;cursor:zoom-in;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);line-height:1.3}
.artbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.artbtn img,.artbtn .artspr{width:122px;height:89px;border-radius:4px;display:block;object-fit:cover;background-repeat:no-repeat;background-color:var(--raise)}
.artbtn b{color:var(--ink);font-weight:600}
dialog#artzoom{border:none;padding:0;background:transparent;max-width:min(94vw,560px)}
dialog#artzoom::backdrop{background:rgba(0,0,0,.72)}
#artbig{width:min(90vw,366px);aspect-ratio:366/267;border-radius:10px;background-repeat:no-repeat;margin:0 auto}
/* compare view */
.cmphead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:10px}
.cmphead label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmphead select,.cmphead input{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:var(--panel);border:none;padding:5px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--ink);font-weight:600}
.cmpcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.cmpcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.cmpcol h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em;color:var(--dc,var(--ink))}
.cmpcol .rows{max-height:calc(100vh - 230px);overflow:auto}
@media (max-width:1000px){ .seg{display:inline-flex} .cmpcols{grid-template-columns:minmax(0,1fr)} .cmpcols[data-side="L"] .cmpcol[data-side="R"],.cmpcols[data-side="R"] .cmpcol[data-side="L"]{display:none} .cmpcol .rows{max-height:none} }
/* mana curve, now vs after */
.curve{background:var(--raise);border-left:2px solid var(--dc);border-radius:4px;padding:8px 10px}
.curve h4{margin:0 0 6px;font-size:.9rem}
.curve .bars{margin-top:14px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:92px;border-bottom:1px solid var(--line)}
.curve .grp{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%;position:relative}
.curve .b{width:min(14px,40%);border-radius:4px 4px 0 0;min-height:1px}
.curve .b.now{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.curve .b.aft{background:var(--dc)}
.curve .v{position:absolute;font:500 .68rem/1 var(--mono);color:var(--ink)}
.curve .ax{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font:500 .7rem/1.6 var(--mono);color:var(--muted);text-align:center}
.curve .leg{display:flex;gap:12px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.curve .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:var(--read);font-style:italic}
/* inline comment row (same note as the pane) */
.inote{display:flex;gap:8px;align-items:flex-start;padding:4px 10px 8px 49px;background:var(--sel)}
.inote textarea{flex:1;min-height:2.4em}
.inote .saved{align-self:center}

/* hover preview while the pane is collapsed */
#peek{position:fixed;z-index:30;width:280px;pointer-events:none;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);background:var(--raise)}
#peek img{width:100%;display:block;border-radius:12px}

/* detail */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--brass) 70%,transparent);border-radius:6px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.dimg{display:flex;align-items:center;gap:6px;justify-content:center}
.dimg button.big{all:unset;cursor:zoom-in;display:block;max-width:320px;width:100%}
.dimg button.big:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.dimg img{width:100%;border-radius:12px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.step{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none;font-size:1.1rem;line-height:1}
.dname{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtype{margin:-6px 0 0;color:var(--muted);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.reason{font-family:var(--read);font-size:.98rem;line-height:1.55;margin:0}
.reason .seal{display:inline-block;margin-right:6px;vertical-align:2px}
.reason code{font-family:var(--mono);font-size:.82em;background:var(--raise);border-radius:3px;padding:0 3px}
.reason.pending{color:var(--muted);font-style:italic}
.rules{font-size:.86rem}
.rules summary{cursor:pointer;color:var(--accent);width:max-content}
.rules p{white-space:pre-wrap;margin:6px 0 0;font-family:var(--read)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks.dp{align-items:center;margin-bottom:6px}
.picks .dpl{flex:0 0 5.5em;font:600 .78rem/1.2 var(--ui);color:var(--dc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.pb:hover{border-color:var(--qc,var(--accent))}
.pb[aria-pressed="true"]{background:color-mix(in srgb,var(--qc,var(--accent)) 16%,var(--panel));border-color:var(--qc,var(--accent));font-weight:600}
.field-l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select.pair,textarea.note,.addform textarea,.addform input,.addform select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.88rem;color:var(--ink)}
textarea.note{resize:vertical;min-height:3.2em;font-family:var(--read)}
.ghost{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;cursor:pointer;width:max-content;font-size:.84rem}
.saved{font-size:.78rem;color:var(--accent);min-height:1em}
.kbd{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.kbd span{border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:2px}

/* sheet (phone detail) */
dialog#sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:14px 14px 0 0;background:var(--panel);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(0,0,0,.5)}
dialog#sheet .detail{position:static;max-height:none;border:none;box-shadow:none;border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheetbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}

/* full-width views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.dlist{border-top:2px solid var(--dc)}
.dlist h3{color:var(--dc)}
.tablewrap{overflow-x:auto}
.dlist table,.proj table{width:100%;border-collapse:collapse;font-size:.86rem}
.dlist th,.dlist td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dlist thead th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dlist td:first-child{font-family:var(--mono);color:var(--muted)}
.dlist tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--raise) 70%,transparent)}
.dlist tr.cutrow td{background:var(--sel)}
.dlist tr.protsep th{color:var(--dc);font-family:var(--display);font-weight:400;padding-top:12px;border-bottom:1px solid var(--dc)}
.dlist td.marks{white-space:nowrap}
.linkish{all:unset;cursor:zoom-in;border-bottom:1px dotted var(--muted)}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 7px;font-size:.76rem;cursor:pointer;margin:0 2px 2px 0}
.mini[aria-pressed="true"]{background:color-mix(in srgb,var(--dc) 18%,var(--panel));border-color:var(--dc);font-weight:600}
.proj{border-left:2px solid var(--dc);background:var(--raise);border-radius:4px;padding:8px 10px;margin:0 0 10px}
.proj h4{margin:0 0 4px;font-size:.9rem}
.proj th[scope=row]{text-align:left;font-weight:500;padding:2px 10px 2px 0}
.proj td{font-family:var(--mono);padding:2px 10px 2px 0}
.warnline{color:var(--warn);font-size:.85rem;margin:6px 0 0}
.status{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--panel);border:none;border-radius:5px;padding:7px 14px;cursor:pointer;font-weight:600}
.plist h3{font-size:1rem;margin-top:12px} .plist ul{margin:0;padding-left:18px} .plist li{margin:3px 0}
.addform{display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reqs{padding-left:18px;margin:6px 0 10px} .reqs li{margin-bottom:6px}

/* dialogs */
dialog#zoom{border:none;padding:0;background:transparent;max-width:min(92vw,560px)}
dialog#zoom::backdrop{background:rgba(0,0,0,.72)}
dialog#zoom img{display:block;width:100%;border-radius:14px}
.zoombar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.zoombar span{color:#fff;font-size:.88rem;text-shadow:0 1px 2px #000}
.zoombar button{border:none;border-radius:999px;padding:4px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
dialog#cmp{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(96vw,900px);padding:16px}
dialog#cmp::backdrop{background:rgba(0,0,0,.6)}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:8px 0 12px}
.cmpside img{width:100%;max-width:260px;border-radius:10px;display:block}
.cmplab{font:600 .7rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.cmpside .rules p{font-size:.86rem}
@media (prefers-reduced-motion:no-preference){ .row{transition:background-color .12s} .pb,.qb{transition:background-color .12s,border-color .12s} }
</style>

<div class="wrap">
  <header class="mast">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <a class="homelink" id="homelink" hidden>← Dashboard</a>
    <button type="button" class="undobtn" id="undobtn" disabled>↶ Undo</button>
    <button type="button" class="themebtn" id="themebtn"></button>
  </header>
  <section class="decks" id="decks" aria-label="The decks"></section>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Piles"></nav>
  <p class="intro" id="intro"></p>
  <button type="button" id="filtbtn" class="filtbtn" aria-expanded="false" aria-controls="toolbar">Show filters</button>
  <div class="toolbar" id="toolbar">
    <label for="q">Search<input type="search" id="q" placeholder="Name, type or rules text"></label>
    <label for="mem">In list<select id="mem"></select></label>
    <label for="grp">Reason<select id="grp"><option value="all">Any</option></select></label>
    <label for="role">Role<select id="role"><option value="all">Any</option><option>Interaction</option><option>Card advantage</option><option>Ramp</option><option>Recursion</option><option>Payoff / engine</option><option value="none">No detected role</option></select></label>
    <label for="mvf">Mana value<select id="mvf"><option value="all">Any</option><option value="lo">0–2</option><option value="mid">3–4</option><option value="hi">5+</option></select></label>
    <label for="ownf">Owned<select id="ownf"><option value="all">Any</option><option value="own">Owned</option><option value="craft">To craft</option></select></label>
    <label for="rar">Rarity<select id="rar"><option value="all">Any</option><option value="M">Mythic</option><option value="R">Rare</option><option value="U">Uncommon</option><option value="C">Common</option></select></label>
    <label for="sort">Sort<select id="sort"><option value="group">Swap candidates first</option><option value="name">Name</option><option value="mv">Mana value</option></select></label>
    <label class="check" for="swaponly"><input type="checkbox" id="swaponly"> Swap candidates only</label>
    <label class="check" for="hidemarked"><input type="checkbox" id="hidemarked"> Hide marked</label>
    <label class="check" for="hideapplied"><input type="checkbox" id="hideapplied" checked> Hide applied</label>
    <button type="button" class="panebtn" id="panebtn" aria-controls="detail" aria-expanded="true">Hide card pane</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main class="console" id="console">
    <div class="rows" id="rows" role="list" aria-label="Cards"></div>
    <aside class="detail" id="detail" aria-label="Selected card"></aside>
  </main>
</div>

<div id="peek" hidden aria-hidden="true"><img alt=""></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

  return "img/lg/"+c.id+".jpg"; }

let picks = {}, reasons = {}, requests = {};
let db = null, canWrite = true, view = PILEKEYS[0]||"lists", VISIBLE = [], SEL = null, NOTEOPEN = null, NOTECOL = "";
const CMP = {pile:"all", deck:DK[0], side:"L", q:""}; let ACTIVECOL = "", COLIDS = {L:[], R:[]};
const PROT = Object.fromEntries(DK.map(k=>[k,new Set((LIVE[k]||{}).protect||[])]));
const HROLES = ["interaction","card advantage"];

/* ---------- preferences: theme (shared with the dashboard) and the pane ---------- */
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||"{}")||{}; }catch(e){ return {}; } }
function effectiveTheme(){ const a=document.documentElement.getAttribute("data-theme"); if(a==="light"||a==="dark") return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }
function paintThemeBtn(){ const t=effectiveTheme(), b=document.getElementById("themebtn"), next=t==="dark"?"light":"dark";
  b.textContent = t==="dark" ? "☾ Dark" : "☀ Light"; b.setAttribute("aria-label",`Theme: ${t}. Switch to ${next}`); b.title=`Switch to ${next} (t)`; }
function toggleTheme(){ const next=effectiveTheme()==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next);
  const p=readJSON("mtga-prefs"); p.theme=next; try{ localStorage.setItem("mtga-prefs",JSON.stringify(p)); }catch(e){} paintThemeBtn(); }
const PREFS = readJSON("builder-prefs");
let PANE = PREFS.pane!=="closed";
function savePrefs(){ try{ localStorage.setItem("builder-prefs",JSON.stringify({pane:PANE?"open":"closed"})); }catch(e){} }
function applyPane(){ const con=document.getElementById("console"), b=document.getElementById("panebtn");
  con.classList.toggle("nopane",!PANE); b.setAttribute("aria-expanded",String(PANE)); b.textContent=PANE?"Hide card pane":"Show card pane"; b.title=(PANE?"Hide":"Show")+" the card pane (p)"; if(PANE) hidePeek(); }
function togglePane(){ PANE=!PANE; savePrefs(); applyPane(); }

function pips(cost){
  return (String(cost||"").split(" // ")[0].match(/\{[^}]+\}/g)||[]).map(t=>{
    const s=t.slice(1,-1), parts=s.split("/"), col=x=>({W:"--pW",U:"--pU",B:"--pB",R:"--pR",G:"--pG"})[x];
    const bg = parts.length===2&&col(parts[0])&&col(parts[1]) ? `linear-gradient(135deg,var(${col(parts[0])}) 50%,var(${col(parts[1])}) 50%)` : col(parts[0])?`var(${col(parts[0])})`:"var(--pC)";
    return `<span class="pip" style="background:${bg}" title="${esc(t)}">${esc(parts.length===2&&parts[1]==="P"?parts[0]:s.length>2?s[0]:s)}</span>`; }).join("");
}
function stripe(c){ const cols=[...new Set(((c.c||"").split(" // ")[0].match(/[WUBRG]/g)||[]))].sort((a,b)=>"WUBRG".indexOf(a)-"WUBRG".indexOf(b));
  const v=(cols.length?cols:["C"]).map(x=>`var(--id${x})`); if(v.length===1) v.push(v[0]); return `linear-gradient(${v.join(",")})`; }
function reasonOf(c){ const r=reasons[c.id]; if(r&&r.text) return {g:r.group||"",w:r.text}; return c.w?{g:c.g,w:c.w}:null; }
const isSwap = c => { const r=reasonOf(c); return !!r && (r.g==="A"||r.g==="Swap candidate"); };
const groupLabel = g => GROUP[g]||g||"Reason";
const gk = c => { const g=(reasonOf(c)||{}).g||"zz"; return (g==="A"||g==="Swap candidate")?"00":g; };
const marked = id => ((picks[id]||{}).picks||[]).some(v=>!/^(un)?prot/.test(v));
/* Applied: the deck files already show this pick (the swap or header edit landed). */
function isApplied(id,v){ const k=deckOfPick(v), c=BYID[id], nm=nameOf(id); if(!k) return false;
  if(v==="add"+k) return !!(c&&c["i"+k]); if(v==="cut"+k) return !!c&&!c["i"+k];
  if(v==="prot"+k) return PROT[k].has(nm); if(v==="unprot"+k) return !PROT[k].has(nm); return false; }
const pending = id => ((picks[id]||{}).picks||[]).filter(v=>!isApplied(id,v));
const hasApplied = id => ((picks[id]||{}).picks||[]).some(v=>isApplied(id,v));
const hasPick = (id,v) => ((picks[id]||{}).picks||[]).includes(v);
/* Hidden roles: a role the classifier does not count. Suspected (hr) are the classifier's own
   coverage flags; confirmed come from build.json (hc) or from a mark on this page (hid). */
const hidOf = c => [...new Set([...(c.hc||[]), ...((picks[c.id]||{}).hid||[])])];
const hidBonus = (c,role) => hidOf(c).includes(role) && !(role==="interaction"?c.ri:c.rc) ? 1 : 0;
function conflicts(){ const out=[];
  DK.forEach(k=>{ const d=DECKS[k], uses={};
    Object.keys(picks).forEach(id=>{ if(!hasPick(id,"add"+k)||isApplied(id,"add"+k)) return; const cut=(picks[id].pair||{})[k]; if(!cut) return;
      (uses[cut]=uses[cut]||[]).push(nameOf(id)); const cc=BYID[slug(cut)];
      if(!cc||!cc["i"+k]) out.push({k,ids:[id],msg:`${nameOf(id)} is set to replace ${cut}, which is no longer in ${d.label}.`});
      else if(cc["p"+k]&&!hasPick(cc.id,"unprot"+k)) out.push({k,ids:[id,cc.id],msg:`${nameOf(id)} is set to replace ${cut}, a protected card in ${d.label}.`}); });
    Object.entries(uses).forEach(([cut,adds])=>{ if(adds.length>1) out.push({k,ids:[slug(cut),...adds.map(slug)],msg:`${cut} is the cut for ${adds.length} adds in ${d.label}: ${adds.join(", ")}.`}); }); });
  return out; }
function nextBand(k,i,c){ const R=(LIVE[k]||{}).req||{}, order=["D","C","B","A"], cur=bandOf(k,i,c), nx=order[order.indexOf(cur)+1]; if(!nx||!R[nx]) return null;
  const needI=Math.max(0,R[nx][0]-i), needS=Math.max(0,R[nx][1]-(i+c)), parts=[];
  if(needI) parts.push(`+${needI} interaction`); if(needS>needI) parts.push(`+${needS-needI} ${needI?"more ":""}interaction or card advantage`);
  return {b:nx, parts}; }
const hasNote = id => !!((picks[id]||{}).note||"").trim();
const inAny = c => DK.some(k=>c["i"+k]);
const LABEL_RE = new RegExp("^("+DK.map(k=>DECKS[k].label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+"):\\s*");
function firstLine(c){ const r=reasonOf(c); if(!r) return inAny(c) ? "In the list" : ""; let t=plain(r.w).replace(LABEL_RE,""); const m=t.match(/^(.{20,140}?[.;])\s/); return m?m[1]:t.slice(0,140); }
const RAR = {M:"mythic",R:"rare",U:"uncommon",C:"common"};
function own(c){ return c.o ? `Owned ×${c.o}` : `Craft ${RAR[c.r]||c.r}`; }
function ownTag(c){ const q=(picks[c.id]||{}).own, fix=(q!==undefined&&q!==null&&q!==c.o)?` → ${q}`:"";
  return `<span class="tag own" title="${c.o?`You own ${c.o}`:`Not owned — a ${RAR[c.r]||c.r} craft`}${fix?`; correction queued: ${q}`:""}">${c.o?`×${c.o}`:`craft ${esc(c.r)}`}${fix}</span>`; }
function roleTags(c, all){ const hid=hidOf(c), sus=(c.hr||[]).filter(r=>!hid.includes(r)), cap=r=>r[0].toUpperCase()+r.slice(1);
  const short=r=>all?cap(r):(r==="interaction"?"Int":"CA");
  return [...(c.ro||[]).slice(0, all?99:1).map(r=>`<span class="tag">${esc(r)}</span>`),
    ...hid.map(r=>`<span class="tag hid" title="Counts as ${r} in play; the tools do not count it">${short(r)} · hidden</span>`),
    ...sus.map(r=>`<span class="tag sus" title="Reads like ${r}, but the classifier did not count it — read the text">${short(r)}?</span>`)].join(""); }

/* ---------- rows ---------- */
function quick(c){ const p=(picks[c.id]||{}).picks||[];
  const dbtn = DK.map(k=>{ const inK=c["i"+k], v=(inK?"cut":"add")+k; return `<button type="button" class="qb" style="--qc:${DECKS[k].dc}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${inK?"−":"+"}${esc(DECKS[k].label[0])}</button>`; }).join("");
  const n=Math.max(2,DK.length), pad=(xs)=>xs.concat(Array(Math.max(0,n-xs.length)).fill("<span></span>")).join(""), scope=pileScope(c);
  const xb=(kind,k)=>{ if(c["i"+k]) return "<span></span>"; const v=kind+k;
    return `<button type="button" class="qb" style="--qc:${pickColour(v)}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}"><span class="qi">${ICON[kind]}${esc(DECKS[k].label[0])}</span></button>`; };
  const xbtn = scope.length===1 ? pad([xb("bench",scope[0]),xb("out",scope[0])]) : pad(scope.map(k=>xb("bench",k)))+pad(scope.map(k=>xb("out",k)));
  return `<span class="q" style="--qn:${n}">${dbtn}${"<span></span>".repeat(n-DK.length)}${xbtn}</span>`; }
function noteRowHTML(c,col){ const p=picks[c.id]||{};
  return `<div class="inote"><textarea class="note" id="ni-${col}${c.id}" data-id="${c.id}" rows="1" aria-label="Note for Claude on ${esc(c.n)}" placeholder="A note for Claude on ${esc(c.n)} (Esc to close)">${esc(p.note||"")}</textarea><span class="saved" data-saved="${c.id}" aria-live="polite"></span></div>`; }
/* A row. `col` is "" in a pile view, "L"/"R" in the Compare view (a card can be in both columns,
   so rows are found by data attributes, never by id). The deck column adds the cut rank and ⇄. */
function rowHTML(c, col=""){
  const tags = DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected":"In"} ${esc(DECKS[k].label)}</span>`).join("");
  const ap = hasApplied(c.id), k=CMP.deck, d=DECKS[k];
  let extra="", cls="", lead="";
  if(col==="R"){ const x=d.list.find(x=>x.n===c.n)||{}, s=BYID[SEL], cutBy=pairedTo(k,c.n);
    lead=`<span class="rank" title="${x.prot?"Protected":"Cut rank (1 = most cuttable)"}">${x.prot?"P":"#"+(x.r??"–")}</span>`;
    const can = s && !s["i"+k] && s.id!==c.id;
    extra=`<button type="button" class="pairbtn" style="--dc:${d.dc}" data-pair="${c.id}" ${can?"":"disabled"} aria-label="${can?`${esc(s.n)} replaces ${esc(c.n)}`:`Select a pile card first, then pair it with ${esc(c.n)}`}" title="${can?`${esc(s.n)} replaces this`:"Select a pile card first"}">⇄</button>`;
    if(s && (((picks[s.id]||{}).pair||{})[k]===c.n)) cls=" paired";
    if(cutBy.length) lead+=`<span class="tag" title="Chosen as the cut">→ ${esc(cutBy.join(", "))}</span>`; }
  if(col==="L"){ const s=BYID[SEL]; if(s&&s.id===c.id) cls=" paired"; }
  return `<div class="rw${ap?" applied":""}${cls}" role="listitem" data-w="${c.id}" data-col="${col}" style="--dc:${d?d.dc:"var(--accent)"}"><div class="row ${c.id===SEL?"sel":""}" data-row="${c.id}" style="--stripe:${stripe(c)}">
    <span class="stripe" aria-hidden="true"></span>
    <span class="th">${thumb(c)}</span>
    <button type="button" class="main" data-sel="${c.id}" aria-current="${c.id===SEL}" aria-expanded="${NOTEOPEN===c.id&&NOTECOL===col}" title="Click again to write a note">
      <span class="l1"><span class="nm">${esc(c.n)}</span><span class="cost">${pips(c.c)}</span><span class="noteDot" title="Has a note"${hasNote(c.id)?"":" hidden"}>✎</span></span>
      <span class="l2">${lead}${ap?`<span class="tag done">Applied ✓</span>`:""}${isSwap(c)?`<span class="seal">Swap</span>`:""}${col==="R"?"":tags}${ownTag(c)}${(c.al||[]).length>1?`<span class="tag" title="${c.al.length} artworks on Arena — see the card pane">⧉${c.al.length}</span>`:""}${roleTags(c,false)}<span class="why1">${esc(firstLine(c))}</span></span>
    </button>
    ${extra}${quick(c)}
  </div>${NOTEOPEN===c.id&&NOTECOL===col?noteRowHTML(c,col):""}</div>`;
}
/* ---------- detail ---------- */
function pairSelects(c){ const p=picks[c.id]||{}, v=p.picks||[];
  return DK.filter(k=>v.includes("add"+k)).map(k=>{ const d=DECKS[k], cur=(p.pair||{})[k]||"";
    const opt=x=>`<option value="${esc(x.n)}" ${x.n===cur?"selected":""}>${x.prot?"":`#${x.r??"–"} `}${esc(x.n)}</option>`;
    return `<label class="field-l" for="pair-${k}-${c.id}">In ${esc(d.label)}, this replaces</label><select class="pair" id="pair-${k}-${c.id}" data-id="${c.id}" data-k="${k}"><option value="">Choose a card (weakest fit first)</option>${d.list.filter(x=>!x.prot).map(opt).join("")}<optgroup label="Protected">${d.list.filter(x=>x.prot).map(opt).join("")}</optgroup></select>`; }).join(""); }
function compareBtns(c){ const p=picks[c.id]||{}; return DK.filter(k=>(p.picks||[]).includes("add"+k)&&(p.pair||{})[k]&&BYID[slug(p.pair[k])]).map(k=>`<button type="button" class="ghost" data-cmp="${c.id}" data-cut="${slug(p.pair[k])}">Compare with ${esc(p.pair[k])}</button>`).join(""); }
function detailHTML(c, inSheet){
  if(!c) return `<p class="empty">Choose a card from the list.</p>`;
  const p=picks[c.id]||{}, v=p.picks||[], r=reasonOf(c), idx=VISIBLE.indexOf(c.id), sfx=inSheet?"-s":"";
  const pb=(val,label)=>`<button type="button" class="pb" style="--qc:${pickColour(val)}" data-id="${c.id}" data-v="${val}" aria-pressed="${v.includes(val)}" aria-label="${esc(PICKLAB[val]||label)}: ${esc(c.n)}">${label}</button>`;
  const chips=[...DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected in":"In"} ${esc(DECKS[k].label)}</span>`), `<span class="tag">${esc(own(c))}</span>`, roleTags(c,true)].join("");
  const applied=v.filter(x=>isApplied(c.id,x)), conf=conflicts().filter(x=>x.ids.includes(c.id));
  const oq=p.own, hid=hidOf(c);
  const hb=role=>{ const fromBuild=(c.hc||[]).includes(role), on=hid.includes(role);
    return `<button type="button" class="pb" data-hid="${c.id}" data-role="${role}" aria-pressed="${on}" ${fromBuild?`disabled title="Recorded in the build"`:""}>Counts as ${role}${fromBuild?" ✓":""}</button>`; };
  const keys = DK.length>1 ? `<span>1</span>–<span>${DK.length}</span> decks` : `<span>1</span> deck`;
  return `<div class="dimg">${idx>-1&&VISIBLE.length>1?`<button type="button" class="step" data-step="-1" aria-label="Previous card">‹</button>`:""}
      <button type="button" class="big" data-zoom="${c.id}" aria-label="Show ${esc(c.n)} full screen"><img src="${esc(imgSrc(c,"l"))}" data-fb="${esc(fallbackOf(c))}" alt="${esc(c.n)}"></button>
      ${idx>-1&&VISIBLE.length>1?`<button type="button" class="step" data-step="1" aria-label="Next card">›</button>`:""}</div>
    <h2 class="dname">${esc(c.n)} <span class="cost">${pips(c.c)}</span></h2>
    <p class="dtype">${esc(c.t)}${idx>-1?` · ${idx+1} of ${VISIBLE.length}`:""}</p>
    <div class="chips">${chips}</div>
    ${applied.length?`<p class="status"><span class="tag done">Applied ✓</span> ${esc(applied.map(x=>PICKLAB[x]).join("; "))} — the deck file already shows it.</p>`:""}
    ${conf.length?`<div class="conf" role="note"><b>⚠ Conflict</b><ul>${conf.map(x=>`<li>${esc(x.msg)}</li>`).join("")}</ul></div>`:""}
    ${r?`<p class="reason">${isSwap(c)?`<span class="seal">Swap candidate</span>`:`<span class="seal">${esc(groupLabel(r.g))}</span>`}${fmt(r.w)}</p>`:`<p class="reason pending">${inAny(c)?"In the list.":"No reason written yet."}</p>`}
    <details class="rules"><summary>Rules text</summary><p>${esc(c.x||"(no rules text)")}</p></details>
    ${artsHTML(c)}
    ${[...pileScope(c),...DK.filter(k=>!pileScope(c).includes(k))].map(k=>{ const l=esc(DECKS[k].label);
      return `<div class="picks dp" role="group" aria-label="${l}: your pick for ${esc(c.n)}"><span class="dpl" style="--dc:${DECKS[k].dc}" aria-hidden="true">${l}</span>${c["i"+k]?pb("cut"+k,"− Cut"):pb("add"+k,"+ Add")+pb("bench"+k,"Bench")+pb("out"+k,"Keep out")}</div>`; }).join("")}
    ${DK.some(k=>!c["i"+k])?`<p class="status">For each deck, Add, Bench and Keep out exclude each other: choosing one clears the other two.</p>`:""}
    ${pairSelects(c)}${compareBtns(c)}
    ${c.land?"":`<div class="picks" role="group" aria-label="Roles the tools do not count">${HROLES.map(hb).join("")}</div>`}
    <div class="ownrow"><label class="field-l" for="own-${c.id}${sfx}">I own exactly</label><input type="number" min="0" max="99" inputmode="numeric" id="own-${c.id}${sfx}" data-own="${c.id}" value="${oq??""}" placeholder="${c.o||0}">
      <span class="status">${c.o?`records say ×${c.o}`:"records say not owned"}${c.pr?` · ${esc(c.pr)}`:""}${oq!=null&&oq!==""?" · correction queued":""}</span></div>
    <label class="field-l" for="n-${c.id}${sfx}">Note for Claude</label>
    <textarea class="note" id="n-${c.id}${sfx}" data-id="${c.id}" rows="2" placeholder="A question, a hunch, a combo to check">${esc(p.note||"")}</textarea>
    <span class="saved" data-saved="${c.id}" aria-live="polite"></span>
    ${inSheet?"":`<p class="kbd"><span>j</span><span>k</span> move · ${keys} · <span>b</span> bench · <span>o</span> keep out (this pile's deck; every deck on a shared pile) · <span>n</span> note · <span>p</span> pane · <span>u</span> undo · <span>t</span> theme · <span>/</span> search · <span>z</span> zoom</p>`}`;
}
function renderDetail(){ const c=BYID[SEL]; document.getElementById("detail").innerHTML=detailHTML(c,false);
  const sh=document.getElementById("sheet"); if(sh.open) document.getElementById("sheetbody").innerHTML=`<div class="detail">${detailHTML(c,true)}</div>`; }
const narrow = () => window.matchMedia("(max-width: 1000px)").matches;
const rowEls = id => [...document.querySelectorAll(`.row[data-row="${id}"]`)];
const mainEl = (id,col) => document.querySelector(`.rw[data-w="${id}"]${col!=null?`[data-col="${col}"]`:""} .main`) || document.querySelector(`.rw[data-w="${id}"] .main`);
function select(id, scroll, col){ SEL=id; if(col!=null) ACTIVECOL=col;
  if(view==="compare"){ VISIBLE=COLIDS[ACTIVECOL]||[]; paintCompareRows(); }
  document.querySelectorAll(".row.sel").forEach(r=>{r.classList.remove("sel"); r.querySelector(".main").setAttribute("aria-current","false");});
  rowEls(id).forEach(r=>{ r.classList.add("sel"); r.querySelector(".main").setAttribute("aria-current","true"); });
  if(scroll){ const m=mainEl(id,view==="compare"?ACTIVECOL:null); if(m) m.closest(".row").scrollIntoView({block:"nearest"}); }
  renderDetail(); }

/* ---------- alternate Arena printings (view-only) ---------- */
function artStyle(c,p,scale){ const A=META.arts, at=A&&A.i?A.i[`${c.id}|${p.set}|${p.cn}`]:null; if(!at) return null;
  const [sh,j]=at, W=A.w/scale, H=A.h/scale;
  return `background-image:url(${A.sheets[sh]});background-size:${A.cols*W}px ${A.rows[sh]*H}px;background-position:-${(j%A.cols)*W}px -${Math.floor(j/A.cols)*H}px`; }
function artThumb(c,p){ if(META.img==="remote") return `<img src="${esc(p.art)}" alt="" loading="lazy" width="122" height="89">`;
  const st=artStyle(c,p,3); return st?`<span class="artspr" style="${st}"></span>`:`<span class="artspr"></span>`; }
const artLabel = p => `${p.sn||p.set} (${p.set}) #${p.cn} · ${RAR[p.r]||p.r}${p.y?` · ${p.y}`:""}${p.a?` · art by ${p.a}`:""}${(p.fx||[]).length?` · ${p.fx.join(", ")}`:""}`;
function artsHTML(c){ const al=c.al||[]; if(al.length<2) return "";
  return `<details class="arts"><summary>Arena printings · ${al.length} artworks</summary>
    <p class="status">Every artwork of this card on Arena, oldest first. View only — pick the art in Arena (a borderless frame of the same art is not listed).</p>
    <div class="artgrid">${al.map((p,i)=>`<button type="button" class="artbtn" data-art="${c.id}" data-ai="${i}" aria-label="Enlarge: ${esc(artLabel(p))}">${artThumb(c,p)}<span><b>${esc(p.set)} #${esc(p.cn)}</b> · ${esc(p.r)}${p.y?` · ${esc(p.y)}`:""}${(p.fx||[]).length?`<br>${esc(p.fx.join(", "))}`:""}</span></button>`).join("")}</div></details>`; }
function openArt(id,i,from){ const c=BYID[id], p=(c&&c.al||[])[i]; if(!p) return;
  if(META.img==="remote"){ const im=document.getElementById("zoomimg"); ZLIST=[id]; ZI=0; im.dataset.fb=p.im; im.src=(p.im||"").replace("/normal/","/large/"); im.alt=`${c.n} — ${artLabel(p)}`;
    document.getElementById("zoomcap").textContent=`${c.n} · ${artLabel(p)}`; document.getElementById("zoomprev").hidden=document.getElementById("zoomnext").hidden=true;
    const d=document.getElementById("zoom"); d._from=from; if(!d.open&&d.showModal) d.showModal(); return; }
  const big=document.getElementById("artbig");
  big.setAttribute("aria-label",`${c.n} — ${artLabel(p)}`); document.getElementById("artcap").textContent=`${c.n} · ${artLabel(p)}`;
  const d=document.getElementById("artzoom"); d._from=from; if(!d.open&&d.showModal) d.showModal(); fitArt(c,p); }
/* The enlarged art is the sprite cell at its own resolution, scaled to the box's width. */
function fitArt(c,p){ const A=META.arts, at=A&&A.i?A.i[`${c.id}|${p.set}|${p.cn}`]:null, big=document.getElementById("artbig"); if(!at) return;
  const k=big.clientWidth/A.w, [sh,j]=at;
  big.style.backgroundImage=`url(${A.sheets[sh]})`; big.style.backgroundSize=`${A.cols*A.w*k}px ${A.rows[sh]*A.h*k}px`;

  const id=s.dataset.id, p=picks[id]||(picks[id]={picks:[],note:""}); snapshot(id,`${nameOf(id)} replaces ${s.value||"nothing"}`); p.pair=Object.assign({},p.pair||{},{[s.dataset.k]:s.value}); persist(id); renderDecks(); renderDetail(); if(view==="compare") paintCompareRows(); });
document.getElementById("tabs").addEventListener("keydown",e=>{ if(!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const tabs=[...document.querySelectorAll(".tab")], i=tabs.findIndex(t=>t.dataset.k===view), n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length]; setView(n.dataset.k,true); n.focus(); });
const rowsEl=document.getElementById("rows");
rowsEl.addEventListener("mouseover",e=>{ const r=e.target.closest("[data-row]"); if(r) showPeek(r.dataset.row,r); });
rowsEl.addEventListener("mouseleave",hidePeek);
rowsEl.addEventListener("focusin",e=>{ const m=e.target.closest(".main"); if(m) showPeek(m.dataset.sel,m.closest(".row")); else hidePeek(); });
rowsEl.addEventListener("focusout",e=>{ if(!rowsEl.contains(e.relatedTarget)) hidePeek(); });
window.addEventListener("scroll",hidePeek,{passive:true});
rowsEl.addEventListener("scroll",hidePeek,{passive:true,capture:true});
document.addEventListener("keydown",e=>{
  if(document.getElementById("zoom").open){ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); stepZoom(e.key==="ArrowRight"?1:-1); } return; }
  if(document.querySelector("dialog[open]")) return;
  if(e.key==="Escape"&&e.target.closest&&e.target.closest(".inote")){ const id=NOTEOPEN, col=NOTECOL; setNoteOpen(null); const m=mainEl(id,col); if(m) m.focus(); return; }
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag)||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="t"){ toggleTheme(); return; }
  if(e.key==="u"){ undo(); return; }
  if(e.key==="p"&&!narrow()){ togglePane(); return; }
  if(!(isPileView(view)||view==="compare")||!VISIBLE.length) return;
  const col=view==="compare"?ACTIVECOL:"";
  const i=Math.max(0,VISIBLE.indexOf(SEL)), go=n=>{ const id=VISIBLE[(n+VISIBLE.length)%VISIBLE.length]; select(id,true); const m=mainEl(id,col); if(m) m.focus(); };
  const dn=/^[1-9]$/.test(e.key)?+e.key:0;
  if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); go(i+1); }
  else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); go(i-1); }
  else if(dn&&dn<=DK.length){ const k=DK[dn-1], c=BYID[SEL]; if(c){ togglePick(SEL,(c["i"+k]?"cut":"add")+k); refreshView(SEL); } }
  else if(e.key==="b"&&SEL){ toggleScoped(SEL,"bench"); refreshView(SEL); }
  else if(e.key==="o"&&SEL){ toggleScoped(SEL,"out"); refreshView(SEL); }
  else if(e.key==="n"&&SEL){ e.preventDefault(); if(narrow()) openSheet(SEL); else setNoteOpen(SEL,true,col); }
  else if(e.key==="/"){ e.preventDefault(); const q=document.getElementById(view==="compare"?"cmpq":"q"); if(q) q.focus(); }
  else if(e.key==="z"&&SEL){ openZoom(SEL,VISIBLE); } });
window.addEventListener("hashchange",fromHash);
window.matchMedia("(max-width: 1000px)").addEventListener("change",()=>{ renderDecks(); hidePeek(); });
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn);

paintThemeBtn(); paintUndo(); applyPane(); renderTabs(); picks=loadLocal(); requests=readJSON(LSR); renderDecks(); fromHash();

(async()=>{ let api=null;
  try{ api=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ api=null; }
  if(!api){ banner(META.target==="pages" ? "Picks are saved in this browser. To send them to Claude, open Your picks and use Copy as text." : "Picks are saved in this browser only, so Claude cannot read them here. Open the board on claude.ai to share them."); return; }
  db=api;
  try{ const u=await window.claude.use("user"); if(u&&u.can){ const w=await u.can("data.write"); if(w===false){ canWrite=false; banner("You can view this board but not save picks on it."); } } }catch(e){}
  const timer=setTimeout(()=>banner("Saved picks have not loaded yet. Marks you make now still save."),10000);
  db.collection("picks").onSnapshot(snap=>{ if(!snap.metadata.fromCache){ clearTimeout(timer); if(canWrite) banner(""); }
    const next={}, upg=[]; snap.docs.forEach(d=>{ const x=d.data()||{}; if(!nameOf(d.id)) return;
      if(Array.isArray(x.picks)){ const u=upgradeLegacy(d.id,x.picks); if(u!==x.picks){ x.picks=u; upg.push(d.id); } }
      const pair={}; if(x.pair&&typeof x.pair==="object") DK.forEach(k=>{ if(typeof x.pair[k]==="string") pair[k]=x.pair[k]; });
      next[d.id]={picks:Array.isArray(x.picks)?x.picks.filter(v=>PICKLAB[v]):[],note:typeof x.note==="string"?x.note:"",pair,
        own:Number.isInteger(x.own)&&x.own>=0?x.own:null, hid:Array.isArray(x.hid)?x.hid.filter(r=>HROLES.includes(r)):[]}; });
    const local=loadLocal(), migrate=[]; Object.keys(local).forEach(id=>{ if(!next[id]&&nameOf(id)&&((local[id].picks||[]).length||local[id].note)){ next[id]=local[id]; migrate.push(id); } });
    const focusedNote=document.activeElement&&document.activeElement.classList.contains("note");
    picks=next; if(!focusedNote){ render(); } else { updateTabCounts(); } renderDecks();
    if(migrate.length){ try{ localStorage.removeItem(LS); }catch(e){} migrate.forEach(persist); }
    if(upg.length&&canWrite) upg.forEach(persist);
  },err=>{ clearTimeout(timer); banner("Saved picks could not be loaded. Reload the page to try again."); });
  db.collection("requests").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(Array.isArray(x.names)) next[d.id]={names:x.names.filter(n=>typeof n==="string").slice(0,300),dest:String(x.dest||""),note:typeof x.note==="string"?x.note:"",at:String(x.at||""),status:String(x.status||"pending"),reply:typeof x.reply==="string"?x.reply:""}; });
    requests=next; updateTabCounts(); if(view==="add") render(); },()=>{});
  db.collection("reasons").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(BYID[d.id]&&typeof x.text==="string") next[d.id]={group:typeof x.group==="string"?x.group:"",text:x.text}; });
    reasons=next; if(isPileView(view)) render(); },()=>{});
})();
</script>
