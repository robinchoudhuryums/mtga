<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sultai Pile Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: deck strip on top, pile tabs, then a filterable card list — a working table for two decks at once. */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --ink:#18201c; --muted:#56655d; --line:#d3dbd5;
  --accent:#0d6f66; --thr:#2e6a2e; --glb:#2a4b8a; --warn:#9a5b00; --bad:#a3322b;
  --chip:#e8eee9; --sel:#d7ece8;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --display:"Alegreya SC", Georgia, serif; --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#171f1c; --ink:#e3eae6; --muted:#95a59d; --line:#2b3732;
  --accent:#43b8aa; --thr:#86c886; --glb:#93b3f2; --warn:#e2a64a; --bad:#ef7d74;
  --chip:#222c28; --sel:#173a35; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#171f1c; --ink:#e3eae6; --muted:#95a59d; --line:#2b3732;
  --accent:#43b8aa; --thr:#86c886; --glb:#93b3f2; --warn:#e2a64a; --bad:#ef7d74;
  --chip:#222c28; --sel:#173a35; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);margin:2px 0 0}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.deck{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.deck h2{font-family:var(--display);font-size:1.2rem;margin:0;color:var(--c)}
.deck .meta{color:var(--muted);font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;font-variant-numeric:tabular-nums}
.stats b{font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:500;background:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:4px}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:none}
.intro p{margin:0;max-width:80ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.tools label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}
.tools input,.tools select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.tools input[type=search]{width:min(320px,80vw)}
.count{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:.92rem}
.banner[hidden]{display:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:420px){.list{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.name{font-weight:700;font-size:1.04rem}
.cost{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.pip{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .2em;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--pip-ink);background:var(--pC);border:1px solid rgba(0,0,0,.25)}
.type{color:var(--muted);font-size:.88rem;margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.chip.inT{color:var(--thr);border-color:var(--thr)}
.chip.inG{color:var(--glb);border-color:var(--glb)}
.chip.key{color:var(--accent);border-color:var(--accent)}
.why{border-left:3px solid var(--line);padding-left:9px;font-size:.93rem}
.why .g{font-weight:700;color:var(--ink)}
.why.pending{color:var(--muted);font-style:italic}
.why.swap{border-left-color:var(--accent)}
code{font-family:inherit;background:var(--chip);border-radius:4px;padding:0 3px}
details{font-size:.9rem}
summary{cursor:pointer;color:var(--accent);width:max-content}
.oracle{white-space:pre-wrap;margin:6px 0 0;color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--ink);font-weight:700}
.pick button.t[aria-pressed="true"]{border-color:var(--thr)}
.pick button.g[aria-pressed="true"]{border-color:var(--glb)}
.note{font:inherit;font-size:.88rem;width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.picks h3{font-family:var(--display);margin:6px 0}
.picks ul{margin:0 0 12px;padding-left:18px}
.btn{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer;width:max-content}
.status{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sultai Pile Board</h1>

  <section class="decks" id="decks" aria-label="The two decks"></section>
  <div class="banner" id="banner" hidden></div>

    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <main id="list" class="list"></main>
</div>

lse, "iG": false, "x": "Draw a card. If a graveyard has twenty or more cards in it, draw three cards instead.", "fT": "tangential", "fG": "KEY", "src": "outside", "g": "Swap candidate", "w": "1 mana: \"If a graveyard has twenty or more cards in it, draw three cards instead\" \u2014 the opponent's graveyard passes 20 early here, so it is a 1-mana draw-three (six milled through Corrosion)."}, {"n": "Folio of Fancies", "c": "{1}{U}", "mv": 2, "t": "Artifact \u2014 Book", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Players have no maximum hand size.\n{X}{X}, {T}: Each player draws X cards.\n{2}{U}, {T}: Each opponent mills cards equal to the number of cards in their hand.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Draw engine, outranked", "w": "`{X}{X}, {T}`: each player draws X (both libraries shrink; yours mills them twice through Corrosion), then `{2}{U}` mills them equal to hand size. A real engine; bench."}, {"n": "Lord of the Forsaken", "c": "{4}{B}{B}", "mv": 6, "t": "Creature \u2014 Demon", "r": "M", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Flying, trample\n{B}, Sacrifice another creature: Target player mills three cards.\nPay 1 life: Add {C}. Spend this mana only to cast a spell from your graveyard.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Mill outlet whose cost the deck lacks", "w": "`{B}, Sacrifice another creature: mill three` \u2014 same missing fodder; 6 mana."}, {"n": "Persistent Petitioners", "c": "{1}{U}", "mv": 2, "t": "Creature \u2014 Human Advisor", "r": "C", "o": 0, "p": "G", "iT": false, "iG": false, "x": "{1}, {T}: Target player mills a card. (They put the top card of their library into their graveyard.)\nTap four untapped Advisors you control: Target player mills twelve cards.\nA deck can have any number of cards named Persistent Petitioners.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Mill outlet whose cost the deck lacks", "w": "Its 12-card mill needs four Advisors tapped; it is the one card a deck may run in any number, so it only works as a dozen-copy package \u2014 a different deck."}, {"n": "Cruel Somnophage // Can't Wake Up", "c": "{1}{B} // {1}{U}", "mv": 2, "t": "Creature \u2014 Nightmare // Sorcery \u2014 Adventure", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Cruel Somnophage's power and toughness are each equal to the number of creature cards in all graveyards. // Target player mills four cards. (Then exile this card. You may cast the creature later from exile.)", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "Mill four for 2, then a body that grows with creature cards in all graveyards. Fine; smaller than the deck's 2-mana mills (Glimpse the Unthinkable mills ten)."}, {"n": "Gyruda, Doom of Depths", "c": "{4}{U/B}{U/B}", "mv": 6, "t": "Legendary Creature \u2014 Demon Kraken", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Companion \u2014 Your starting deck contains only cards with even mana values. (If this card is your chosen companion, you may put it into your hand from outside the game for {3} as a sorcery.)\nWhen Gyruda enters, each player mills four cards. Put a creature card with an even mana value from among the milled cards onto the battlefield under your control.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "\"Each player mills four cards\" and you take a creature from among them \u2014 a one-shot, symmetric 6-drop."}, {"n": "Duskmantle, House of Shadow", "c": "", "mv": 0, "t": "Land", "r": "U", "o": 0, "p": "G", "iT": false, "iG": false, "x": "{T}: Add {C}.\n{U}{B}, {T}: Target player mills a card.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Mill outlet whose cost the deck lacks", "w": "A land that makes only colourless \u2014 in a three-colour deck already at 3.5 points of tapped-land cost \u2014 for a 3-mana mill one."}, {"n": "Hama, the Bloodbender", "c": "{2}{U/B}{U/B}{U/B}", "mv": 5, "t": "Legendary Creature \u2014 Human Warlock", "r": "U", "o": 1, "p": "G", "iT": false, "iG": false, "x": "When Hama enters, target opponent mills three cards. Exile up to one noncreature, nonland card from that player's graveyard. For as long as you control Hama, you may cast the exiled card during your turn by waterbending {X} rather than paying its mana cost, where X is its mana value. (While paying a waterbend cost, you can tap your artifacts and creatures to help. Each one pays for {1}.)", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "Owned. Mills three and lets you cast one of their noncreature spells by waterbending \u2014 deck 22's engine piece; a 5-mana one-shot here."}, {"n": "Didn't Say Please", "c": "{1}{U}{U}", "mv": 3, "t": "Instant", "r": "C", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Counter target spell. Its controller mills three cards.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "Counter + mill three \u2014 the same card as Thought Collapse, which is in. The first card to add if you want more counters."}, {"n": "Bloodchief's Thirst", "c": "{B}", "mv": 1, "t": "Sorcery", "r": "U", "o": 0, "p": "B", "iT": false, "iG": false, "x": "Kicker {2}{B} (You may pay an additional {2}{B} as you cast this spell.)\nDestroy target creature or planeswalker with mana value 2 or less. If this spell was kicked, instead destroy target creature or planeswalker.", "fT": "tangential", "fG": "tangential", "src": "outside"}, {"n": "Keening Stone", "c": "{6}", "mv": 6, "t": "Artifact", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "{5}, {T}: Target player mills X cards, where X is the number of cards in that player's graveyard.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Mill outlet whose cost the deck lacks", "w": "6 to cast and `{5}, {T}` to mill X = their graveyard; Riverchurn Monument's exhaust does the same once for 4."}, {"n": "Riverchurn Monument", "c": "{1}{U}", "mv": 2, "t": "Artifact", "r": "R", "o": 1, "p": "G", "iT": false, "iG": false, "x": "{1}, {T}: Any number of target players each mill two cards. (Each of them puts the top two cards of their library into their graveyard.)\nExhaust \u2014 {2}{U}{U}, {T}: Any number of target players each mill cards equal to the number of cards in their graveyard. (Activate each exhaust ability only once.)", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Swap candidate", "w": "Owned. `{1}, {T}`: mill two every turn, and once per game its exhaust mills \"cards equal to the number of cards in their graveyard\" \u2014 doubles a half-milled yard."}, {"n": "Terisian Mindbreaker", "c": "{7}", "mv": 7, "t": "Artifact Creature \u2014 Juggernaut", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Whenever this creature attacks, defending player mills half their library, rounded up.\nUnearth {1}{U}{U}{U} ({1}{U}{U}{U}: Return this card from your graveyard to the battlefield. It gains haste. Exile it at the beginning of the next end step or if it would leave the battlefield. Unearth only as a sorcery.)", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "Half a library on attack, unearth for `{1}{U}{U}{U}`; a 7-mana artifact creature doing Fleet Swallower's job."}, {"n": "Scavenger's Talent", "c": "{B}", "mv": 1, "t": "Enchantment \u2014 Class", "r": "R", "o": 1, "p": "T", "iT": false, "iG": false, "x": "(Gain the next level as a sorcery to add its ability.)\nWhenever one or more creatures you control die, create a Food token. This ability triggers only once each turn.\n{1}{B}: Level 2\nWhenever you sacrifice a permanent, target player mills two cards.\n{2}{B}: Level 3\nAt the beginning of your end step, you may sacrifice three other nonland permanents. If you do, return a creature card from your graveyard to the battlefield with a finality counter on it.", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "G", "w": "Same \u2014 Food and \"whenever you sacrifice\" need an outlet the deck lacks."}, {"n": "Brain Freeze", "c": "{1}{U}", "mv": 2, "t": "Instant", "r": "U", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Target player mills three cards.\nStorm (When you cast this spell, copy it for each spell cast before it this turn. You may choose new targets for the copies.)", "fT": "role-player", "fG": "KEY", "src": "outside", "g": "Different finisher, same job", "w": "Mill three plus storm; the deck casts one or two spells a turn, so it is usually mill three."}, {"n": "Jin-Gitaxias // The Great Synthesis", "c": "{3}{U}{U}", "mv": 5, "t": "Legendary Creature \u2014 Phyrexian Praetor // Enchantment \u2014 Saga", "r": "M", "o": 1, "p": "G", "iT": false, "iG": false, "x": "Ward {2}\nWhenever you cast a noncreature spell with mana value 3 or greater, draw a card.\n{3}{U}: Exile Jin-Gitaxias, then return it to the battlefield transformed under its owner's control. Activate only as a sorcery and only if you have seven or more cards in hand. // (As this Saga enters and after your draw step, add a lore counter.)\nI \u2014 Draw cards equal to the number of cards in your hand. You have no maximum hand size for as long as you control this Saga.\nII \u2014 Return all non-Phyrexian creatures to their owners' hands.\nIII \u2014 You may cast any number of spells from your hand without paying their mana costs. Exile this Saga, then return it to the battlefield (front face up).", "fT": "tangential", "fG": "role-player", "src": "outside", "g": "Swap candidate", "w": "\"Whenever you cast a noncreature spell with mana value 3 or greater, draw a card\" \u2014 28 such spells here, and each draw mills two. Owned. Lost its slot to Jin-Gitaxias, Core Augur, but both fit."}, {"n": "Howling Mine", "c": "{2}", "mv": 2, "t": "Artifact", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "At the beginning of each player's draw step, if this artifact is untapped, that player draws an additional card.", "fT": "tangential", "fG": "tangential", "src": "outside", "g": "Draw engine, outranked", "w": "Symmetric extra draw \u2014 the same job as Dictate of Kruphix, which is in; a second one would refill their hand too. Bench."}, {"n": "Hullbreaker Horror", "c": "{5}{U}{U}", "mv": 7, "t": "Creature \u2014 Kraken Horror", "r": "R", "o": 0, "p": "G", "iT": false, "iG": false, "x": "Flash\nThis spell can't be countered.\nWhenever you cast a spell, choose up to one \u2014\n\u2022 Return target spell you don't control to its owner's hand.\n\u2022 Return target nonland permanent to its owner's hand.", "fT": "tangential", "fG": "tangential", "src": "outside", "g": "Draw engine, outranked", "w": "A 7-mana bounce engine; strong in control, but each turn's mill matters more than tempo here."}, {"n": "Tamiyo, Inquisitive Student // Tamiyo, Seasoned Scholar", "c": "{U}", "mv": 1, "t": "Legendary Creature \u2014 Moonfolk Wizard // Legendary Planeswalker \u2014 Tamiyo", "r": "M", "o": 0, "p": "B", "iT": false, "iG": false, "x": "Flying\nWhenever Tamiyo attacks, investigate. (Create a Clue token. It's an artifact with \"{2}, Sacrifice this token: Draw a card.\")\nWhen you draw your third card in a turn, exile Tamiyo, then return her to the battlefield transformed under her owner's control. // +2: Until your next turn, whenever a creature attacks you or a planeswalker you control, it gets -1/-0 until end of turn.\n\u22123: Return target instant or sorcery card from your graveyard to your hand. If it's a green card, add one mana of any color.\n\u22127: Draw cards equal to half the number of cards in your library, rounded up. You get an emblem with \"You have no maximum hand size.\"", "fT": "tangential", "fG": "KEY", "src": "outside"}, {"n": "Niv-Mizzet, Visionary", "c": "{4}{U}{R}", "mv": 6, "t": "Legendary Creature \u2014 Dragon Wizard", "r": "M", "o": 1, "p": "N", "iT": false, "iG": false, "x": "Flying\nYou have no maximum hand size. function esc(s){return String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");}
function pips(cost){
  if(!cost) return "";

    else bg = col(parts[0]) ? `var(${col(parts[0])})` : "var(--pC)";

}
function inLabel(c){

function fit(c){

function cardHTML(c){

  return `<article class="card ${p&&p.picks&&p.picks.length?"picked":""}" id="c-${c.id}">

  </article>`;
}
const PICKLAB={addT:"Add to Thranduil",cutT:"Cut from Thranduil",addG:"Add to Glarb",cutG:"Cut from Glarb",bench:"Bench",out:"Keep out"};
function picksHTML(){
  const groups={}; Object.entries(picks).forEach(([id,p])=>(p.picks||[]).forEach(v=>(groups[v]=groups[v]||[]).push(id)));

  const tools=document.querySelector(".tools"); tools.style.display=view==="picks"?"none":"";
  const list=document.getElementById("list");
  if(view==="picks"){ list.innerHTML=picksHTML(); document.getElementById("count").textContent=""; return; }
  const q=document.getElementById("q").value.trim().toLowerCase(), mem=document.getElementById("mem").value,
        grp=document.getElementById("grp").value, sort=document.getElementById("sort").value;
  let xs=CARDS.filter(c=>c.p===view);
  const grpSel=document.getElementById("grp"), present=[...new Set(xs.map(c=>(reasonOf(c)||{}).g).filter(Boolean))].sort();
  const cur=grpSel.value; grpSel.innerHTML=`<option value="all">Any</option>`+present.map(g=>`<option value="${g}">${esc(GROUP[g]||g)}</option>`).join("");
  grpSel.value=present.includes(cur)?cur:"all";
  xs=xs.filter(c=>{
    if(q && !(c.n.toLowerCase().includes(q)||(c.x||"").toLowerCase().includes(q)||(c.t||"").toLowerCase().includes(q))) return false;
    if(mem==="neither" && (c.iT||c.iG)) return false;
    if(mem==="T" && !c.iT) return false; if(mem==="G" && !c.iG) return false; if(mem==="both" && !(c.iT&&c.iG)) return false;
    if(grpSel.value!=="all" && (reasonOf(c)||{}).g!==grpSel.value) return false;
    return true;});
  xs.sort((a,b)=> sort==="mv" ? (a.mv??99)-(b.mv??99)||a.n.localeCompare(b.n)
    : sort==="group" ? gk(a).localeCompare(gk(b))||a.n.localeCompare(b.n)
    : a.n.localeCompare(b.n));
  document.getElementById("count").textContent=`${xs.length} of ${CARDS.filter(c=>c.p===view).length} cards`;
  list.innerHTML = xs.length ? xs.map(cardHTML).join("") : `<div class="empty">No cards match. Clear the search or set "In which list" to Any.</div>`;
}
function renderDecks(){
  const cnt=k=>{let a=0,c=0;Object.values(picks).forEach(p=>{const v=p.picks||[];if(v.includes("add"+k))a++;if(v.includes("cut"+k))c++;});return [a,c];};
  document.getElementById("decks").innerHTML=Object.entries(DECKS).map(([k,d])=>{const [a,c]=cnt(k);return `<div class="deck" style="--c:${d.c}">
    <h2>${esc(d.label)} · ${esc(d.full)}</h2><div class="meta">Deck ${esc(d.id)} · commander ${esc(d.cmd)} · 100 cards</div>
    <div class="stats">${d.stats.map(([l,v])=>`<span>${l} <b>${v}</b></span>`).join("")}</div>
    <div class="stats"><span>Your marks: <b>${a}</b> to add · <b>${c}</b> to cut</span></div></div>`;}).join("");
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=PILES.map(p=>`<button class="tab" role="tab" type="button" data-k="${p.k}" id="tab-${p.hash}" aria-selected="false">${esc(p.label)}<span class="n">${p.k==="picks"?0:CARDS.filter(c=>c.p===p.k).length}</span></button>`).join("");
}
function setView(k,push){ view=k; if(push){const h=PILES.find(p=>p.k===k).hash; if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);} render(); }
function fromHash(){ const p=PILES.find(p=>"#"+p.hash===location.hash); setView(p?p.k:"T",false); }

function banner(msg){const b=document.getElementById("banner"); if(msg){b.textContent=msg;b.hidden=false;}else b.hidden=true;}
const LS="sultai-board-picks";
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(picks));}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||"{}")||{};}catch(e){return {};}}
const writing={};
async function persist(id){
  const p=picks[id]||{picks:[],note:""};
  if(!db){ saveLocal(); return; }
  if(writing[id]){ writing[id].again=true; return; }
  writing[id]={again:false};
  try{
    const ref=db.collection("picks").doc(id);
    if(!(p.picks||[]).length && !p.note) await ref.delete();
    else await ref.set({card:BYID[id].n, picks:p.picks||[], note:p.note||"", pile:BYID[id].p, at:new Date().toISOString()});
  }catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;banner("You can view this board but not save picks on it.");}
    else if(e&&e.code==="quota_exceeded") banner("The board's storage is full, so this pick was not saved.");
    else banner("A pick could not be saved just now. Try clicking it again.");
  }
  const again=writing[id].again; delete writing[id]; if(again) persist(id);
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(t){ setView(t.dataset.k,true); return; }
  const j=e.target.closest("[data-jump]"); if(j){ e.preventDefault(); const c=BYID[j.dataset.jump]; setView(c.p,true);
     document.getElementById("q").value=c.n; render(); return; }
  if(e.target.id==="copy"){
    const lines=[]; ["addT","cutT","addG","cutG","bench","out"].forEach(v=>{const ids=Object.keys(picks).filter(id=>(picks[id].picks||[]).includes(v));
      if(ids.length){lines.push(PICKLAB[v]+":");ids.sort().forEach(id=>lines.push("  - "+BYID[id].n+(picks[id].note?" — "+picks[id].note:"")));}});
    const txt=lines.join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>document.getElementById("copied").textContent="Copied.",()=>document.getElementById("copied").textContent="Copy was blocked here; select the list above instead.");
    return; }
  const b=e.target.closest(".pick button"); if(!b) return;
  if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const id=b.dataset.id, v=b.dataset.v; const p=picks[id]||(picks[id]={picks:[],note:""});
  let s=new Set(p.picks||[]);
  if(s.has(v)) s.delete(v); else { s.add(v); if(v==="out"){["addT","addG","bench"].forEach(x=>s.delete(x));} if(v.startsWith("add")||v==="bench") s.delete("out"); }
  p.picks=[...s]; render(); renderDecks(); persist(id);
  const el=document.querySelector(`#c-${id} [data-v="${v}"]`); if(el) el.focus();
});
let noteTimer={};
document.addEventListener("input",e=>{
  if(e.target.classList.contains("note")){ const id=e.target.dataset.id; (picks[id]=picks[id]||{picks:[]}).note=e.target.value;
    clearTimeout(noteTimer[id]); noteTimer[id]=setTimeout(()=>persist(id),700); return; }
  if(["q"].includes(e.target.id)) render();
});
["mem","grp","sort"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("tabs").addEventListener("keydown",e=>{
  if(!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const tabs=[...document.querySelectorAll(".tab")], i=tabs.findIndex(t=>t.dataset.k===view);
  const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length]; setView(n.dataset.k,true); n.focus();
});
window.addEventListener("hashchange",fromHash);

renderTabs(); picks=loadLocal(); renderDecks(); fromHash();

(async()=>{
  let api=null;
  try{ api = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ api=null; }
  if(!api){ banner("Picks are saved in this browser only, so Claude cannot read them here. Open the board on claude.ai to share them."); return; }
  db=api;
  try{ const u=await window.claude.use("user"); if(u && u.can){ const w=await u.can("data.write"); if(w===false){canWrite=false;banner("You can view this board but not save picks on it.");} } }catch(e){}
  const timer=setTimeout(()=>banner("Saved picks have not loaded yet. Marks you make now still save."),10000);
  db.collection("picks").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer); if(canWrite) banner("");}
    const next={}; snap.docs.forEach(d=>{const x=d.data()||{}; if(BYID[d.id]) next[d.id]={picks:Array.isArray(x.picks)?x.picks.filter(v=>PICKLAB[v]):[],note:typeof x.note==="string"?x.note:""};});
    const local=loadLocal(); let migrate=[];
    Object.keys(local).forEach(id=>{ if(!next[id] && BYID[id] && (local[id].picks||[]).length){ next[id]=local[id]; migrate.push(id);} });
    picks=next; render(); renderDecks();
    if(migrate.length){ try{localStorage.removeItem(LS);}catch(e){} migrate.forEach(persist); }
  },err=>{clearTimeout(timer); banner("Saved picks could not be loaded. Reload the page to try again.");});
  db.collection("reasons").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{const x=d.data()||{}; if(BYID[d.id] && typeof x.text==="string") next[d.id]={group:typeof x.group==="string"?x.group:"",text:x.text};});
    reasons=next; if(view!=="picks") render();
  },()=>{});
})();
</script>
</body>
