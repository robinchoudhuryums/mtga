DDEFS.forEach((dd,di)=>{ const k=dd.key, L=LIVE[k]||{};
  DECKS[k]={ key:k, label:dd.label||(L.cmd||L.name||k).split(",")[0].split(" ")[0], full:L.name||"", id:L.id||dd.id||"", cmd:L.cmd||"",
    size:L.size||0, lands:L.lands||0, list:L.list||[], dc:`var(--id${DCOL[di]})`,
    portrait:{id:slug(L.cmd||""), im:(META.portraits||{})[k]||""} }; });
const DK = Object.keys(DECKS);
/* A one-deck build drops everything that only tells decks apart: the deck letter on every
   control, the per-deck filter options, the deck picker. Compare (pile beside the list) is its
   home view, the piles become a filter there, and the deck panel carries the live curve. */
const ONE = DK.length===1, K1 = DK[0];
const DLNAME = {}; DK.forEach(k=>DECKS[k].list.forEach(x=>{ DLNAME[slug(x.n)]=x.n; }));
const nameOf = id => (BYID[id]&&BYID[id].n) || DLNAME[id] || "";
const PILEDEFS = (META.piles||[]).map((p,i,a)=>({k:p.key, hash:"pile-"+String(p.key).toLowerCase(), label:p.label||p.key, intro:p.intro||"", deck:p.deck||null,
  tone: p.deck&&DECKS[p.deck] ? DECKS[p.deck].dc : (p.key==="N" ? "var(--muted)" : "var(--accent)")}));
const PILEKEYS = PILEDEFS.map(p=>p.k);
const CMPTAB = {k:"compare", hash:"compare", label:"Compare", intro: ONE
  ? `Candidates on the left, ${DECKS[K1].label}'s list on the right with the weakest fit first. Mark + Add on a candidate, then press ⇄ on the card it replaces; the panel above shows what your picks do to the deck. Pile switches between piles.`
  : "A pile beside one deck's current list. Select a pile card, then press ⇄ on the deck card it should replace. The curve shows the deck now and after your picks."};
const PILES = [...(ONE?[]:PILEDEFS), CMPTAB,
  {k:"lists", hash:"lists", label:"Deck lists", intro:"Each deck's current nonland cards, weakest fit first by deck.py cuts (1 = most cuttable). It is a shortlist: it cannot see spice or signature cards. Protected cards are listed last; Protect and Unprotect are requests Claude applies to the deck's protect list."},
  {k:"add", hash:"add-cards", label:"Add cards", intro:"Paste card names and choose where they go. This queues a request; when you tell Claude to process the board's requests, Claude reads, grades and adds each card."},
  {k:"picks", hash:"picks", label:"Your picks", intro:"Everything you have marked or noted. Claude reads this back when you ask."}];
const isPileView = k => PILEKEYS.includes(k);
/* Every pick names one deck. Bench ("maybe later") and Keep out are per deck, and within one
   deck Add, Bench and Keep out exclude each other: choosing one clears the other two. */
/* FULLLAB names the deck and is what Copy as text writes; PICKLAB is what the page shows,
   which on a one-deck build leaves the deck out. */
const FULLLAB = {};
DK.forEach(k=>{ const l=DECKS[k].label; FULLLAB["add"+k]=`Add to ${l}`; FULLLAB["cut"+k]=`Cut from ${l}`; FULLLAB["bench"+k]=`Bench in ${l}`; FULLLAB["out"+k]=`Keep out of ${l}`; FULLLAB["prot"+k]=`Protect in ${l}`; FULLLAB["unprot"+k]=`Unprotect in ${l}`; });
const PICKLAB = ONE ? {["add"+K1]:"Add to the deck", ["cut"+K1]:"Cut from the deck", ["bench"+K1]:"Bench", ["out"+K1]:"Keep out", ["prot"+K1]:"Protect", ["unprot"+K1]:"Unprotect"} : FULLLAB;
const PICKORDER = [...DK.flatMap(k=>["add"+k,"cut"+k,"bench"+k,"out"+k]), ...DK.flatMap(k=>["prot"+k,"unprot"+k])];
const KINDS = ["add","cut","bench","out","prot","unprot"], EXCL = ["add","bench","out"];
const deckOfPick = v => DK.find(k=>KINDS.some(x=>v===x+k));
const kindOf = v => { const k=deckOfPick(v); return k?v.slice(0,v.length-k.length):""; };
function pickColour(v){ const k=deckOfPick(v); return kindOf(v)==="out"?"var(--bad)":k?DECKS[k].dc:"var(--accent)"; }
/* Which decks a pile's Bench / Keep out buttons speak for: a deck's own pile → that deck;
   a shared pile (Either deck, Fits neither) → every deck. */
const pileScope = c => { const p=PILEDEFS.find(x=>x.k===c.p); return p&&p.deck&&DECKS[p.deck]?[p.deck]:DK; };
/* Before marks were per deck, Bench and Keep out covered every deck. Spread a legacy mark over
   the decks it covered: each deck the card is not in and is not being added to. */
function upgradeLegacy(id, list){ const c=BYID[id]; if(!c||!list.some(v=>v==="bench"||v==="out")) return list;
  const s=new Set(list.filter(v=>v!=="bench"&&v!=="out"));
  DK.forEach(k=>{ if(c["i"+k]||s.has("add"+k)) return; s.add((list.includes("out")?"out":"bench")+k); });
  return [...s]; }
const ICON = {bench:`<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.5" height="8" rx=".6" fill="currentColor"/><rect x="7" y="2" width="2.5" height="8" rx=".6" fill="currentColor"/></svg>`,
  out:`<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.8 9.2 9.2 2.8" stroke="currentColor" stroke-width="1.5"/></svg>`};

document.getElementById("title").textContent = META.title || "Builder";
if(META.home){ const h=document.getElementById("homelink"); h.href=META.home; h.hidden=false; }
const BOARD = CARDS.filter(c=>c.p);
document.getElementById("subtitle").textContent = `${BOARD.length} cards for ${DK.map(k=>`${DECKS[k].label} (${DECKS[k].full})`).join(" and ")}. Mark a card and Claude reads your picks back.`;
/* One deck: Compare already splits candidates (left) from the list (right), so "in the deck"
   filters nothing there and the control is dropped. */
if(ONE) document.querySelector('label[for="mem"]').classList.add("hidden");
document.getElementById("mem").innerHTML =`<option value="all">Any</option><option value="neither">In no deck</option>`+DK.map(k=>`<option value="${esc(k)}">In ${esc(DECKS[k].label)}</option>`).join("")+(DK.length>1?`<option value="every">In every deck</option>`:"");

/* Verdict stars: a hand grade per card per deck (builder.py verdict). VORDER is best first. */
const VORDER = (META.verdicts||[]).map(x=>x[0]), VLAB = Object.fromEntries((META.verdicts||[]).map(x=>[x[0],x[1]]));
const vrank = (c,k) => { const m=(c.vd||{})[k]; const i=VORDER.indexOf(m); return i<0?99:i; };
const VSTATE = {pre:"graded before this deck was drafted", stale:"graded before the list last changed"};
function vTitle(c,k){ const m=(c.vd||{})[k], st=(c.vs||{})[k]; return m?`${DECKS[k].label}: ${m} ${VLAB[m]||""}${st?` — ${VSTATE[st]}`:""}`:`${DECKS[k].label}: no verdict yet`; }
/* filter value "K|top2" (★★ or better), "K|top3" (★ or better), "K|low" (◇ or worse), "K|none" */
function vfMatch(c,val){ if(!val||val==="all") return true; const [k,w]=val.split("|"), r=vrank(c,k);
  return w==="top2"?r<=1: w==="top3"?r<=2: w==="low"?(r>=3&&r<99): w==="none"?r===99: true; }
const VFOPTS = [["top2","★★ or better"],["top3","★ or better"],["low","◇ or worse"],["none","no verdict"]];
document.getElementById("vf").innerHTML = `<option value="all">Any</option>`+(ONE
  ? VFOPTS.map(([w,t])=>`<option value="${esc(K1)}|${w}">${t[0].toUpperCase()+t.slice(1)}</option>`).join("")
  : DK.map(k=>{ const l=esc(DECKS[k].label);
    return `<optgroup label="${l}">${VFOPTS.map(([w,t])=>`<option value="${esc(k)}|${w}">${l}: ${t}</option>`).join("")}</optgroup>`; }).join(""));
document.getElementById("df").innerHTML = `<option value="all">Any</option>`+(ONE ? `<option value="${esc(K1)}">Undecided</option>`
  : DK.map(k=>`<option value="${esc(k)}">Undecided for ${esc(DECKS[k].label)}</option>`).join("")+`<option value="any">Undecided for any deck</option>`);
if(!ONE) document.getElementById("sort").insertAdjacentHTML("beforeend", DK.map(k=>`<option value="v:${esc(k)}">Verdict — ${esc(DECKS[k].label)}</option>`).join(""));   // one deck: the verdict sections order it
let picks = {}, reasons = {}, requests = {};
let db = null, canWrite = true, view = PILEKEYS[0]||"lists", VISIBLE = [], SEL = null, NOTEOPEN = null, NOTECOL = "";
/* Choosing cuts: CUTOPEN = "<card id>|<deck>" whose cut list is open in the pane; CUTQ its search.
   INSPECT = a deck card read in the Compare view's second pane slot (SEL stays the pile card). */
let CUTOPEN = null, CUTQ = "", INSPECT = null, SHEETID = null;
const CMP = {pile:"all", deck:DK[0], side:"L", q:""}; let ACTIVECOL = "", COLIDS = {L:[], R:[]};
const PROT = Object.fromEntries(DK.map(k=>[k,new Set((LIVE[k]||{}).protect||[])]));
const HROLES = ["interaction","card advantage"];

/* ---------- preferences: theme (shared with the dashboard) and the pane ---------- */
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||"{}")||{}; }catch(e){ return {}; } }
function effectiveTheme(){ const a=document.documentElement.getAttribute("data-theme"); if(a==="light"||a==="dark") return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }
function paintThemeBtn(){ const t=effectiveTheme(), b=document.getElementById("themebtn"), next=t==="dark"?"light":"dark";
  b.textContent = t==="dark" ? "☾ Dark" : "☀ Light"; b.setAttribute("aria-label",`Theme: ${t}. Switch to ${next}`); b.title=`Switch to ${next} (t)`; }
function toggleTheme(){ const next=effectiveTheme()==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next);
  const p=readJSON("mtga-prefs"); p.theme=next; try{ localStorage.setItem("mtga-prefs",JSON.stringify(p)); }catch(e){} paintThemeBtn(); }
const PREFS = readJSON("builder-prefs");
let PANE = PREFS.pane!=="closed";
/* One deck: Compare's candidate column is grouped by the deck's verdict, best first, ungraded
   cards before ✗, and ✗ starts collapsed — the reject pile is there when you open it. */
const VNONE = "–";
let VCOLL = new Set(Array.isArray(PREFS.vcoll) ? PREFS.vcoll : ["✗"]);
function savePrefs(){ try{ localStorage.setItem("builder-prefs",JSON.stringify({pane:PANE?"open":"closed", vcoll:[...VCOLL]})); }catch(e){} }
const vBand = (c,k) => { const m=(c.vd||{})[k]; return VORDER.includes(m) ? m : VNONE; };
function verdictSections(xs, k){ const order=[...VORDER.filter(m=>m!=="✗"), VNONE, ...VORDER.filter(m=>m==="✗")], by={};
  xs.forEach(c=>{ const b=vBand(c,k); (by[b]=by[b]||[]).push(c); });
  return order.filter(m=>by[m]).map(m=>({m, cards:by[m]})); }
/* Open the section a card sits in, so a jump to it can land. */
function revealCand(id){ const c=BYID[id]; if(c&&VCOLL.delete(vBand(c,K1))) savePrefs(); }
function applyPane(){ const con=document.getElementById("console"), b=document.getElementById("panebtn");
  con.classList.toggle("nopane",!PANE); b.setAttribute("aria-expanded",String(PANE)); b.textContent=PANE?"Hide card pane":"Show card pane"; b.title=(PANE?"Hide":"Show")+" the card pane (p)"; if(PANE) hidePeek(); }
function togglePane(){ PANE=!PANE; savePrefs(); applyPane(); }

/* One mana / ability symbol as a pip. `cls` adds "in" for symbols set inside running text. */
const SYMWORD = {T:"tap", Q:"untap", E:"energy", S:"snow"};
function pip1(t, cls=""){ const s=t.slice(1,-1), k=` class="pip${cls?" "+cls:""}`;
  if(s==="T"||s==="Q") return `<span${k} sym" role="img" aria-label="${SYMWORD[s]}" title="${esc(t)} — ${SYMWORD[s]}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="${s==="T"?"M3.2 8.6A3.6 3.6 0 1 1 8.8 8.4":"M8.8 3.4A3.6 3.6 0 1 0 3.2 3.6"}" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="${s==="T"?"M8.9 5.9 8.8 8.6 6.2 8.2":"M3.1 6.1 3.2 3.4 5.8 3.8"}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>`;
  const parts=s.split("/"), col=x=>({W:"--pW",U:"--pU",B:"--pB",R:"--pR",G:"--pG"})[x];
  const bg = parts.length===2&&col(parts[0])&&col(parts[1]) ? `linear-gradient(135deg,var(${col(parts[0])}) 50%,var(${col(parts[1])}) 50%)` : col(parts[0])?`var(${col(parts[0])})`:"var(--pC)";
  return `<span${k}" style="background:${bg}" title="${esc(t)}">${esc(parts.length===2&&parts[1]==="P"?parts[0]:s.length>2?s[0]:s)}</span>`; }
function pips(cost){ return (String(cost||"").split(" // ")[0].match(/\{[^}]+\}/g)||[]).map(t=>pip1(t)).join(""); }
/* Symbols inside already-escaped text: {T}, {G}, {2}, {B/P}… become pips; anything longer than a
   symbol (a brace in prose) is left alone. */
const sym = html => String(html).replace(/\{(?:[WUBRGCXYZSTQE]|\d{1,2}|[WUBRGC2]\/[WUBRGP])\}/g, t=>pip1(t,"in"));
function stripe(c){ const cols=[...new Set(((c.c||"").split(" // ")[0].match(/[WUBRG]/g)||[]))].sort((a,b)=>"WUBRG".indexOf(a)-"WUBRG".indexOf(b));
  const v=(cols.length?cols:["C"]).map(x=>`var(--id${x})`); if(v.length===1) v.push(v[0]); return `linear-gradient(${v.join(",")})`; }
function reasonOf(c){ const r=reasons[c.id]; if(r&&r.text) return {g:r.group||"",w:r.text}; return c.w?{g:c.g,w:c.w}:null; }
const isSwap = c => { const r=reasonOf(c); return !!r && (r.g==="A"||r.g==="Swap candidate"); };
const groupLabel = g => GROUP[g]||g||"Reason";
const gk = c => { const g=(reasonOf(c)||{}).g||"zz"; return (g==="A"||g==="Swap candidate")?"00":g; };
const marked = id => ((picks[id]||{}).picks||[]).some(v=>!/^(un)?prot/.test(v));
/* Decided for a deck: the card is in it, or carries Add, Cut, Bench or Keep out for it. A pile is
   reviewed card by card against the decks it speaks for (its own deck, or every deck when shared). */
const decided = (c,k) => !!c["i"+k] || ["add","cut","bench","out"].some(x=>hasPick(c.id,x+k));
const decidedInPile = c => pileScope(c).every(k=>decided(c,k));
/* Applied: the deck files already show this pick (the swap or header edit landed). */
function isApplied(id,v){ const k=deckOfPick(v), c=BYID[id], nm=nameOf(id); if(!k) return false;
  if(v==="add"+k) return !!(c&&c["i"+k]); if(v==="cut"+k) return !!c&&!c["i"+k];
  if(v==="prot"+k) return PROT[k].has(nm); if(v==="unprot"+k) return !PROT[k].has(nm); return false; }
const pending = id => ((picks[id]||{}).picks||[]).filter(v=>!isApplied(id,v));
const hasApplied = id => ((picks[id]||{}).picks||[]).some(v=>isApplied(id,v));
const hasPick = (id,v) => ((picks[id]||{}).picks||[]).includes(v);
/* Hidden roles: a role the classifier does not count. Suspected (hr) are the classifier's own
   coverage flags; confirmed come from build.json (hc) or from a mark on this page (hid). */
const hidOf = c => [...new Set([...(c.hc||[]), ...((picks[c.id]||{}).hid||[])])];
const hidBonus = (c,role) => hidOf(c).includes(role) && !(role==="interaction"?c.ri:c.rc) ? 1 : 0;
function conflicts(){ const out=[];
  DK.forEach(k=>{ const d=DECKS[k], uses={};
    Object.keys(picks).forEach(id=>{ if(!hasPick(id,"add"+k)||isApplied(id,"add"+k)) return; const cut=(picks[id].pair||{})[k]; if(!cut) return;
      (uses[cut]=uses[cut]||[]).push(nameOf(id)); const cc=BYID[slug(cut)];
      if(!cc||!cc["i"+k]) out.push({k,ids:[id],msg:`${nameOf(id)} is set to replace ${cut}, which is no longer in ${d.label}.`});
      else if(cc["p"+k]&&!hasPick(cc.id,"unprot"+k)) out.push({k,ids:[id,cc.id],msg:`${nameOf(id)} is set to replace ${cut}, a protected card in ${d.label}.`}); });
    Object.entries(uses).forEach(([cut,adds])=>{ if(adds.length>1) out.push({k,ids:[slug(cut),...adds.map(slug)],msg:`${cut} is the cut for ${adds.length} adds in ${d.label}: ${adds.join(", ")}.`}); }); });
  return out; }
function nextBand(k,i,c){ const R=(LIVE[k]||{}).req||{}, order=["D","C","B","A"], cur=bandOf(k,i,c), nx=order[order.indexOf(cur)+1]; if(!nx||!R[nx]) return null;
  const needI=Math.max(0,R[nx][0]-i), needS=Math.max(0,R[nx][1]-(i+c)), parts=[];
  if(needI) parts.push(`+${needI} interaction`); if(needS>needI) parts.push(`+${needS-needI} ${needI?"more ":""}interaction or card advantage`);
  return {b:nx, parts}; }
const hasNote = id => !!((picks[id]||{}).note||"").trim();
const inAny = c => DK.some(k=>c["i"+k]);
const LABEL_RE = new RegExp("^("+DK.map(k=>DECKS[k].label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+"):\\s*");
function firstLine(c){ const r=reasonOf(c); if(!r) return inAny(c) ? "In the list" : ""; let t=plain(r.w).replace(LABEL_RE,""); const m=t.match(/^(.{20,140}?[.;])\s/); return m?m[1]:t.slice(0,140); }
const RAR = {M:"mythic",R:"rare",U:"uncommon",C:"common"};
function own(c){ return c.o ? `Owned ×${c.o}` : `Craft ${RAR[c.r]||c.r}`; }
function ownTag(c){ const q=(picks[c.id]||{}).own, fix=(q!==undefined&&q!==null&&q!==c.o)?` → ${q}`:"";
  return `<span class="tag own" title="${c.o?`You own ${c.o}`:`Not owned — a ${RAR[c.r]||c.r} craft`}${fix?`; correction queued: ${q}`:""}">${c.o?`×${c.o}`:`craft ${esc(c.r)}`}${fix}</span>`; }
function roleTags(c, all){ const hid=hidOf(c), sus=(c.hr||[]).filter(r=>!hid.includes(r)), cap=r=>r[0].toUpperCase()+r.slice(1);
  const short=r=>all?cap(r):(r==="interaction"?"Int":"CA");
  return [...(c.ro||[]).slice(0, all?99:1).map(r=>`<span class="tag">${esc(r)}</span>`),
    ...hid.map(r=>`<span class="tag hid" title="Counts as ${r} in play; the tools do not count it">${short(r)} · hidden</span>`),
    ...sus.map(r=>`<span class="tag sus" title="Reads like ${r}, but the classifier did not count it — read the text">${short(r)}?</span>`)].join(""); }

/* ---------- rows ---------- */
function quick(c){ const p=(picks[c.id]||{}).picks||[];
  if(ONE){ const k=K1, btn=(v,label)=>`<button type="button" class="qb" style="--qc:${pickColour(v)}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${label}</button>`;
    if(c["i"+k]) return `<span class="q one">${btn("cut"+k,"− Cut")}</span>`;
    return `<span class="q one">${btn("add"+k,"+ Add")}${btn("bench"+k,`<span class="qi">${ICON.bench}<span class="qw">Bench</span></span>`)}${btn("out"+k,`<span class="qi">${ICON.out}<span class="qw">Keep out</span></span>`)}</span>`; }
  const dbtn = DK.map(k=>{ const inK=c["i"+k], v=(inK?"cut":"add")+k; return `<button type="button" class="qb" style="--qc:${DECKS[k].dc}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${inK?"−":"+"}${esc(k)}</button>`; }).join("");
  const many=DK.length>3, n=many?2:Math.max(2,DK.length), pad=(xs)=>xs.concat(Array(Math.max(0,n-xs.length)).fill("<span></span>")).join(""), scope=pileScope(c);
  const xb=(kind,k)=>{ if(c["i"+k]) return "<span></span>"; const v=kind+k;
    return `<button type="button" class="qb" style="--qc:${pickColour(v)}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}" aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}"><span class="qi">${ICON[kind]}${esc(k)}</span></button>`; };
  if(many){ const set=p.filter(v=>["bench","out"].includes(kindOf(v))).length;
    return `<span class="q" style="--qn:2">${dbtn}${DK.length%2?"<span></span>":""}<details class="qmore"><summary class="qb" aria-label="Bench or keep out: ${esc(c.n)}${set?` (${set} set)`:""}" title="Bench / Keep out">⋯${set?` ${set}`:""}</summary><span class="qmenu">${scope.flatMap(k=>[xb("bench",k),xb("out",k)]).join("")}</span></details></span>`; }
  const xbtn = scope.length===1 ? pad([xb("bench",scope[0]),xb("out",scope[0])]) : pad(scope.map(k=>xb("bench",k)))+pad(scope.map(k=>xb("out",k)));
  return `<span class="q" style="--qn:${n}">${dbtn}${"<span></span>".repeat(Math.max(0,n-DK.length))}${xbtn}</span>`; }
function noteRowHTML(c,col){ const p=picks[c.id]||{};
  return `<div class="inote"><textarea class="note" id="ni-${col}${c.id}" data-id="${c.id}" rows="1" aria-label="Note for Claude on ${esc(c.n)}" placeholder="A note for Claude on ${esc(c.n)} (Esc to close)">${esc(p.note||"")}</textarea><span class="saved" data-saved="${c.id}" aria-live="polite"></span></div>`; }
/* A row. `col` is "" in a pile view, "L"/"R" in the Compare view (a card can be in both columns,
   so rows are found by data attributes, never by id). The deck column adds the cut rank and ⇄. */
function rowHTML(c, col=""){
  const tags = DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected":"In"}${ONE?(c["p"+k]?"":" the deck"):" "+esc(DECKS[k].label)}</span>`).join("")
    + DK.filter(k=>(c.vd||{})[k]).map(k=>`<span class="tag vd ${(c.vs||{})[k]||""}" style="--dc:${DECKS[k].dc}" title="${esc(vTitle(c,k))}">${ONE?"":esc(k)+" "}${esc(c.vd[k])}</span>`).join("");
  const ap = hasApplied(c.id), k=CMP.deck, d=DECKS[k];
  let extra="", cls="", lead="";
  if(col==="R"){ const x=d.list.find(x=>x.n===c.n)||{}, s=BYID[SEL], cutBy=pairedTo(k,c.n);
    lead=`<span class="rank" title="${x.prot?"Protected":"Cut rank (1 = most cuttable)"}">${x.prot?"P":"#"+(x.r??"–")}</span>`;
    const can = s && !s["i"+k] && s.id!==c.id;
    extra=`<button type="button" class="pairbtn" style="--dc:${d.dc}" data-pair="${c.id}" ${can?"":"disabled"} aria-label="${can?`${esc(s.n)} replaces ${esc(c.n)}`:`Select a pile card first, then pair it with ${esc(c.n)}`}" title="${can?`${esc(s.n)} replaces this`:"Select a pile card first"}">⇄</button>`;
    if(s && (((picks[s.id]||{}).pair||{})[k]===c.n)) cls=" paired";

  snapshot(s.id,`${s.n} replaces ${cut.n}`); const p=picks[s.id]||(picks[s.id]={picks:[],note:""}), v=new Set(p.picks||[]);
  v.add("add"+k); v.delete("bench"+k); v.delete("out"+k); p.picks=[...v]; p.pair=Object.assign({},p.pair||{},{[k]:cut.n}); persist(s.id); render(); renderDecks(); toast(`${s.n} replaces ${cut.n} in ${DECKS[k].label}.`); }
function clearApplied(){ const ids=Object.keys(picks).filter(hasApplied); if(!ids.length) return;
  ids.forEach(id=>{ snapshot(id,`clear applied marks: ${nameOf(id)}`); const p=picks[id]; p.picks=(p.picks||[]).filter(v=>!isApplied(id,v)); persist(id); });
  render(); renderDecks(); toast(`Cleared applied marks on ${ids.length} card(s).`); }

/* ---------- events ---------- */
const colOf = el => { const w=el&&el.closest&&el.closest(".rw"); return w?(w.dataset.col||""):""; };
document.addEventListener("click",e=>{
  if(e.target.closest("#themebtn")){ toggleTheme(); return; }
  if(e.target.closest("#panebtn")){ togglePane(); return; }
  if(e.target.closest("#undobtn")){ undo(); return; }
  const t=e.target.closest(".tab"); if(t){ setView(t.dataset.k,true); return; }
  const pr=e.target.closest("[data-pair]"); if(pr){ pairWith(pr.dataset.pair); return; }
  const co=e.target.closest("[data-cutopen]"); if(co){ const key=co.dataset.cutopen, inSheet=!!co.closest("#sheet"); CUTOPEN=CUTOPEN===key?null:key; CUTQ=""; renderDetail();
    const again=document.querySelector(`${inSheet?"#sheetbody":"#detail"} ${CUTOPEN?`.cutq[data-cutq="${key}"]`:`[data-cutopen="${key}"]`}`); if(again) again.focus(); return; }
  const cs=e.target.closest("[data-cutset]"); if(cs){ const [id,k]=cs.dataset.cutset.split("|"), inSheet=!!cs.closest("#sheet"); if(cs.dataset.cut) CUTOPEN=null; setPair(id,k,cs.dataset.cut);
    const again=document.querySelector(`${inSheet?"#sheetbody":"#detail"} [data-cutopen="${id}|${k}"]`); if(again) again.focus(); return; }
  if(e.target.closest("[data-inspclose]")){ INSPECT=null; if(ACTIVECOL==="R") ACTIVECOL="L"; paintCompareRows(); renderDetail(); const m=mainEl(SEL,"L"); if(m) m.focus(); return; }
  const vs=e.target.closest("[data-vsec]"); if(vs){ const m=vs.dataset.vsec; if(VCOLL.has(m)) VCOLL.delete(m); else VCOLL.add(m); savePrefs();
    paintCompareRows(); if(ACTIVECOL!=="R") VISIBLE=COLIDS.L; const again=document.querySelector(`[data-vsec="${CSS.escape(m)}"]`); if(again) again.focus(); return; }
  const pk=e.target.closest("[data-pkgsel]"); if(pk){ const id=pk.dataset.pkgsel; if(ONE) revealCand(id); if(!COLIDS.L.includes(id)){ CMP.pile="all"; CMP.q=""; render(); } select(id,true,"L"); const m=mainEl(id,"L"); if(m) m.focus(); return; }
  const pi=e.target.closest("[data-pkginsp]"); if(pi){ const id=pi.dataset.pkginsp; if(!COLIDS.R.includes(id)){ CMP.q=""; paintCompareRows(); } inspect(id,true); const m=mainEl(id,"R"); if(m) m.focus(); return; }
  const ab=e.target.closest("[data-art]"); if(ab){ openArt(ab.dataset.art, +ab.dataset.ai, ab); return; }
  if(e.target.id==="artclose"||e.target.id==="artzoom"){ const d=document.getElementById("artzoom"); d.close(); if(d._from&&document.contains(d._from)) d._from.focus(); return; }
  const sg=e.target.closest(".seg [data-side]"); if(sg){ CMP.side=sg.dataset.side; const cc=document.getElementById("cmpcols"); if(cc) cc.dataset.side=CMP.side;
    document.querySelectorAll(".seg [data-side]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.side===CMP.side))); return; }
  const hb=e.target.closest("[data-hid]"); if(hb){ const id=hb.dataset.hid, role=hb.dataset.role, inSheet=!!hb.closest("#sheet"); toggleHidden(id,role); refreshView(id);
    const again=document.querySelector(`${inSheet?"#sheet":"#detail"} [data-hid="${id}"][data-role="${role}"]`); if(again) again.focus(); return; }
  const b=e.target.closest("[data-v]"); if(b){ const id=b.dataset.id, v=b.dataset.v, col=colOf(b);
    const where=b.closest("#sheet")?"#sheet ":b.closest(".detail")?"#detail ":b.closest(".dlist")?".dlist ":`.rw[data-w="${id}"][data-col="${col}"] `; togglePick(id,v); refreshView(id);
    const again=document.querySelector(`${where}[data-id="${id}"][data-v="${v}"]`); if(again) again.focus(); return; }
  if(e.target.closest(".qmore")) return;            // the per-row Bench / Keep out menu opens itself
  const sel=e.target.closest("[data-sel]")||(e.target.closest("[data-row]")&&!e.target.closest("button")?e.target.closest("[data-row]"):null);
  if(sel){ const id=sel.dataset.sel||sel.dataset.row, col=colOf(sel);
    if(view==="compare"&&col==="R"){ if(narrow()){ ACTIVECOL="R"; VISIBLE=COLIDS.R; openSheet(id,true); } else inspect(id,false); return; }
    if(narrow()){ if(view==="compare"){ ACTIVECOL=col; VISIBLE=COLIDS[col]||[]; } openSheet(id); }
    else if(id===SEL&&(view!=="compare"||col===ACTIVECOL)) setNoteOpen(NOTEOPEN===id&&NOTECOL===col?null:id,true,col);
    else select(id,false,view==="compare"?col:null); return; }
  const st=e.target.closest("[data-step]"); if(st){ const i=VISIBLE.indexOf(SEL), n=VISIBLE[(i+ +st.dataset.step+VISIBLE.length)%VISIBLE.length]; if(n){ select(n,true); const s2=document.querySelector(`#detail [data-step="${st.dataset.step}"]`); if(s2) s2.focus(); } return; }
  const z=e.target.closest("[data-zoom]"); if(z){ openZoom(z.dataset.zoom, z.closest(".dlist")?null:VISIBLE); return; }
  if(e.target.id==="zoomprev"||e.target.id==="zoomnext"){ stepZoom(e.target.id==="zoomnext"?1:-1); return; }
  if(e.target.id==="zoomflip"){ flipCard(document.getElementById("zoom").dataset.from); return; }
  const fl=e.target.closest("[data-flip]"); if(fl){ flipCard(fl.dataset.flip); return; }
  if(e.target.id==="zoomclose"||e.target.id==="zoom"){ const d=document.getElementById("zoom"); d.close(); if(d._from&&document.contains(d._from)){ d._from.focus(); d._from=null; } return; }
  const cm=e.target.closest("[data-cmp]"); if(cm){ openCompare(cm.dataset.cmp,cm.dataset.cut,cm); return; }
  if(e.target.id==="cmpclose"||e.target.id==="cmp"){ const d=document.getElementById("cmp"); d.close(); if(d._from&&document.contains(d._from)) d._from.focus(); return; }
  if(e.target.id==="sheetclose"||e.target.id==="sheet"){ document.getElementById("sheet").close(); SHEETID=null; const r=mainEl(SEL,view==="compare"?ACTIVECOL:null); if(r) r.focus(); return; }
  if(e.target.id==="filtbtn"){ const tb=document.getElementById("toolbar"), o=tb.classList.toggle("open"); e.target.setAttribute("aria-expanded",o); e.target.textContent=o?"Hide filters":"Show filters"; return; }
  if(e.target.id==="addsubmit"){ submitRequest(); return; }
  if(e.target.id==="bulkgo"){ askBulk(); return; }
  if(e.target.id==="bulkyes"){ doBulk(); document.getElementById("bulkgo").focus(); return; }
  if(e.target.id==="bulkno"){ document.getElementById("bulkask").innerHTML=""; document.getElementById("bulkgo").focus(); return; }
  if(e.target.id==="clearapplied"){ clearApplied(); return; }
  if(e.target.id==="addcopy"){ const txt=Object.values(requests).map(r=>`${r.dest}: ${r.names.join("; ")}${r.note?" — "+r.note:""}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setAddStatus("Copied."),()=>setAddStatus("Copy was blocked; select the list instead.")); return; }
  const j=e.target.closest("[data-jump]"); if(j){ e.preventDefault(); const c=BYID[j.dataset.jump];
    if(ONE){ CMP.pile="all"; revealCand(c.id); if(c["i"+K1]){ setView("compare",true); inspect(c.id,true); } else { SEL=c.id; ACTIVECOL="L"; setView("compare",true); select(c.id,true,"L"); } return; }
    SEL=c.id; setView(c.p,true); select(c.id,true); return; }
  if(e.target.id==="copy"){ (navigator.clipboard?navigator.clipboard.writeText(copyText()):Promise.reject()).then(()=>document.getElementById("copied").textContent="Copied.",()=>document.getElementById("copied").textContent="Copy was blocked here; select the list above instead."); return; }
});
const noteTimer={};
document.addEventListener("input",e=>{
  if(e.target.classList.contains("note")){ const id=e.target.dataset.id; (picks[id]=picks[id]||{picks:[]}).note=e.target.value;
    document.querySelectorAll(`textarea.note[data-id="${id}"]`).forEach(t=>{ if(t!==e.target) t.value=e.target.value; });
    clearTimeout(noteTimer[id]); noteTimer[id]=setTimeout(()=>{ persist(id); updateNoteDot(id); updateTabCounts(); },700); return; }
  if(e.target.id==="addnames"){ const n=parseNames(e.target.value), on=n.filter(x=>BYID[slug(x)]), pv=document.getElementById("addpreview"); if(pv) pv.textContent=n.length?`${n.length} name(s) read${on.length?`; already on the board: ${on.join("; ")}`:""}.`:""; return; }
  if(e.target.id==="cmpq"){ CMP.q=e.target.value; paintCompareRows(); return; }
  if(e.target.classList.contains("cutq")){ filterCuts(e.target); return; }
  if(e.target.id==="q") render(); });
["mem","grp","vf","df","sort","role","mvf","ownf","rar","hidemarked","swaponly","hideapplied"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.addEventListener("change",e=>{
  if(e.target.id==="bulkv"){ document.getElementById("bulkask").innerHTML=""; return; }
  const mv=e.target.closest("[data-move]"); if(mv){ if(mv.value) queueMove(mv.dataset.move, mv.value); return; }
  if(e.target.id==="cmppile"){ CMP.pile=e.target.value; render(); document.getElementById("cmppile").focus(); return; }
  if(e.target.id==="cmpdeck"){ CMP.deck=e.target.value; INSPECT=null; if(ACTIVECOL==="R") ACTIVECOL="L"; render(); document.getElementById("cmpdeck").focus(); return; }
  const o=e.target.closest("[data-own]"); if(o){ const id=o.dataset.own, inSheet=!!o.closest("#sheet"); setOwn(id,o.value.trim()); refreshView(id); const again=document.querySelector(`${inSheet?"#sheet":"#detail"} [data-own="${id}"]`); if(again) again.focus(); return; }
});
document.getElementById("tabs").addEventListener("keydown",e=>{ if(!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const tabs=[...document.querySelectorAll(".tab")], i=tabs.findIndex(t=>t.dataset.k===view), n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length]; setView(n.dataset.k,true); n.focus(); });
const rowsEl=document.getElementById("rows");
/* the cut list's preview follows the pointer and the keyboard focus */
function showCutPrev(o){ const box=o.closest(".cutpanel"), pv=box&&box.querySelector(".cutprev"); if(!pv||pv.dataset.id===o.dataset.prev) return;
  const [addId,k]=o.dataset.cutset.split("|"); pv.dataset.id=o.dataset.prev; pv.innerHTML=cutPrevHTML(o.dataset.prev,k,addId); }
document.addEventListener("mouseover",e=>{ const o=e.target.closest&&e.target.closest(".cutopt"); if(o) showCutPrev(o); });
document.addEventListener("focusin",e=>{ const o=e.target.closest&&e.target.closest(".cutopt"); if(o) showCutPrev(o); });
rowsEl.addEventListener("mouseover",e=>{ const r=e.target.closest("[data-row]"); if(r) showPeek(r.dataset.row,r); });
rowsEl.addEventListener("mouseleave",hidePeek);
rowsEl.addEventListener("focusin",e=>{ const m=e.target.closest(".main"); if(m) showPeek(m.dataset.sel,m.closest(".row")); else hidePeek(); });
rowsEl.addEventListener("focusout",e=>{ if(!rowsEl.contains(e.relatedTarget)) hidePeek(); });
window.addEventListener("scroll",hidePeek,{passive:true});
rowsEl.addEventListener("scroll",hidePeek,{passive:true,capture:true});
document.addEventListener("keydown",e=>{
  if(document.getElementById("zoom").open){ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); stepZoom(e.key==="ArrowRight"?1:-1); }
    else if(e.key==="f"){ flipCard(document.getElementById("zoom").dataset.from); } return; }
  const cp=e.target.closest&&e.target.closest(".cutpanel");
  if(cp){ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); const os=[...cp.querySelectorAll(".cutopt")].filter(o=>!o.hidden), i=os.indexOf(document.activeElement);
      const n=os[e.key==="ArrowDown"?Math.min(os.length-1,i+1):Math.max(0,i-1)]; if(n) n.focus(); return; }
    if(e.key==="Escape"&&!e.target.closest("#sheet")){ const key=CUTOPEN; CUTOPEN=null; renderDetail(); const b=document.querySelector(`[data-cutopen="${key}"]`); if(b) b.focus(); return; }
    if(e.target.classList.contains("cutopt")&&e.key.length===1) return; }
  if(document.querySelector("dialog[open]")) return;
  if(e.key==="Escape"&&e.target.closest&&e.target.closest(".inote")){ const id=NOTEOPEN, col=NOTECOL; setNoteOpen(null); const m=mainEl(id,col); if(m) m.focus(); return; }
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag)||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="t"){ toggleTheme(); return; }
  if(e.key==="u"){ undo(); return; }
  if(e.key==="p"&&!narrow()){ togglePane(); return; }
  if(!(isPileView(view)||view==="compare")||!VISIBLE.length) return;
  const col=view==="compare"?ACTIVECOL:"";
  const insp=view==="compare"&&ACTIVECOL==="R", cur=insp?INSPECT:SEL;
  const i=Math.max(0,VISIBLE.indexOf(cur)), go=n=>{ const id=VISIBLE[(n+VISIBLE.length)%VISIBLE.length]; if(insp) inspect(id,true); else select(id,true); const m=mainEl(id,col); if(m) m.focus(); };
  const dn=/^[1-9]$/.test(e.key)?+e.key:0;
  if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); go(i+1); }
  else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); go(i-1); }
  else if(dn&&dn<=DK.length){ const k=DK[dn-1], c=BYID[SEL]; if(c){ togglePick(SEL,(c["i"+k]?"cut":"add")+k); refreshView(SEL); } }
  else if(e.key==="b"&&SEL){ toggleScoped(SEL,"bench"); refreshView(SEL); }
  else if(e.key==="o"&&SEL){ toggleScoped(SEL,"out"); refreshView(SEL); }
  else if(e.key==="n"&&SEL){ e.preventDefault(); if(narrow()) openSheet(SEL); else setNoteOpen(SEL,true,col); }
  else if(e.key==="/"){ e.preventDefault(); const q=document.getElementById(view==="compare"&&!ONE?"cmpq":"q"); if(q) q.focus(); }
  else if(e.key==="z"&&SEL){ openZoom(SEL,VISIBLE); }
  else if(e.key==="f"&&SEL){ flipCard(SEL); } });
window.addEventListener("hashchange",fromHash);
window.matchMedia("(max-width: 1000px)").addEventListener("change",()=>{ renderDecks(); hidePeek(); });
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn);

if(ONE) document.querySelector('#toolbar > label[for="q"]').insertAdjacentHTML("afterend", pileSelHTML());
paintThemeBtn(); paintUndo(); applyPane(); renderTabs(); picks=loadLocal(); requests=readJSON(LSR); renderDecks(); fromHash();

(async()=>{ let api=null;
  try{ api=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ api=null; }
  if(!api){ banner(META.target==="pages" ? "Picks are saved in this browser. To send them to Claude, open Your picks and use Copy as text." : "Picks are saved in this browser only, so Claude cannot read them here. Open the board on claude.ai to share them."); return; }
  db=api;
  try{ const u=await window.claude.use("user"); if(u&&u.can){ const w=await u.can("data.write"); if(w===false){ canWrite=false; banner("You can view this board but not save picks on it."); } } }catch(e){}
  const timer=setTimeout(()=>banner("Saved picks have not loaded yet. Marks you make now still save."),10000);
  db.collection("picks").onSnapshot(snap=>{ if(!snap.metadata.fromCache){ clearTimeout(timer); if(canWrite) banner(""); }
    const next={}, upg=[]; snap.docs.forEach(d=>{ const x=d.data()||{}; if(!nameOf(d.id)) return;
      if(Array.isArray(x.picks)){ const u=upgradeLegacy(d.id,x.picks); if(u!==x.picks){ x.picks=u; upg.push(d.id); } }
      const pair={}; if(x.pair&&typeof x.pair==="object") DK.forEach(k=>{ if(typeof x.pair[k]==="string") pair[k]=x.pair[k]; });
      next[d.id]={picks:Array.isArray(x.picks)?x.picks.filter(v=>PICKLAB[v]):[],note:typeof x.note==="string"?x.note:"",pair,
        own:Number.isInteger(x.own)&&x.own>=0?x.own:null, hid:Array.isArray(x.hid)?x.hid.filter(r=>HROLES.includes(r)):[]}; });
    const local=loadLocal(), migrate=[]; Object.keys(local).forEach(id=>{ if(!next[id]&&nameOf(id)&&((local[id].picks||[]).length||local[id].note)){ next[id]=local[id]; migrate.push(id); } });
    const focusedNote=document.activeElement&&document.activeElement.classList.contains("note");
    picks=next; if(!focusedNote){ render(); } else { updateTabCounts(); } renderDecks();
    if(migrate.length){ try{ localStorage.removeItem(LS); }catch(e){} migrate.forEach(persist); }
    if(upg.length&&canWrite) upg.forEach(persist);
  },err=>{ clearTimeout(timer); banner("Saved picks could not be loaded. Reload the page to try again."); });
  db.collection("requests").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(Array.isArray(x.names)) next[d.id]={names:x.names.filter(n=>typeof n==="string").slice(0,300),dest:String(x.dest||""),note:typeof x.note==="string"?x.note:"",at:String(x.at||""),status:String(x.status||"pending"),reply:typeof x.reply==="string"?x.reply:""}; });
    requests=next; updateTabCounts(); if(view==="add") render(); },()=>{});
  db.collection("reasons").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(BYID[d.id]&&typeof x.text==="string") next[d.id]={group:typeof x.group==="string"?x.group:"",text:x.text}; });
    reasons=next; if(isPileView(view)) render(); },()=>{});
})();
