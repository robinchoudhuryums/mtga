<title>Abzan toughness (Hamza)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* First paint: a stored theme choice wins (shared with the dashboard's mtga-prefs), else the OS scheme. */
(function(){ try{ var p=JSON.parse(localStorage.getItem("mtga-prefs")||"{}")||{}; if(p.theme==="light"||p.theme==="dark") document.documentElement.setAttribute("data-theme",p.theme); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Builder page — generated by scripts/builder.py render from this template + builds/<slug>/build.json.
   PAGE = TEMPLATE + DATA: styling never touches card data. Layout: masthead and deck strip, sticky pile
   tabs, then a dense card list beside a collapsible sticky detail pane. Each deck's accent comes from its
   own main colour, so nothing here is tied to one deck or clan. */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --idW:#b39a3e; --idU:#2f6fb0; --idB:#4a4246; --idR:#b9472f; --idG:#2f7a45; --idC:#999b95;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;min-width:0}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch;flex:1 1 30ch}
.mast .homelink{margin-left:auto;color:var(--accent);font-size:.88rem;align-self:center}
.mast .homelink:not([hidden]) ~ .undobtn{margin-left:0}
.mast .undobtn{margin-left:auto}
.themebtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.themebtn:hover{color:var(--ink);border-color:var(--brass)}
.pip{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;border-radius:999px;font:700 .72rem/1 var(--ui);color:var(--pip-ink);background:var(--pC);border:1px solid rgba(0,0,0,.22)}
.pip.in{min-width:1.2em;height:1.2em;font-size:.68em;vertical-align:-.15em;margin:0 .06em}
.pip.sym svg{width:.85em;height:.85em;display:block}

/* deck strip */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
details.deck{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--dc);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);min-width:0}
details.deck > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;align-items:center}
details.deck > summary::-webkit-details-marker{display:none}
.portrait{grid-row:1 / span 2;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--dc);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent);background:var(--raise)}
.portrait img{width:180%;max-width:none;margin:-34% 0 0 -40%;display:block}
details.deck h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.04em;color:var(--dc);overflow-wrap:anywhere;min-width:0}
.sumline{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.dmeta{font-size:.82rem;color:var(--muted);margin:8px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem}
.kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.chg{color:var(--accent)}
.protlist{font-size:.82rem;color:var(--muted);margin-top:6px} .protlist summary{cursor:pointer;color:var(--accent);width:max-content}
.protlist p{margin:4px 0 0}
/* one deck: the panel carries the live curve beside the figures */
.onegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,440px);gap:8px 18px;align-items:start}
.onestat > .status{margin:6px 0 0}
.onegrid .curve .bars{height:60px;margin-top:6px}
.onegrid .curve figcaption{font-size:.74rem}
@media (max-width:760px){ .onegrid{grid-template-columns:minmax(0,1fr)} }

.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:.88rem}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding-top:4px}
.tab{position:relative;background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab .n{font-family:var(--mono);font-size:.76rem;margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc)}
.tab.pile::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--tc) var(--pct,0%),color-mix(in srgb,var(--tc) 18%,transparent) var(--pct,0%))}
.intro{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:90ch;font-size:.95rem}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.toolbar label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.toolbar input[type=search]{width:min(260px,100%)}
.toolbar label.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--ink);padding-bottom:5px}
.count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-bottom:6px}
.panebtn{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--muted);font-size:.84rem;margin-bottom:3px}
.panebtn:hover{color:var(--ink);border-color:var(--accent)}
.filtbtn{display:none;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer;width:max-content}
@media (max-width:1000px){ .panebtn{display:none} }
@media (max-width:760px){ .filtbtn{display:inline-block} .toolbar:not(.open) > label:not(:first-child){display:none} .toolbar > label:first-child{flex:1 1 100%} .toolbar input[type=search]{width:100%} .toolbar:not(.open) > label.keep{display:flex} }

/* console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.console.full,.console.nopane{grid-template-columns:minmax(0,1fr)}
.console.nopane > .detail{display:none}
@media (min-width:1001px){ .console.nopane > .rows{max-width:940px} }
@media (max-width:1000px){ .console{grid-template-columns:minmax(0,1fr)} .console > .detail{display:none} }
.rows{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.rw{border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:none}
.row{display:grid;grid-template-columns:5px 34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px 6px 0;cursor:pointer}
.row:hover{background:var(--raise)}
.row.sel{background:var(--sel)}
.row .stripe{align-self:stretch;background:var(--stripe)}
.row .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.spr.noimg{background:var(--line);border-radius:3px}
img[src=""]{display:none}
.row .main{all:unset;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.row .main:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cost{display:inline-flex;gap:2px;flex:none}
.row .l2{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:.84rem;color:var(--muted)}
.row .why1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seal{font:600 .64rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);border-radius:2px;padding:3px 5px;flex:none}
.tag{font-size:.7rem;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tag.in{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.tag.prot{color:var(--dc);border-color:var(--dc);font-weight:600}
/* quick picks: deck toggles on the top row; Bench and Keep out (per deck, scoped to the pile) underneath */
.q{display:grid;grid-template-columns:repeat(var(--qn,2),minmax(30px,auto));gap:3px}
.qb{display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 6px;min-height:22px;font:500 .74rem/1.3 var(--mono);cursor:pointer;color:var(--muted)}
.qb svg{width:12px;height:12px;display:block}
.qb .qi{display:inline-flex;align-items:center;gap:2px}
/* one deck: Add (or Cut) on top, Bench and Keep out in words underneath; icons only on a phone */
.q.one{grid-template-columns:repeat(2,auto)}
.q.one > .qb:first-child{grid-column:1/-1}
.qb .qw{font-family:var(--ui)}
@media (max-width:520px){ .qb .qw{display:none} }
/* more than three decks: Bench / Keep out live in a per-row menu so the row keeps its width */
.qmore{grid-column:1/-1;position:relative}
.qmore summary{list-style:none}
.qmore summary::-webkit-details-marker{display:none}
.qmenu{position:absolute;right:0;top:calc(100% + 3px);z-index:6;display:grid;grid-template-columns:repeat(2,auto);gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.qb:hover{border-color:var(--qc);color:var(--ink)}
.qb[aria-pressed="true"]{background:var(--qc);border-color:var(--qc);color:var(--panel)}
.noteDot{font-size:.8rem;color:var(--accent)}
.tag.own{font-family:var(--mono)}
.tag.sus{border-style:dotted;color:var(--warn);border-color:var(--warn)}
.tag.hid{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.tag.vd{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent);font-family:var(--mono)}
.tag.vd.pre,.dpv.pre{border-style:dotted}
.tag.vd.stale,.dpv.stale{border-style:dashed}
.dpv{flex:0 0 auto;font:600 .8rem/1.2 var(--mono);color:var(--dc);border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);border-radius:3px;padding:1px 6px;min-width:2.6em;text-align:center}
.vlegend{font-size:.78rem;color:var(--muted);margin:2px 0 8px}
.tag.done{color:var(--accent);border-color:var(--accent);font-weight:600}
.rw.applied .row{opacity:.62}
.row .rank{font:500 .72rem/1 var(--mono);color:var(--muted);min-width:2.2em;text-align:right;flex:none}
.rw.paired .row{box-shadow:inset 3px 0 0 var(--dc,var(--accent));background:color-mix(in srgb,var(--dc,var(--accent)) 10%,var(--panel))}
.pairbtn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.pairbtn:hover:not(:disabled){border-color:var(--dc,var(--accent));color:var(--ink)}
.pairbtn:disabled{opacity:.4;cursor:default}
.conf{border:1px solid var(--warn);border-radius:6px;padding:8px 12px;background:var(--panel);font-size:.86rem;color:var(--ink)}
.conf b{color:var(--warn)} .conf ul{margin:4px 0 0;padding-left:18px}
.ownrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;flex-basis:100%}
.bulk #bulkask{display:inline-flex;gap:6px;align-items:center;font-size:.86rem}
.ownrow input{width:4.5em;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:var(--ink)}
.undobtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.undobtn:disabled{opacity:.45;cursor:default}
.undobtn:hover:not(:disabled){color:var(--ink);border-color:var(--brass)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 16px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.arenacopy{margin:.5rem 0 .25rem}
.arenatxt{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.4rem}
/* alternate Arena printings (view-only) */
details.arts summary{cursor:pointer;color:var(--accent);width:max-content;font-size:.86rem}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:6px}
.artbtn{all:unset;cursor:zoom-in;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);line-height:1.3}
.artbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.artbtn img,.artbtn .artspr{width:122px;height:89px;border-radius:4px;display:block;object-fit:cover;background-repeat:no-repeat;background-color:var(--raise)}
.artbtn b{color:var(--ink);font-weight:600}
dialog#artzoom{border:none;padding:0;background:transparent;max-width:min(94vw,560px)}
dialog#artzoom::backdrop{background:rgba(0,0,0,.72)}
#artbig{width:min(90vw,366px);aspect-ratio:366/267;border-radius:10px;background-repeat:no-repeat;margin:0 auto}
/* compare view */
.cmphead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:10px}
.cmphead label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmphead select,.cmphead input{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:var(--panel);border:none;padding:5px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--ink);font-weight:600}
.cmpcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.cmpcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.cmpcol h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em;color:var(--dc,var(--ink))}
.cmpcol .rows{max-height:calc(100vh - 230px);overflow:auto}
/* one deck: verdict sections in the candidate column, the header pinned while its cards scroll */
.vsec{position:sticky;top:0;z-index:2;background:var(--raise);border-bottom:1px solid var(--line)}
.vsechd{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;cursor:pointer;font:600 .8rem/1.3 var(--ui);letter-spacing:.04em;color:var(--ink)}
.vsechd .n{margin-left:auto;font:500 .74rem/1 var(--mono);color:var(--muted)}
.vsechd .caret{width:1em;color:var(--muted)}
.vsechd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:1000px){ .seg{display:inline-flex} .cmpcols{grid-template-columns:minmax(0,1fr)} .cmpcols[data-side="L"] .cmpcol[data-side="R"],.cmpcols[data-side="R"] .cmpcol[data-side="L"]{display:none} .cmpcol .rows{max-height:none} }
/* mana curve, now vs after */
.curve{background:var(--raise);border-left:2px solid var(--dc);border-radius:4px;padding:8px 10px}
.curve h4{margin:0 0 6px;font-size:.9rem}
.curve .bars{margin-top:14px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:92px;border-bottom:1px solid var(--line)}
.curve .grp{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%;position:relative}
.curve .b{width:min(14px,40%);border-radius:4px 4px 0 0;min-height:1px}
.curve .b.now{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.curve .b.aft{background:var(--dc)}
.curve .v{position:absolute;font:500 .68rem/1 var(--mono);color:var(--ink)}
.curve .ax{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font:500 .7rem/1.6 var(--mono);color:var(--muted);text-align:center}
.curve .leg{display:flex;gap:12px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.curve .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:var(--read);font-style:italic}
/* inline comment row (same note as the pane) */
.inote{display:flex;gap:8px;align-items:flex-start;padding:4px 10px 8px 49px;background:var(--sel)}
.inote textarea{flex:1;min-height:2.4em}
.inote .saved{align-self:center}

/* hover preview while the pane is collapsed */
#peek{position:fixed;z-index:30;width:280px;pointer-events:none;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);background:var(--raise)}
#peek img{width:100%;display:block;border-radius:12px}

/* detail */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--brass) 70%,transparent);border-radius:6px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.dimg{display:flex;align-items:center;gap:6px;justify-content:center}
.dimg button.big{all:unset;cursor:zoom-in;display:block;max-width:320px;width:100%}
.dimg button.big:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.flipline{display:flex;justify-content:center;margin:6px 0 0}
.dimg img{width:100%;border-radius:12px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.step{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none;font-size:1.1rem;line-height:1}
.dname{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtype{margin:-6px 0 0;color:var(--muted);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.reason{font-family:var(--read);font-size:.98rem;line-height:1.55;margin:0}
.reason .seal{display:inline-block;margin-right:6px;vertical-align:2px}
.reason code{font-family:var(--mono);font-size:.82em;background:var(--raise);border-radius:3px;padding:0 3px}
.reason.pending{color:var(--muted);font-style:italic}
.rules{font-size:.86rem}
.rules summary{cursor:pointer;color:var(--accent);width:max-content}
.rules p{white-space:pre-wrap;margin:6px 0 0;font-family:var(--read)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks.dp{align-items:center;margin-bottom:6px}
.picks .dpl{flex:0 0 5.5em;font:600 .78rem/1.2 var(--ui);color:var(--dc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.pb:hover{border-color:var(--qc,var(--accent))}
.pb[aria-pressed="true"]{background:color-mix(in srgb,var(--qc,var(--accent)) 16%,var(--panel));border-color:var(--qc,var(--accent));font-weight:600}
.field-l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cutq,textarea.note,.addform textarea,.addform input,.addform select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.88rem;color:var(--ink)}
textarea.note{resize:vertical;min-height:3.2em;font-family:var(--read)}
.ghost{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;cursor:pointer;width:max-content;font-size:.84rem}
.saved{font-size:.78rem;color:var(--accent);min-height:1em}
.kbd{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.kbd span{border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:2px}

/* sheet (phone detail) */
dialog#sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:14px 14px 0 0;background:var(--panel);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(0,0,0,.5)}
dialog#sheet .detail{position:static;max-height:none;border:none;box-shadow:none;border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheetbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}

/* full-width views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.dlist{border-top:2px solid var(--dc)}
.qb[data-sug],.pb[data-sug]{outline:2px dashed var(--qc);outline-offset:-4px}
.tag.sug{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.sugbox{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:8px 0}
.sugbox p{margin:4px 0}
.reply{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 6px 6px 0}
.hist{font-size:.8rem}
.histlist{margin:10px 0}.histlist summary{cursor:pointer;font-weight:600}
.histlist li.bad{color:var(--bad)}
.dlist h3{color:var(--dc)}
.tablewrap{overflow-x:auto}
.dlist table,.proj table{width:100%;border-collapse:collapse;font-size:.86rem}
.dlist th,.dlist td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dlist thead th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dlist td:first-child{font-family:var(--mono);color:var(--muted)}
.dlist td.dcard{display:flex;align-items:center;gap:8px}
.dlist .th{flex:0 0 34px;width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise);display:block}
.dlist .th img{width:100%;height:100%;object-fit:cover;display:block}
.dlist .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.dlist tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--raise) 70%,transparent)}
.dlist tr.cutrow td{background:var(--sel)}
.dlist tr.protsep th{color:var(--dc);font-family:var(--display);font-weight:400;padding-top:12px;border-bottom:1px solid var(--dc)}
.dlist td.marks{white-space:nowrap}
.linkish{all:unset;cursor:zoom-in;border-bottom:1px dotted var(--muted)}
/* choosing cuts */
.tag.need{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.cutpick{margin:8px 0 10px;padding:8px;border:1px solid color-mix(in srgb,var(--dc) 35%,var(--line));border-radius:6px}
.cuthead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cutcur{display:flex;gap:6px;align-items:center;font-size:.86rem}
.cutcur .th,.cutopt .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise);display:block}
.cutcur .th img,.cutopt .th img{width:100%;height:100%;object-fit:cover;display:block}
.cutcur .th .spr,.cutopt .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.cutpanel{margin-top:8px}
/* a FIXED height: a preview that grew with each card moved the list under the pointer, so hovering jittered */
.cutprev{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0;height:190px;overflow:auto;font-size:.82rem}
.cutprev img{width:120px;border-radius:6px;display:block}
.cutprev .cpn{margin:0}
.cutprev .cpx{margin:4px 0;font-size:.8rem;line-height:1.35}
.cutlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.cutopt{display:grid;grid-template-columns:34px 2.4em 1fr auto;gap:6px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:4px 6px;cursor:pointer;color:var(--ink);font:inherit;font-size:.84rem}
.cutopt:hover,.cutopt:focus-visible{background:color-mix(in srgb,var(--dc) 10%,var(--panel))}
.cutopt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cutopt[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--dc);background:color-mix(in srgb,var(--dc) 14%,var(--panel))}
.cutopt .rk{font:500 .72rem/1 var(--mono);color:var(--muted);text-align:right}
.cutsep{margin:0;padding:4px 6px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--raise)}
.inspect{margin-top:14px;padding-top:10px;border-top:2px solid var(--dc)}
.inspect .ihead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inspect .ibody{display:grid;grid-template-columns:140px 1fr;gap:10px;margin-top:6px}
.inspect .ibody img{width:140px;border-radius:7px;display:block}
.pkg{margin:0 0 8px;font-size:.86rem}
.pkg summary{cursor:pointer}
.pkg ul{margin:4px 0 0;padding-left:1.1em}
.pkg li{margin:3px 0}
.need-t{color:var(--warn)}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 7px;font-size:.76rem;cursor:pointer;margin:0 2px 2px 0}
.mini[aria-pressed="true"]{background:color-mix(in srgb,var(--dc) 18%,var(--panel));border-color:var(--dc);font-weight:600}
.proj{border-left:2px solid var(--dc);background:var(--raise);border-radius:4px;padding:8px 10px;margin:0 0 10px}
.proj h4{margin:0 0 4px;font-size:.9rem}
.proj th[scope=row]{text-align:left;font-weight:500;padding:2px 10px 2px 0}
.proj td{font-family:var(--mono);padding:2px 10px 2px 0}
.warnline{color:var(--warn);font-size:.85rem;margin:6px 0 0}
.status{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--panel);border:none;border-radius:5px;padding:7px 14px;cursor:pointer;font-weight:600}
.plist h3{font-size:1rem;margin-top:12px} .plist ul{margin:0;padding-left:18px} .plist li{margin:3px 0}
.addform{display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reqs{padding-left:18px;margin:6px 0 10px} .reqs li{margin-bottom:6px}

/* dialogs */
dialog#zoom{border:none;padding:0;background:transparent;max-width:min(92vw,560px)}
dialog#zoom::backdrop{background:rgba(0,0,0,.72)}
dialog#zoom img{display:block;width:100%;border-radius:14px}
.zoombar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.zoombar span{color:#fff;font-size:.88rem;text-shadow:0 1px 2px #000}
.zoombar button{border:none;border-radius:999px;padding:4px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
dialog#cmp{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(96vw,900px);padding:16px}
dialog#cmp::backdrop{background:rgba(0,0,0,.6)}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:8px 0 12px}
.cmpside img{width:100%;max-width:260px;border-radius:10px;display:block}
.cmplab{font:600 .7rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.cmpside .rules p{font-size:.86rem}
@media (prefers-reduced-motion:no-preference){ .row{transition:background-color .12s} .pb,.qb{transition:background-color .12s,border-color .12s} }

  document.querySelectorAll(`img[data-face="${id}"]`).forEach(im=>{ im.dataset.fb=fallbackOf(c,b); im.src=imgSrc(c,"l",b); im.alt=c.n+(b?" (back face)":""); });

/* Decks: label from build.json (else the commander's first name), accent from the deck's most-produced colour. */

const HROLES = ["interaction","card advantage"];

/* ---------- preferences: theme (shared with the dashboard) and the pane ---------- */
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||"{}")||{}; }catch(e){ return {}; } }
function effectiveTheme(){ const a=document.documentElement.getAttribute("data-theme"); if(a==="light"||a==="dark") return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }
function paintThemeBtn(){ const t=effectiveTheme(), b=document.getElementById("themebtn"), next=t==="dark"?"light":"dark";
  b.textContent = t==="dark" ? "☾ Dark" : "☀ Light"; b.setAttribute("aria-label",`Theme: ${t}. Switch to ${next}`); b.title=`Switch to ${next} (t)`; }
function toggleTheme(){ const next=effectiveTheme()==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next);
  const p=readJSON("mtga-prefs"); p.theme=next; try{ localStorage.setItem("mtga-prefs",JSON.stringify(p)); }catch(e){} paintThemeBtn(); }
const PREFS = readJSON("builder-prefs");
let PANE = PREFS.pane!=="closed";
/* One deck: Compare's candidate column is grouped by the deck's verdict, best first, ungraded
   cards before ✗, and ✗ starts collapsed — the reject pile is there when you open it. */
const VNONE = "–";
let VCOLL = new Set(Array.isArray(PREFS.vcoll) ? PREFS.vcoll : ["✗"]);
function savePrefs(){ try{ localStorage.setItem("builder-prefs",JSON.stringify({pane:PANE?"open":"closed", vcoll:[...VCOLL]})); }catch(e){} }
const vBand = (c,k) => { const m=(c.vd||{})[k]; return VORDER.includes(m) ? m : VNONE; };
function verdictSections(xs, k){ const order=[...VORDER.filter(m=>m!=="✗"), VNONE, ...VORDER.filter(m=>m==="✗")], by={};
  xs.forEach(c=>{ const b=vBand(c,k); (by[b]=by[b]||[]).push(c); });
  return order.filter(m=>by[m]).map(m=>({m, cards:by[m]})); }
/* Open the section a card sits in, so a jump to it can land. */
function revealCand(id){ const c=BYID[id]; if(c&&VCOLL.delete(vBand(c,K1))) savePrefs(); }
function applyPane(){ const con=document.getElementById("console"), b=document.getElementById("panebtn");
  con.classList.toggle("nopane",!PANE); b.setAttribute("aria-expanded",String(PANE)); b.textContent=PANE?"Hide card pane":"Show card pane"; b.title=(PANE?"Hide":"Show")+" the card pane (p)"; if(PANE) hidePeek(); }
function togglePane(){ PANE=!PANE; savePrefs(); applyPane(); }

/* One mana / ability symbol as a pip. `cls` adds "in" for symbols set inside running text. */
const SYMWORD = {T:"tap", Q:"untap", E:"energy", S:"snow"};
function pip1(t, cls=""){ const s=t.slice(1,-1), k=` class="pip${cls?" "+cls:""}`;
  if(s==="T"||s==="Q") return `<span${k} sym" role="img" aria-label="${SYMWORD[s]}" title="${esc(t)} — ${SYMWORD[s]}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="${s==="T"?"M3.2 8.6A3.6 3.6 0 1 1 8.8 8.4":"M8.8 3.4A3.6 3.6 0 1 0 3.2 3.6"}" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="${s==="T"?"M8.9 5.9 8.8 8.6 6.2 8.2":"M3.1 6.1 3.2 3.4 5.8 3.8"}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>`;
  const parts=s.split("/"), col=x=>({W:"--pW",U:"--pU",B:"--pB",R:"--pR",G:"--pG"})[x];
  const bg = parts.length===2&&col(parts[0])&&col(parts[1]) ? `linear-gradient(135deg,var(${col(parts[0])}) 50%,var(${col(parts[1])}) 50%)` : col(parts[0])?`var(${col(parts[0])})`:"var(--pC)";
  return `<span${k}" style="background:${bg}" title="${esc(t)}">${esc(parts.length===2&&parts[1]==="P"?parts[0]:s.length>2?s[0]:s)}</span>`; }
function pips(cost){ return (String(cost||"").split(" // ")[0].match(/\{[^}]+\}/g)||[]).map(t=>pip1(t)).join(""); }
/* Symbols inside already-escaped text: {T}, {G}, {2}, {B/P}… become pips; anything longer than a
   symbol (a brace in prose) is left alone. */
const sym = html => String(html).replace(/\{(?:[WUBRGCXYZSTQE]|\d{1,2}|[WUBRGC2]\/[WUBRGP])\}/g, t=>pip1(t,"in"));
function stripe(c){ const cols=[...new Set(((c.c||"").split(" // ")[0].match(/[WUBRG]/g)||[]))].sort((a,b)=>"WUBRG".indexOf(a)-"WUBRG".indexOf(b));
  const v=(cols.length?cols:["C"]).map(x=>`var(--id${x})`); if(v.length===1) v.push(v[0]); return `linear-gradient(${v.join(",")})`; }
function reasonOf(c){ const r=reasons[c.id]; if(r&&r.text) return {g:r.group||"",w:r.text}; return c.w?{g:c.g,w:c.w}:null; }
const isSwap = c => { const r=reasonOf(c); return !!r && (r.g==="A"||r.g==="Swap candidate"); };
const groupLabel = g => GROUP[g]||g||"Reason";
const gk = c => { const g=(reasonOf(c)||{}).g||"zz"; return (g==="A"||g==="Swap candidate")?"00":g; };
const marked = id => ((picks[id]||{}).picks||[]).some(v=>!/^(un)?prot/.test(v));
/* Decided for a deck: the card is in it, or carries Add, Cut, Bench or Keep out for it. A pile is
   reviewed card by card against the decks it speaks for (its own deck, or every deck when shared). */
const decided = (c,k) => !!c["i"+k] || ["add","cut","bench","out"].some(x=>hasPick(c.id,x+k));
const decidedInPile = c => pileScope(c).every(k=>decided(c,k));
/* Applied: the deck files already show this pick (the swap or header edit landed). */
function isApplied(id,v){ const k=deckOfPick(v), c=BYID[id], nm=nameOf(id); if(!k) return false;
  if(v==="add"+k) return !!(c&&c["i"+k]); if(v==="cut"+k) return !!c&&!c["i"+k];
  if(v==="prot"+k) return PROT[k].has(nm); if(v==="unprot"+k) return !PROT[k].has(nm); return false; }
const pending = id => ((picks[id]||{}).picks||[]).filter(v=>!isApplied(id,v));
const hasApplied = id => ((picks[id]||{}).picks||[]).some(v=>isApplied(id,v));
const hasPick = (id,v) => ((picks[id]||{}).picks||[]).includes(v);
/* Hidden roles: a role the classifier does not count. Suspected (hr) are the classifier's own
   coverage flags; confirmed come from build.json (hc) or from a mark on this page (hid). */
const hidOf = c => [...new Set([...(c.hc||[]), ...((picks[c.id]||{}).hid||[])])];
const hidBonus = (c,role) => hidOf(c).includes(role) && !(role==="interaction"?c.ri:c.rc) ? 1 : 0;
function conflicts(){ const out=[];
  DK.forEach(k=>{ const d=DECKS[k], uses={};
    Object.keys(picks).forEach(id=>{ if(!hasPick(id,"add"+k)||isApplied(id,"add"+k)) return; const cut=(picks[id].pair||{})[k]; if(!cut) return;
      (uses[cut]=uses[cut]||[]).push(nameOf(id)); const cc=BYID[slug(cut)];
      if(!cc||!cc["i"+k]) out.push({k,ids:[id],msg:`${nameOf(id)} is set to replace ${cut}, which is no longer in ${d.label}.`});
      else if(cc["p"+k]&&!hasPick(cc.id,"unprot"+k)) out.push({k,ids:[id,cc.id],msg:`${nameOf(id)} is set to replace ${cut}, a protected card in ${d.label}.`}); });
    Object.entries(uses).forEach(([cut,adds])=>{ if(adds.length>1) out.push({k,ids:[slug(cut),...adds.map(slug)],msg:`${cut} is the cut for ${adds.length} adds in ${d.label}: ${adds.join(", ")}.`}); }); });
  return out; }
function nextBand(k,i,c){ const R=(LIVE[k]||{}).req||{}, order=["D","C","B","A"], cur=bandOf(k,i,c), nx=order[order.indexOf(cur)+1]; if(!nx||!R[nx]) return null;
  const needI=Math.max(0,R[nx][0]-i), needS=Math.max(0,R[nx][1]-(i+c)), parts=[];
  if(needI) parts.push(`+${needI} interaction`); if(needS>needI) parts.push(`+${needS-needI} ${needI?"more ":""}interaction or card advantage`);
  return {b:nx, parts}; }
const hasNote = id => !!((picks[id]||{}).note||"").trim();
/* Claude's suggestions (sug: [{v, why}]) are not picks: nothing counts them until the owner
   marks the same pick, which accepts it. A suggested button is drawn dashed. */
const sugOf = (id,v) => ((picks[id]||{}).sug||[]).find(g=>g.v===v);
const sugA = (id,v,on) => !on&&sugOf(id,v) ? ` data-sug="1"` : "";
const openSugs = id => ((picks[id]||{}).sug||[]).filter(g=>!hasPick(id,g.v));
function sugHTML(id){ const xs=openSugs(id); if(!xs.length) return "";
  return `<div class="sugbox" role="note"><p class="field-l">Claude suggests</p>${xs.map(g=>`<p><span class="tag sug">${esc(PICKLAB[g.v])}</span> ${esc(g.why||"")}
    <button type="button" class="mini" data-id="${id}" data-v="${g.v}">Accept</button><button type="button" class="mini" data-sugno="${id}" data-sv="${g.v}">Dismiss</button></p>`).join("")}</div>`; }
/* Claude's reply to a note, written to the card's record (reply, replyTo = the note it answers). */
function replyHTML(id){ const p=picks[id]||{}; if(!p.reply||!(p.note||"").trim()) return "";
  const old=(p.replyTo||"").trim()!==(p.note||"").trim();
  return `<div class="reply"><b>Claude:</b> ${esc(p.reply)}${old?` <span class="status">(a reply to an earlier version of your note)</span>`:""}</div>`; }
/* Settled marks move to done: [{v, at}] (Clear applied marks, or Claude's cleanup after an apply),
   so a mark that left with no history entry is one the owner took back. */
const histText = id => ((picks[id]||{}).done||[]).map(x=>`${PICKLAB[x.v]||x.v} — applied ${String(x.at||"").slice(0,10)}`);
function histHTML(id){ const h=histText(id); return h.length?`<p class="status hist">History: ${esc(h.join("; "))}</p>`:""; }
const inAny = c => DK.some(k=>c["i"+k]);
const LABEL_RE = new RegExp("^("+DK.map(k=>DECKS[k].label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+"):\\s*");
function firstLine(c){ const r=reasonOf(c); if(!r) return inAny(c) ? "In the list" : ""; let t=plain(r.w).replace(LABEL_RE,""); const m=t.match(/^(.{20,140}?[.;])\s/); return m?m[1]:t.slice(0,140); }
const RAR = {M:"mythic",R:"rare",U:"uncommon",C:"common"};
function own(c){ return c.o ? `Owned ×${c.o}` : `Craft ${RAR[c.r]||c.r}`; }
function ownTag(c){ const q=(picks[c.id]||{}).own, fix=(q!==undefined&&q!==null&&q!==c.o)?` → ${q}`:"";
  return `<span class="tag own" title="${c.o?`You own ${c.o}`:`Not owned — a ${RAR[c.r]||c.r} craft`}${fix?`; correction queued: ${q}`:""}">${c.o?`×${c.o}`:`craft ${esc(c.r)}`}${fix}</span>`; }
function roleTags(c, all){ const hid=hidOf(c), sus=(c.hr||[]).filter(r=>!hid.includes(r)), cap=r=>r[0].toUpperCase()+r.slice(1);
  const short=r=>all?cap(r):(r==="interaction"?"Int":"CA");
  return [...(c.ro||[]).slice(0, all?99:1).map(r=>`<span class="tag">${esc(r)}</span>`),
    ...hid.map(r=>`<span class="tag hid" title="Counts as ${r} in play; the tools do not count it">${short(r)} · hidden</span>`),
    ...sus.map(r=>`<span class="tag sus" title="Reads like ${r}, but the classifier did not count it — read the text">${short(r)}?</span>`)].join(""); }

/* ---------- rows ---------- */
function quick(c){ const p=(picks[c.id]||{}).picks||[];
  if(ONE){ const k=K1, btn=(v,label)=>`<button type="button" class="qb" style="--qc:${pickColour(v)}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}"${sugA(c.id,v,p.includes(v))} aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${label}</button>`;
    if(c["i"+k]) return `<span class="q one">${btn("cut"+k,"− Cut")}</span>`;
    return `<span class="q one">${btn("add"+k,"+ Add")}${btn("bench"+k,`<span class="qi">${ICON.bench}<span class="qw">Bench</span></span>`)}${btn("out"+k,`<span class="qi">${ICON.out}<span class="qw">Keep out</span></span>`)}</span>`; }
  const dbtn = DK.map(k=>{ const inK=c["i"+k], v=(inK?"cut":"add")+k; return `<button type="button" class="qb" style="--qc:${DECKS[k].dc}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}"${sugA(c.id,v,p.includes(v))} aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}">${inK?"−":"+"}${esc(k)}</button>`; }).join("");
  const many=DK.length>3, n=many?2:Math.max(2,DK.length), pad=(xs)=>xs.concat(Array(Math.max(0,n-xs.length)).fill("<span></span>")).join(""), scope=pileScope(c);
  const xb=(kind,k)=>{ if(c["i"+k]) return "<span></span>"; const v=kind+k;
    return `<button type="button" class="qb" style="--qc:${pickColour(v)}" data-id="${c.id}" data-v="${v}" aria-pressed="${p.includes(v)}"${sugA(c.id,v,p.includes(v))} aria-label="${esc(PICKLAB[v])}: ${esc(c.n)}" title="${esc(PICKLAB[v])}"><span class="qi">${ICON[kind]}${esc(k)}</span></button>`; };
  if(many){ const set=p.filter(v=>["bench","out"].includes(kindOf(v))).length;
    return `<span class="q" style="--qn:2">${dbtn}${DK.length%2?"<span></span>":""}<details class="qmore"><summary class="qb" aria-label="Bench or keep out: ${esc(c.n)}${set?` (${set} set)`:""}" title="Bench / Keep out">⋯${set?` ${set}`:""}</summary><span class="qmenu">${scope.flatMap(k=>[xb("bench",k),xb("out",k)]).join("")}</span></details></span>`; }
  const xbtn = scope.length===1 ? pad([xb("bench",scope[0]),xb("out",scope[0])]) : pad(scope.map(k=>xb("bench",k)))+pad(scope.map(k=>xb("out",k)));
  return `<span class="q" style="--qn:${n}">${dbtn}${"<span></span>".repeat(Math.max(0,n-DK.length))}${xbtn}</span>`; }
function noteRowHTML(c,col){ const p=picks[c.id]||{};
  return `<div class="inote"><textarea class="note" id="ni-${col}${c.id}" data-id="${c.id}" rows="1" aria-label="Note for Claude on ${esc(c.n)}" placeholder="A note for Claude on ${esc(c.n)} (Esc to close)">${esc(p.note||"")}</textarea><span class="saved" data-saved="${c.id}" aria-live="polite"></span></div>`; }
/* A row. `col` is "" in a pile view, "L"/"R" in the Compare view (a card can be in both columns,
   so rows are found by data attributes, never by id). The deck column adds the cut rank and ⇄. */
function rowHTML(c, col=""){
  const tags = DK.filter(k=>c["i"+k]).map(k=>`<span class="tag ${c["p"+k]?"prot":"in"}" style="--dc:${DECKS[k].dc}">${c["p"+k]?"Protected":"In"}${ONE?(c["p"+k]?"":" the deck"):" "+esc(DECKS[k].label)}</span>`).join("")
    + DK.filter(k=>(c.vd||{})[k]).map(k=>`<span class="tag vd ${(c.vs||{})[k]||""}" style="--dc:${DECKS[k].dc}" title="${esc(vTitle(c,k))}">${ONE?"":esc(k)+" "}${esc(c.vd[k])}</span>`).join("");
  const ap = hasApplied(c.id), k=CMP.deck, d=DECKS[k];
  let extra="", cls="", lead="";
  if(col==="R"){ const x=d.list.find(x=>x.n===c.n)||{}, s=BYID[SEL], cutBy=pairedTo(k,c.n);
    lead=`<span class="rank" title="${x.prot?"Protected":"Cut rank (1 = most cuttable)"}">${x.prot?"P":"#"+(x.r??"–")}</span>`;
    const can = s && !s["i"+k] && s.id!==c.id;
    extra=`<button type="button" class="pairbtn" style="--dc:${d.dc}" data-pair="${c.id}" ${can?"":"disabled"} aria-label="${can?`${esc(s.n)} replaces ${esc(c.n)}`:`Select a pile card first, then pair it with ${esc(c.n)}`}" title="${can?`${esc(s.n)} replaces this`:"Select a pile card first"}">⇄</button>`;
    if(s && (((picks[s.id]||{}).pair||{})[k]===c.n)) cls=" paired";
    if(cutBy.length) lead+=`<span class="tag" title="Chosen as the cut">→ ${esc(cutBy.join(", "))}</span>`; }
  if(col==="L"){ const s=BYID[SEL]; if(s&&s.id===c.id) cls=" paired"; }
  return `<div class="rw${ap?" applied":""}${cls}" role="listitem" data-w="${c.id}" data-col="${col}" style="--dc:${d?d.dc:"var(--accent)"}"><div class="row ${(col==="R"?c.id===INSPECT:c.id===SEL)?"sel":""}" data-row="${c.id}" style="--stripe:${stripe(c)}">
    <span class="stripe" aria-hidden="true"></span>
    <span class="th">${thumb(c)}</span>
    <button type="button" class="main" data-sel="${c.id}" aria-current="${col==="R"?c.id===INSPECT:c.id===SEL}" aria-expanded="${NOTEOPEN===c.id&&NOTECOL===col}" title="Click again to write a note">
      <span class="l1"><span class="nm">${esc(c.n)}</span><span class="cost">${pips(c.c)}</span><span class="noteDot" title="Has a note"${hasNote(c.id)?"":" hidden"}>✎</span></span>
      <span class="l2">${lead}${ap?`<span class="tag done">Applied ✓</span>`:""}${openSugs(c.id).length?`<span class="tag sug" title="Claude suggests ${esc(openSugs(c.id).map(g=>PICKLAB[g.v]).join("; "))} — open the card to accept or dismiss it">✦ suggested</span>`:""}${isSwap(c)?`<span class="seal">Swap</span>`:""}${col==="R"?"":tags}${ownTag(c)}${(c.al||[]).length>1?`<span class="tag" title="${c.al.length} artworks on Arena — see the card pane">⧉${c.al.length}</span>`:""}${DK.filter(k=>needsCut(c.id,k)).map(k=>`<span class="tag need" title="Added to ${esc(DECKS[k].label)} with no cut chosen yet">needs a cut${ONE?"":` · ${esc(k)}`}</span>`).join("")}${roleTags(c,false)}<span class="why1">${sym(esc(firstLine(c)))}</span></span>
    </button>
    ${extra}${quick(c)}
  </div>${NOTEOPEN===c.id&&NOTECOL===col?noteRowHTML(c,col):""}</div>`;
}

/* The cut picker: the deck's nonland cards in deck.py cuts order, each with its picture, rank, roles and
   verdict; hovering or focusing one shows it in full above the list, clicking it sets the pair. */
function cutPrevHTML(id,k,addId){ const x=BYID[id]; if(!x) return `<p class="status">Hover or focus a card below to read it here.</p>`;
  const d=DECKS[k], li=d.list.find(y=>y.n===x.n)||{}, r=reasonOf(x);
  return `<img src="${esc(imgSrc(x,"l"))}" data-fb="${esc(fallbackOf(x))}" alt="${esc(x.n)}" loading="lazy"><div><p class="cpn"><b>${esc(x.n)}</b> ${pips(x.c)}</p><p class="status">${esc(x.t)} · ${li.prot?"protected":`cut rank #${li.r??"–"}`}${(x.vd||{})[k]?` · ${esc(x.vd[k])} ${esc(VLAB[x.vd[k]]||"")}`:""}</p>
    <p class="cpx">${sym(esc(x.x||""))}</p>${r?`<p class="cpx status">${fmt(r.w)}</p>`:""}<button type="button" class="ghost" data-cmp="${esc(addId)}" data-cut="${esc(x.id)}">Compare side by side</button></div>`; }
function cutPickerHTML(c){ const p=picks[c.id]||{}, v=p.picks||[];
  return DK.filter(k=>v.includes("add"+k)&&!c["i"+k]).map(k=>{ const d=DECKS[k], cur=(p.pair||{})[k]||"", cc=cur?BYID[slug(cur)]:null, key=`${c.id}|${k}`, open=CUTOPEN===key;
    const li=cc?(d.list.find(y=>y.n===cur)||{}):{};
    const head = cur ? `<span class="cutcur">${cc?`<span class="th">${thumb(cc)}</span>`:""}<span><b>${esc(cur)}</b><br><span class="status">${li.prot?"protected":`cut rank #${li.r??"–"}`}${cc&&(cc.vd||{})[k]?` · ${esc(cc.vd[k])}`:""}</span></span>
        <button type="button" class="mini" data-cutset="${key}" data-cut="" aria-label="Clear the cut for ${esc(c.n)} in ${esc(d.label)}">✕</button>${cc?`<button type="button" class="mini" data-cmp="${c.id}" data-cut="${cc.id}">Compare</button>`:""}</span>`
      : `<span class="tag need">needs a cut</span>`;
    const opts = [...d.list.filter(x=>!x.prot),null,...d.list.filter(x=>x.prot)].map(x=>{ if(x===null) return `<p class="cutsep">Protected — listed last</p>`;
      const xc=BYID[slug(x.n)], xid=xc?xc.id:slug(x.n), by=pairedTo(k,x.n).filter(n=>n!==c.n), vm=xc&&(xc.vd||{})[k];
      return `<button type="button" class="cutopt" data-cutset="${key}" data-cut="${esc(x.n)}" data-prev="${esc(xid)}" data-q="${esc((x.n+" "+(x.roles||[]).join(" ")+" "+(xc&&xc.x||"")).toLowerCase())}" aria-pressed="${x.n===cur}">
        <span class="th">${xc?thumb(xc):""}</span><span class="rk">${x.prot?"P":"#"+(x.r??"–")}</span><span class="cn">${esc(x.n)} <span class="cost">${xc?pips(xc.c):""}</span><br><span class="status">${esc((x.roles||[]).join(", ")||"no detected role")}${by.length?` · already the cut for ${esc(by.join(", "))}`:""}</span></span>${vm?`<span class="tag vd" style="--dc:${d.dc}">${esc(vm)}</span>`:""}</button>`; }).join("");
    return `<div class="cutpick" style="--dc:${d.dc}"><p class="field-l">In ${esc(d.label)}, this replaces</p><div class="cuthead">${head}
      <button type="button" class="ghost" data-cutopen="${key}" aria-expanded="${open}">${open?"Close the list":cur?"Change the cut":"Choose a cut"}</button></div>
      ${open?`<div class="cutpanel"><input type="search" class="cutq" data-cutq="${key}" value="${esc(CUTQ)}" placeholder="Search ${esc(d.label)}'s list" aria-label="Search ${esc(d.label)}'s list">
        <div class="cutprev" aria-live="polite">${cutPrevHTML(cc?cc.id:null,k,c.id)}</div>
        <div class="cutlist" role="group" aria-label="${esc(d.label)}'s nonland cards, weakest fit first">${opts}</div></div>`:""}</div>`; }).join(""); }
function setPair(id,k,cut){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const p=picks[id]||(picks[id]={picks:[],note:""}); snapshot(id,`${nameOf(id)} replaces ${cut||"nothing"}`);
  const pr=Object.assign({},p.pair||{}); if(cut) pr[k]=cut; else delete pr[k]; p.pair=pr; persist(id);

const hideApplied = c => document.getElementById("hideapplied").checked && hasApplied(c.id) && !pending(c.id).some(v=>deckOfPick(v)) && c.id!==SEL;
const cmpPileOk = (c,k) => CMP.pile==="all" ? true : CMP.pile==="need" ? needsCut(c.id,k) : c.p===CMP.pile;
function cmpLists(){ const k=CMP.deck, d=DECKS[k];

    const secs=verdictSections(all,k), grouped=secs.length>1, L=grouped?secs.flatMap(s=>VCOLL.has(s.m)?[]:s.cards):all;
    const R=[...d.list.filter(x=>!x.prot),...d.list.filter(x=>x.prot)].map(x=>BYID[slug(x.n)]).filter(c=>c&&textHit(c,q));
    COLIDS={L:L.map(c=>c.id),R:R.map(c=>c.id)}; return {L,R,all,secs:grouped?secs:null}; }
  const q=CMP.q.trim().toLowerCase(), pileOk = c => cmpPileOk(c,k);
  const L=CARDS.filter(c=>c.p&&pileOk(c)&&!c["i"+k]&&!hideApplied(c)&&(!q||c.n.toLowerCase().includes(q)||(c.x||"").toLowerCase().includes(q)||(c.t||"").toLowerCase().includes(q)))
    .sort((a,b)=>gk(a).localeCompare(gk(b))||a.n.localeCompare(b.n));
  const R=[...d.list.filter(x=>!x.prot),...d.list.filter(x=>x.prot)].map(x=>BYID[slug(x.n)]).filter(Boolean)
    .filter(c=>!q||c.n.toLowerCase().includes(q)||(c.x||"").toLowerCase().includes(q)||(c.t||"").toLowerCase().includes(q));
  COLIDS={L:L.map(c=>c.id),R:R.map(c=>c.id)}; return {L,R}; }
function packageHTML(k){ const {paired,unpaired,cutsOnly}=packageOf(k), d=DECKS[k];
  if(!paired.length&&!unpaired.length&&!cutsOnly.length) return `<p class="status">No swaps for ${esc(d.label)} yet: mark adds in a pile, then choose each one's cut.</p>`;
  const addB=id=>`<button type="button" class="linkish" data-pkgsel="${id}">${esc(nameOf(id))}</button>`, cutB=n=>{ const x=BYID[slug(n)]; return x?`<button type="button" class="linkish" data-pkginsp="${x.id}">${esc(n)}</button>`:esc(n); };
  return `<details class="pkg" open><summary>Swap package · ${paired.length} paired${unpaired.length?` · <span class="need-t">${unpaired.length} need a cut</span>`:""}${cutsOnly.length?` · ${cutsOnly.length} cut with no add`:""}</summary><ul>
    ${paired.map(([id,cut])=>`<li>+ ${addB(id)} <span title="replaces">→</span> − ${cutB(cut)} <button type="button" class="mini" data-cmp="${id}" data-cut="${slug(cut)}">Compare</button></li>`).join("")}
    ${unpaired.map(id=>`<li>+ ${addB(id)} <span class="tag need">needs a cut</span></li>`).join("")}
    ${cutsOnly.map(id=>`<li>− ${cutB(nameOf(id))} <span class="status">no add chosen</span></li>`).join("")}</ul></details>`; }
function cmpSummaryHTML(k){ const pr=project(k), d=DECKS[k], delta=(x,y)=>x===y?`${x}`:`${x} → <span class="chg">${y}</span>`;
  if(ONE) return `${packageHTML(k)}${confHTML(k)}`;           // the deck panel above carries the curve and the figures
  return `${packageHTML(k)}${curveHTML(k)}<p class="kv" style="margin:6px 0 0"><span>Floor <b>${delta(pr.f0,pr.f1)}</b></span><span>Interaction <b>${delta(pr.i0,pr.i1)}</b></span><span>Card adv. <b>${delta(pr.c0,pr.c1)}</b></span><span>Size <b>${delta(pr.size0,pr.size1)}</b></span></p>${nextBandHTML(k,pr.i1,pr.c1)}${confHTML(k)}`; }
/* On a one-deck build the piles have no tabs, so the Pile menu carries each pile's progress. */
function pileDone(pk){ const xs=CARDS.filter(c=>c.p===pk); return [xs.filter(decidedInPile).length, xs.length]; }
function pileOptLabel(p){ if(!ONE) return p.label; const [dn,n]=pileDone(p.k); return `${p.label} · ${dn}/${n} decided`; }

    ${ONE?"":`<label for="cmpdeck">Deck<select id="cmpdeck">${DK.map(x=>`<option value="${esc(x)}" ${x===k?"selected":""}>${esc(DECKS[x].label)} (${esc(DECKS[x].full)})</option>`).join("")}</select></label>

function vsecHTML(s){ const open=!VCOLL.has(s.m), lab=s.m===VNONE?"No verdict yet":`${s.m} ${VLAB[s.m]||""}`;
  return `<div class="vsec" role="listitem"><button type="button" class="vsechd" data-vsec="${esc(s.m)}" aria-expanded="${open}"><span class="caret" aria-hidden="true">${open?"▾":"▸"}</span>${esc(lab)}<span class="n">${s.cards.length}</span></button></div>${open?s.cards.map(c=>rowHTML(c,"L")).join(""):""}`; }
function paintCompareRows(){ if(view!=="compare") return; const {L,R,all,secs}=cmpLists(), k=CMP.deck, d=DECKS[k], had=document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".cmpcol .rw");

  hr.textContent=`${d.label} · ${d.list.length} nonland cards, weakest fit first`;

    el.innerHTML = col==="L"&&secs ? secs.map(vsecHTML).join("") : xs.length?xs.map(c=>rowHTML(c,col)).join(""):`<p class="empty">No cards match.</p>`; el.scrollTop=st; });

  if(ONE){ const pool=CARDS.filter(c=>c.p&&cmpPileOk(c,k)&&!c["i"+k]), dn=pool.filter(decidedInPile).length;
    const hid=(all||L).length-L.length; document.getElementById("count").textContent=`${L.length} shown${hid?` (+${hid} collapsed)`:""} · ${dn}/${pool.length} decided`; }

function refreshView(id){ holdScroll(["window"], ()=>{ if(isPileView(view)) refreshRow(id); else if(view==="compare"){ paintCompareRows(); updateTabCounts(); renderDetail(); renderDecks(); } else { render(); renderDecks(); } }); }
function filtered(){ return toolbarFilter(CARDS.filter(c=>c.p===view)); }
/* The toolbar's filters and sort over a set of board cards: a pile view's pile, or on a one-deck
   build the Compare view's candidate column. The Reason menu lists the reasons present in it. */
const toolbarQ = () => document.getElementById("q").value.trim().toLowerCase();
const textHit = (c,q) => !q || c.n.toLowerCase().includes(q) || (c.x||"").toLowerCase().includes(q) || (c.t||"").toLowerCase().includes(q);
function toolbarFilter(xs){ const q=toolbarQ(), mem=document.getElementById("mem").value, sort=document.getElementById("sort").value;
  const grpSel=document.getElementById("grp"), present=[...new Set(xs.map(c=>(reasonOf(c)||{}).g).filter(Boolean))].sort(), cur=grpSel.value;
  grpSel.innerHTML=`<option value="all">Any</option>`+present.map(g=>`<option value="${esc(g)}">${esc(groupLabel(g))}</option>`).join(""); grpSel.value=present.includes(cur)?cur:"all";
  const role=document.getElementById("role").value, mvf=document.getElementById("mvf").value, ownf=document.getElementById("ownf").value, rar=document.getElementById("rar").value;
  xs=xs.filter(c=>{ if(!textHit(c,q)) return false;
    if(mem==="neither"&&inAny(c)) return false; if(mem==="every"&&!DK.every(k=>c["i"+k])) return false; if(DECKS[mem]&&!c["i"+mem]) return false;
    if(grpSel.value!=="all"&&(reasonOf(c)||{}).g!==grpSel.value) return false;
    if(!vfMatch(c,document.getElementById("vf").value)) return false;
    const dfv=document.getElementById("df").value; if(dfv==="any"?DK.every(k=>decided(c,k)):(DECKS[dfv]&&decided(c,dfv))) return false;
    const ro=c.ro||[]; if(role==="none"?ro.length:(role!=="all"&&!ro.includes(role))) return false;
    const mv=c.mv??0; if((mvf==="lo"&&mv>2)||(mvf==="mid"&&(mv<3||mv>4))||(mvf==="hi"&&mv<5)) return false;
    if((ownf==="own"&&!c.o)||(ownf==="craft"&&c.o)) return false; if(rar!=="all"&&c.r!==rar) return false;
    if(document.getElementById("hidemarked").checked&&marked(c.id)&&c.id!==SEL) return false;
    if(hideApplied(c)) return false;
    if(document.getElementById("swaponly").checked&&!isSwap(c)) return false; return true; });
  if(sort.startsWith("v:")){ const k=sort.slice(2); return xs.sort((a,b)=>vrank(a,k)-vrank(b,k)||a.n.localeCompare(b.n)); }
  return xs.sort((a,b)=> sort==="mv"?(a.mv??99)-(b.mv??99)||a.n.localeCompare(b.n) : sort==="group"?gk(a).localeCompare(gk(b))||a.n.localeCompare(b.n) : a.n.localeCompare(b.n)); }
function render(){
  const pile=PILES.find(p=>p.k===view); document.getElementById("intro").textContent=pile.intro;

    let again=false; if(!COLIDS.L.includes(SEL)&&COLIDS.L.length){ SEL=COLIDS.L[0]; again=true; }

  renderDetail(); }

/* ---------- bulk marks: every shown card still undecided for the chosen deck, one undo step ---------- */
function paintBulk(){ const sel=document.getElementById("bulkv"); if(!sel) return; const cur=sel.value, pile=PILEDEFS.find(x=>x.k===view);
  const ks=pile&&pile.deck&&DECKS[pile.deck]?[pile.deck]:DK;
  sel.innerHTML=ks.flatMap(k=>["bench","out"].map(x=>`<option value="${x+k}">${esc(PICKLAB[x+k])}</option>`)).join("");

const bulkTargets = v => { const k=deckOfPick(v); return (view==="compare"?COLIDS.L:VISIBLE).filter(id=>{ const c=BYID[id]; return c&&!c["i"+k]&&!decided(c,k); }); };
function askBulk(){ const v=document.getElementById("bulkv").value, ids=bulkTargets(v), box=document.getElementById("bulkask");
  if(!ids.length){ box.textContent=`No shown card is undecided for ${DECKS[deckOfPick(v)].label}.`; return; }
  box.innerHTML=`<span>${esc(PICKLAB[v])} for ${ids.length} card${ids.length>1?"s":""}?</span><button type="button" class="pb" id="bulkyes">Yes, mark ${ids.length}</button><button type="button" class="ghost" id="bulkno">Cancel</button>`;

function doBulk(){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const v=document.getElementById("bulkv").value, ids=bulkTargets(v);
  gesture(`${PICKLAB[v]}: ${ids.length} cards`, ()=>ids.forEach(id=>{ snapshot(id,""); const p=picks[id]||(picks[id]={picks:[],note:""}); p.picks=[...new Set([...(p.picks||[]),v])]; persist(id); }));

/* ---------- persistence ---------- */
function banner(msg){ const b=document.getElementById("banner"); if(msg){ b.textContent=msg; b.hidden=false; } else b.hidden=true; }
const LS=`builder-${SLUG}-picks`;
const saveLocal=()=>{ try{ localStorage.setItem(LS,JSON.stringify(picks)); }catch(e){} };
const loadLocal=()=>{ const x=readJSON(LS); Object.keys(x).forEach(id=>{ if(x[id]&&Array.isArray(x[id].picks)) x[id].picks=upgradeLegacy(id,x[id].picks).filter(v=>PICKLAB[v]); }); return x; };
const writing={};
/* The board's copy of each record as last read. A save sends only the fields the owner changed
   against it, as an `update`, and never `reply` / `replyTo` / fields it did not touch: a full
   `set` from a page holding an older copy erased a reply Claude had just written. `update`
   rejects a document that does not exist yet, and only then is the record created whole. */
const SERVER = {};
const PFIELDS = ["card","picks","note","pair","own","hid","pile","done","sug"];
function changedFields(full,srv){ if(!srv) return Object.assign({},full); const ch={};
  PFIELDS.forEach(k=>{ if(JSON.stringify(full[k]===undefined?null:full[k])!==JSON.stringify(srv[k]===undefined?null:srv[k])) ch[k]=full[k]; });
  return Object.keys(ch).length?ch:null; }
function flashSaved(id,local){ document.querySelectorAll(`[data-saved="${id}"]`).forEach(el=>{ el.textContent=local?"Saved in this browser":"Saved"; clearTimeout(el._t); el._t=setTimeout(()=>{el.textContent="";},2500); }); }
async function persist(id){ const p=picks[id]||{picks:[],note:""};
  if(!db){ saveLocal(); flashSaved(id,true); return; }
  if(writing[id]){ writing[id].again=true; return; } writing[id]={again:false};
  try{ const ref=db.collection("picks").doc(id);
    const ownSet = p.own!==undefined&&p.own!==null&&p.own!=="";
    if(!(p.picks||[]).length&&!p.note&&!ownSet&&!(p.hid||[]).length&&!(p.done||[]).length&&!(p.sug||[]).length){ await ref.delete(); delete SERVER[id]; }
    else { const full={card:nameOf(id),picks:p.picks||[],note:p.note||"",pair:p.pair||{},own:ownSet?p.own:null,hid:p.hid||[],pile:(BYID[id]||{}).p||"",
      done:p.done||[],sug:p.sug||[]};
      const ch=changedFields(full,SERVER[id]);
      if(ch){ ch.at=new Date().toISOString();
        try{ await ref.update(ch); }
        catch(e){ if(!(e&&e.code==="invalid_argument")) throw e; await ref.set(Object.assign(full,{at:ch.at})); }
        SERVER[id]=Object.assign({},SERVER[id]||{},full); } }
  }catch(e){ if(e&&e.code==="invalid_argument"){ canWrite=false; banner("You can view this board but not save picks on it."); } else if(e&&e.code==="quota_exceeded") banner("The board's storage is full, so this pick was not saved."); else banner("A pick could not be saved just now. Try again."); }
  const again=writing[id].again; delete writing[id]; if(again) persist(id); else flashSaved(id); }
function togglePick(id,v){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  snapshot(id, `${hasPick(id,v)?"un-":""}${PICKLAB[v]||v}: ${nameOf(id)}`);
  const p=picks[id]||(picks[id]={picks:[],note:""}); const s=new Set(p.picks||[]);
  const k=deckOfPick(v), kd=kindOf(v), cleared=[];
  if(s.has(v)) s.delete(v); else { s.add(v); if(k&&EXCL.includes(kd)) EXCL.filter(x=>x!==kd).forEach(x=>{ if(s.delete(x+k)) cleared.push(PICKLAB[x+k]); }); }
  if(s.has(v)&&(p.sug||[]).some(g=>g.v===v)) p.sug=p.sug.filter(g=>g.v!==v);   /* marking a suggested pick accepts it */
  p.picks=[...s]; persist(id);
  if(cleared.length&&!GESTURE) toast(`${PICKLAB[v]} — cleared ${cleared.join(" and ")} for ${nameOf(id)}.`); }
function dismissSug(id,v){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const p=picks[id]; if(!p) return; snapshot(id,`dismiss suggestion: ${nameOf(id)}`);
  p.sug=(p.sug||[]).filter(g=>g.v!==v); persist(id); refreshView(id); toast(`Dismissed: ${PICKLAB[v]||v} for ${nameOf(id)}.`); }
/* b / o: Bench or Keep out for the pile's decks the card is not in. All on → all off. */
function toggleScoped(id,kind){ const c=BYID[id]; if(!c) return; const ks=pileScope(c).filter(k=>!c["i"+k]);
  if(!ks.length){ toast(`${c.n} is already in ${pileScope(c).map(k=>DECKS[k].label).join(" and ")}.`); return; }
  const on=ks.every(k=>hasPick(id,kind+k));
  gesture(`${on?"un-":""}${kind==="bench"?"Bench":"Keep out"}: ${c.n}`, ()=>ks.forEach(k=>{ if(hasPick(id,kind+k)===on) togglePick(id,kind+k); })); }
function toggleHidden(id,role){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const p=picks[id]||(picks[id]={picks:[],note:""}), h=new Set(p.hid||[]); snapshot(id,`${h.has(role)?"un-":""}counts as ${role}: ${nameOf(id)}`);
  h.has(role)?h.delete(role):h.add(role); p.hid=[...h]; persist(id); }
function setOwn(id,val){ if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  const p=picks[id]||(picks[id]={picks:[],note:""}), n=val===""?null:Math.max(0,Math.min(99,parseInt(val,10)));
  if((p.own??null)===(Number.isNaN(n)?null:n)) return; snapshot(id,`own ×${n??"—"}: ${nameOf(id)}`); p.own=Number.isNaN(n)?null:n; persist(id); }
/* Pair a pile card (the selected one) with the deck card it replaces, from the Compare view. */
function pairWith(cutId){ const s=BYID[SEL], k=CMP.deck, cut=BYID[cutId]; if(!s||!cut||s["i"+k]){ toast("Select a pile card first."); return; }
  if(!canWrite){ banner("You can view this board but not save picks on it."); return; }
  snapshot(s.id,`${s.n} replaces ${cut.n}`); const p=picks[s.id]||(picks[s.id]={picks:[],note:""}), v=new Set(p.picks||[]);
  v.add("add"+k); v.delete("bench"+k); v.delete("out"+k); p.picks=[...v]; p.pair=Object.assign({},p.pair||{},{[k]:cut.n}); persist(s.id); render(); renderDecks(); toast(`${s.n} replaces ${cut.n} in ${DECKS[k].label}.`); }
function clearApplied(){ const ids=Object.keys(picks).filter(hasApplied); if(!ids.length) return;
  const at=new Date().toISOString().slice(0,19)+"Z";
  ids.forEach(id=>{ snapshot(id,`clear applied marks: ${nameOf(id)}`); const p=picks[id];
    p.done=(p.done||[]).concat((p.picks||[]).filter(v=>isApplied(id,v)).map(v=>({v,at}))); p.picks=(p.picks||[]).filter(v=>!isApplied(id,v)); persist(id); });
  render(); renderDecks(); toast(`Cleared applied marks on ${ids.length} card(s).`); }

/* ---------- events ---------- */
const colOf = el => { const w=el&&el.closest&&el.closest(".rw"); return w?(w.dataset.col||""):""; };
document.addEventListener("click",e=>{
