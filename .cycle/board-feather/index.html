<title>Feather — One Fell Swoop Brawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* First paint: a stored theme choice wins (shared with the dashboard's mtga-prefs), else the OS scheme. */
(function(){ try{ var p=JSON.parse(localStorage.getItem("mtga-prefs")||"{}")||{}; if(p.theme==="light"||p.theme==="dark") document.documentElement.setAttribute("data-theme",p.theme); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Builder page — generated by scripts/builder.py render from this template + builds/<slug>/build.json.
   PAGE = TEMPLATE + DATA: styling never touches card data. Layout: masthead and deck strip, sticky pile
   tabs, then a dense card list beside a collapsible sticky detail pane. Each deck's accent comes from its
   own main colour, so nothing here is tied to one deck or clan. */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --idW:#b39a3e; --idU:#2f6fb0; --idB:#4a4246; --idR:#b9472f; --idG:#2f7a45; --idC:#999b95;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74;
  --idW:#e4d38f; --idU:#6fa6dc; --idB:#a8a0a3; --idR:#e47f66; --idG:#6fbf82; --idC:#7d827f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;min-width:0}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch;flex:1 1 30ch}
.mast .homelink{margin-left:auto;color:var(--accent);font-size:.88rem;align-self:center}
.mast .homelink:not([hidden]) ~ .undobtn{margin-left:0}
.mast .undobtn{margin-left:auto}
.themebtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.themebtn:hover{color:var(--ink);border-color:var(--brass)}
.pip{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .2em;border-radius:999px;font:700 .72rem/1 var(--ui);color:var(--pip-ink);background:var(--pC);border:1px solid rgba(0,0,0,.22)}
.pip.in{min-width:1.2em;height:1.2em;font-size:.68em;vertical-align:-.15em;margin:0 .06em}
.pip.sym svg{width:.85em;height:.85em;display:block}

/* deck strip */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
details.deck{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--dc);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);min-width:0}
details.deck > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;align-items:center}
details.deck > summary::-webkit-details-marker{display:none}
.portrait{grid-row:1 / span 2;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--dc);box-shadow:0 0 0 3px var(--panel),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent);background:var(--raise)}
.portrait img{width:180%;max-width:none;margin:-34% 0 0 -40%;display:block}
details.deck h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.04em;color:var(--dc);overflow-wrap:anywhere;min-width:0}
.sumline{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.dmeta{font-size:.82rem;color:var(--muted);margin:8px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem}
.kv span{color:var(--muted)} .kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.chg{color:var(--accent)}
.protlist{font-size:.82rem;color:var(--muted);margin-top:6px} .protlist summary{cursor:pointer;color:var(--accent);width:max-content}
.protlist p{margin:4px 0 0}
/* one deck: the panel carries the live curve beside the figures */
.onegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,440px);gap:8px 18px;align-items:start}
.onestat > .status{margin:6px 0 0}
.onegrid .curve .bars{height:60px;margin-top:6px}
.onegrid .curve figcaption{font-size:.74rem}
@media (max-width:760px){ .onegrid{grid-template-columns:minmax(0,1fr)} }

.banner{border:1px solid var(--warn);color:var(--warn);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:.88rem}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding-top:4px}
.tab{position:relative;background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab .n{font-family:var(--mono);font-size:.76rem;margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc)}
.tab.pile::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--tc) var(--pct,0%),color-mix(in srgb,var(--tc) 18%,transparent) var(--pct,0%))}
.intro{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:90ch;font-size:.95rem}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.toolbar label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.toolbar input[type=search]{width:min(260px,100%)}
.toolbar label.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--ink);padding-bottom:5px}
.count{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-bottom:6px}
.panebtn{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--muted);font-size:.84rem;margin-bottom:3px}
.panebtn:hover{color:var(--ink);border-color:var(--accent)}
.filtbtn{display:none;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer;width:max-content}
@media (max-width:1000px){ .panebtn{display:none} }
@media (max-width:760px){ .filtbtn{display:inline-block} .toolbar:not(.open) > label:not(:first-child){display:none} .toolbar > label:first-child{flex:1 1 100%} .toolbar input[type=search]{width:100%} .toolbar:not(.open) > label.keep{display:flex} }

/* console */
.console{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.console.full,.console.nopane{grid-template-columns:minmax(0,1fr)}
.console.nopane > .detail{display:none}
@media (min-width:1001px){ .console.nopane > .rows{max-width:940px} }
@media (max-width:1000px){ .console{grid-template-columns:minmax(0,1fr)} .console > .detail{display:none} }
.rows{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.rw{border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:none}
.row{display:grid;grid-template-columns:5px 34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px 6px 0;cursor:pointer}
.row:hover{background:var(--raise)}
.row.sel{background:var(--sel)}
.row .stripe{align-self:stretch;background:var(--stripe)}
.row .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.row .main{all:unset;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.row .main:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cost{display:inline-flex;gap:2px;flex:none}
.row .l2{display:flex;gap:6px;align-items:baseline;min-width:0;font-size:.84rem;color:var(--muted)}
.row .why1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seal{font:600 .64rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);border-radius:2px;padding:3px 5px;flex:none}
.tag{font-size:.7rem;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tag.in{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.tag.prot{color:var(--dc);border-color:var(--dc);font-weight:600}
/* quick picks: deck toggles on the top row; Bench and Keep out (per deck, scoped to the pile) underneath */
.q{display:grid;grid-template-columns:repeat(var(--qn,2),minmax(30px,auto));gap:3px}
.qb{display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 6px;min-height:22px;font:500 .74rem/1.3 var(--mono);cursor:pointer;color:var(--muted)}
.qb svg{width:12px;height:12px;display:block}
.qb .qi{display:inline-flex;align-items:center;gap:2px}
/* one deck: Add (or Cut) on top, Bench and Keep out in words underneath; icons only on a phone */
.q.one{grid-template-columns:repeat(2,auto)}
.q.one > .qb:first-child{grid-column:1/-1}
.qb .qw{font-family:var(--ui)}
@media (max-width:520px){ .qb .qw{display:none} }
/* more than three decks: Bench / Keep out live in a per-row menu so the row keeps its width */
.qmore{grid-column:1/-1;position:relative}
.qmore summary{list-style:none}
.qmore summary::-webkit-details-marker{display:none}
.qmenu{position:absolute;right:0;top:calc(100% + 3px);z-index:6;display:grid;grid-template-columns:repeat(2,auto);gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.qb:hover{border-color:var(--qc);color:var(--ink)}
.qb[aria-pressed="true"]{background:var(--qc);border-color:var(--qc);color:var(--panel)}
.noteDot{font-size:.8rem;color:var(--accent)}
.tag.own{font-family:var(--mono)}
.tag.sus{border-style:dotted;color:var(--warn);border-color:var(--warn)}
.tag.hid{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.tag.vd{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 55%,transparent);font-family:var(--mono)}
.tag.vd.pre,.dpv.pre{border-style:dotted}
.tag.vd.stale,.dpv.stale{border-style:dashed}
.dpv{flex:0 0 auto;font:600 .8rem/1.2 var(--mono);color:var(--dc);border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);border-radius:3px;padding:1px 6px;min-width:2.6em;text-align:center}
.vlegend{font-size:.78rem;color:var(--muted);margin:2px 0 8px}
.tag.done{color:var(--accent);border-color:var(--accent);font-weight:600}
.rw.applied .row{opacity:.62}
.row .rank{font:500 .72rem/1 var(--mono);color:var(--muted);min-width:2.2em;text-align:right;flex:none}
.rw.paired .row{box-shadow:inset 3px 0 0 var(--dc,var(--accent));background:color-mix(in srgb,var(--dc,var(--accent)) 10%,var(--panel))}
.pairbtn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.pairbtn:hover:not(:disabled){border-color:var(--dc,var(--accent));color:var(--ink)}
.pairbtn:disabled{opacity:.4;cursor:default}
.conf{border:1px solid var(--warn);border-radius:6px;padding:8px 12px;background:var(--panel);font-size:.86rem;color:var(--ink)}
.conf b{color:var(--warn)} .conf ul{margin:4px 0 0;padding-left:18px}
.ownrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;flex-basis:100%}
.bulk #bulkask{display:inline-flex;gap:6px;align-items:center;font-size:.86rem}
.ownrow input{width:4.5em;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:var(--ink)}
.undobtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem;white-space:nowrap}
.undobtn:disabled{opacity:.45;cursor:default}
.undobtn:hover:not(:disabled){color:var(--ink);border-color:var(--brass)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 16px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.arenacopy{margin:.5rem 0 .25rem}
.arenatxt{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.4rem}
/* alternate Arena printings (view-only) */
details.arts summary{cursor:pointer;color:var(--accent);width:max-content;font-size:.86rem}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:6px}
.artbtn{all:unset;cursor:zoom-in;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);line-height:1.3}
.artbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.artbtn img,.artbtn .artspr{width:122px;height:89px;border-radius:4px;display:block;object-fit:cover;background-repeat:no-repeat;background-color:var(--raise)}
.artbtn b{color:var(--ink);font-weight:600}
dialog#artzoom{border:none;padding:0;background:transparent;max-width:min(94vw,560px)}
dialog#artzoom::backdrop{background:rgba(0,0,0,.72)}
#artbig{width:min(90vw,366px);aspect-ratio:366/267;border-radius:10px;background-repeat:no-repeat;margin:0 auto}
/* compare view */
.cmphead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:10px}
.cmphead label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmphead select,.cmphead input{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:var(--panel);border:none;padding:5px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--ink);font-weight:600}
.cmpcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.cmpcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.cmpcol h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em;color:var(--dc,var(--ink))}
.cmpcol .rows{max-height:calc(100vh - 230px);overflow:auto}
/* one deck: verdict sections in the candidate column, the header pinned while its cards scroll */
.vsec{position:sticky;top:0;z-index:2;background:var(--raise);border-bottom:1px solid var(--line)}
.vsechd{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;cursor:pointer;font:600 .8rem/1.3 var(--ui);letter-spacing:.04em;color:var(--ink)}
.vsechd .n{margin-left:auto;font:500 .74rem/1 var(--mono);color:var(--muted)}
.vsechd .caret{width:1em;color:var(--muted)}
.vsechd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:1000px){ .seg{display:inline-flex} .cmpcols{grid-template-columns:minmax(0,1fr)} .cmpcols[data-side="L"] .cmpcol[data-side="R"],.cmpcols[data-side="R"] .cmpcol[data-side="L"]{display:none} .cmpcol .rows{max-height:none} }
/* mana curve, now vs after */
.curve{background:var(--raise);border-left:2px solid var(--dc);border-radius:4px;padding:8px 10px}
.curve h4{margin:0 0 6px;font-size:.9rem}
.curve .bars{margin-top:14px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:92px;border-bottom:1px solid var(--line)}
.curve .grp{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%;position:relative}
.curve .b{width:min(14px,40%);border-radius:4px 4px 0 0;min-height:1px}
.curve .b.now{background:color-mix(in srgb,var(--muted) 45%,transparent)}
.curve .b.aft{background:var(--dc)}
.curve .v{position:absolute;font:500 .68rem/1 var(--mono);color:var(--ink)}
.curve .ax{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font:500 .7rem/1.6 var(--mono);color:var(--muted);text-align:center}
.curve .leg{display:flex;gap:12px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.curve .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:var(--read);font-style:italic}
/* inline comment row (same note as the pane) */
.inote{display:flex;gap:8px;align-items:flex-start;padding:4px 10px 8px 49px;background:var(--sel)}
.inote textarea{flex:1;min-height:2.4em}
.inote .saved{align-self:center}

/* hover preview while the pane is collapsed */
#peek{position:fixed;z-index:30;width:280px;pointer-events:none;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);background:var(--raise)}
#peek img{width:100%;display:block;border-radius:12px}

/* detail */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--brass) 70%,transparent);border-radius:6px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.dimg{display:flex;align-items:center;gap:6px;justify-content:center}
.dimg button.big{all:unset;cursor:zoom-in;display:block;max-width:320px;width:100%}
.dimg button.big:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.flipline{display:flex;justify-content:center;margin:6px 0 0}
.dimg img{width:100%;border-radius:12px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.step{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none;font-size:1.1rem;line-height:1}
.dname{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtype{margin:-6px 0 0;color:var(--muted);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.reason{font-family:var(--read);font-size:.98rem;line-height:1.55;margin:0}
.reason .seal{display:inline-block;margin-right:6px;vertical-align:2px}
.reason code{font-family:var(--mono);font-size:.82em;background:var(--raise);border-radius:3px;padding:0 3px}
.reason.pending{color:var(--muted);font-style:italic}
.rules{font-size:.86rem}
.rules summary{cursor:pointer;color:var(--accent);width:max-content}
.rules p{white-space:pre-wrap;margin:6px 0 0;font-family:var(--read)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks.dp{align-items:center;margin-bottom:6px}
.picks .dpl{flex:0 0 5.5em;font:600 .78rem/1.2 var(--ui);color:var(--dc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.pb:hover{border-color:var(--qc,var(--accent))}
.pb[aria-pressed="true"]{background:color-mix(in srgb,var(--qc,var(--accent)) 16%,var(--panel));border-color:var(--qc,var(--accent));font-weight:600}
.field-l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cutq,textarea.note,.addform textarea,.addform input,.addform select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.88rem;color:var(--ink)}
textarea.note{resize:vertical;min-height:3.2em;font-family:var(--read)}
.ghost{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;cursor:pointer;width:max-content;font-size:.84rem}
.saved{font-size:.78rem;color:var(--accent);min-height:1em}
.kbd{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.kbd span{border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:2px}

/* sheet (phone detail) */
dialog#sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:14px 14px 0 0;background:var(--panel);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(0,0,0,.5)}
dialog#sheet .detail{position:static;max-height:none;border:none;box-shadow:none;border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheetbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}

/* full-width views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.dlist{border-top:2px solid var(--dc)}
.qb[data-sug],.pb[data-sug]{outline:2px dashed var(--qc);outline-offset:-4px}
.tag.sug{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.sugbox{border:1px dashed var(--accent);border-radius:8px;padding:6px 10px;margin:8px 0}
.sugbox p{margin:4px 0}
.reply{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 6px 6px 0}
.hist{font-size:.8rem}
.histlist{margin:10px 0}.histlist summary{cursor:pointer;font-weight:600}
.histlist li.bad{color:var(--bad)}
.dlist h3{color:var(--dc)}
.tablewrap{overflow-x:auto}
.dlist table,.proj table{width:100%;border-collapse:collapse;font-size:.86rem}
.dlist th,.dlist td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dlist thead th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dlist td:first-child{font-family:var(--mono);color:var(--muted)}
.dlist td.dcard{display:flex;align-items:center;gap:8px}
.dlist .th{flex:0 0 34px;width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise);display:block}
.dlist .th img{width:100%;height:100%;object-fit:cover;display:block}
.dlist .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.dlist tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--raise) 70%,transparent)}
.dlist tr.cutrow td{background:var(--sel)}
.dlist tr.protsep th{color:var(--dc);font-family:var(--display);font-weight:400;padding-top:12px;border-bottom:1px solid var(--dc)}
.dlist td.marks{white-space:nowrap}
.linkish{all:unset;cursor:zoom-in;border-bottom:1px dotted var(--muted)}
/* choosing cuts */
.tag.need{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.cutpick{margin:8px 0 10px;padding:8px;border:1px solid color-mix(in srgb,var(--dc) 35%,var(--line));border-radius:6px}
.cuthead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cutcur{display:flex;gap:6px;align-items:center;font-size:.86rem}
.cutcur .th,.cutopt .th{width:34px;height:47px;border-radius:3px;overflow:hidden;background:var(--raise);display:block}
.cutcur .th img,.cutopt .th img{width:100%;height:100%;object-fit:cover;display:block}
.cutcur .th .spr,.cutopt .th .spr{display:block;width:34px;height:47px;background-repeat:no-repeat}
.cutpanel{margin-top:8px}
/* a FIXED height: a preview that grew with each card moved the list under the pointer, so hovering jittered */
.cutprev{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0;height:190px;overflow:auto;font-size:.82rem}
.cutprev img{width:120px;border-radius:6px;display:block}
.cutprev .cpn{margin:0}
.cutprev .cpx{margin:4px 0;font-size:.8rem;line-height:1.35}
.cutlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.cutopt{display:grid;grid-template-columns:34px 2.4em 1fr auto;gap:6px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:4px 6px;cursor:pointer;color:var(--ink);font:inherit;font-size:.84rem}
.cutopt:hover,.cutopt:focus-visible{background:color-mix(in srgb,var(--dc) 10%,var(--panel))}
.cutopt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cutopt[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--dc);background:color-mix(in srgb,var(--dc) 14%,var(--panel))}
.cutopt .rk{font:500 .72rem/1 var(--mono);color:var(--muted);text-align:right}
.cutsep{margin:0;padding:4px 6px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--raise)}
.inspect{margin-top:14px;padding-top:10px;border-top:2px solid var(--dc)}
.inspect .ihead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inspect .ibody{display:grid;grid-template-columns:140px 1fr;gap:10px;margin-top:6px}
.inspect .ibody img{width:140px;border-radius:7px;display:block}
.pkg{margin:0 0 8px;font-size:.86rem}
.pkg summary{cursor:pointer}
.pkg ul{margin:4px 0 0;padding-left:1.1em}
.pkg li{margin:3px 0}
.need-t{color:var(--warn)}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 7px;font-size:.76rem;cursor:pointer;margin:0 2px 2px 0}
.mini[aria-pressed="true"]{background:color-mix(in srgb,var(--dc) 18%,var(--panel));border-color:var(--dc);font-weight:600}
.proj{border-left:2px solid var(--dc);background:var(--raise);border-radius:4px;padding:8px 10px;margin:0 0 10px}
.proj h4{margin:0 0 4px;font-size:.9rem}
.proj th[scope=row]{text-align:left;font-weight:500;padding:2px 10px 2px 0}
.proj td{font-family:var(--mono);padding:2px 10px 2px 0}
.warnline{color:var(--warn);font-size:.85rem;margin:6px 0 0}
.status{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--panel);border:none;border-radius:5px;padding:7px 14px;cursor:pointer;font-weight:600}
.plist h3{font-size:1rem;margin-top:12px} .plist ul{margin:0;padding-left:18px} .plist li{margin:3px 0}

.reqs{padding-left:18px;margin:6px 0 10px} .reqs li{margin-bottom:6px}

.cmpside img{width:100%;max-width:260px;border-radius:10px;display:block}
.cmplab{font:600 .7rem/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.cmpside .rules p{font-size:.86rem}
@media (prefers-reduced-motion:no-preference){ .row{transition:background-color .12s} .pb,.qb{transition:background-color .12s,border-color .12s} }

const SLUG = META.slug || "build";
const slug = n => String(n||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,180) || "card";
CARDS.forEach(c => c.id = slug(c.n));
const BYID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const esc = s => String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const fmt = s => sym(esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"));
const plain = s => String(s||"").replace(/\*\*|`/g,"");

/* Images: the artifact target ships files (img/ small, img/lg/ large); the Pages target hot-links Scryfall. */
/* A two-faced card (transform / modal DFC) carries its BACK face too: `im2` on Pages,
   `b2` when img/lg/<id>--back.jpg was shipped. FLIP holds the cards turned over; the pane
   and the zoom view read it, every thumbnail stays on the front. */
const FLIP = new Set();
const hasBack = c => !!(c && (META.img==="remote" ? c.im2 : c.b2));
const showBack = c => hasBack(c) && FLIP.has(c.id);
function imgSrc(c, size, back){ if(!c) return "";
  if(META.img==="remote"){ const u=(back&&c.im2)||c.im||""; return size==="l"?u.replace("/normal/","/large/"):u; }
  return "img/lg/"+c.id+(back&&c.b2?"--back":"")+".jpg"; }
const fallbackOf = (c, back) => META.img==="remote" ? ((back&&c.im2)||c.im||"") : "";

/* Turn one card over everywhere it is showing large, without re-rendering anything. */
function flipCard(id){ const c=BYID[id]; if(!hasBack(c)) return;
  if(FLIP.has(id)) FLIP.delete(id); else FLIP.add(id); const b=showBack(c);
  document.querySelectorAll(`img[data-face="${id}"]`).forEach(im=>{ im.dataset.fb=fallbackOf(c,b); im.src=imgSrc(c,"l",b); im.alt=c.n+(b?" (back face)":""); });
  document.querySelectorAll(`[data-flip="${id}"]`).forEach(x=>{ x.setAttribute("aria-pressed",String(b)); x.textContent="⟲ "+(b?"Show front face":"Show back face"); });

/* Row thumbnails: one sprite sheet on the artifact (a version holds at most 511 files), an <img> otherwise. */
function thumb(c){ const S=META.sprite, i=S&&S.i?S.i[c.id]:undefined;
  if(i===undefined) return `<img src="${esc(imgSrc(c,"s"))}" alt="" loading="lazy" width="34" height="47">`;
  return `<span class="spr" style="background-image:url(${S.src});background-size:${S.cols*34}px ${S.rows*47}px;background-position:-${(i%S.cols)*34}px -${Math.floor(i/S.cols)*47}px"></span>`; }

/* Decks: label from build.json (else the commander's first name), accent from the deck's most-produced colour. */
function mainColour(src){ let best="C",n=-1; (src||"").split("·").forEach(t=>{ const m=t.trim().match(/^([WUBRG])(\d+)/); if(m && +m[2]>n){ n=+m[2]; best=m[1]; } }); return best; }
/* A deck's colours, most-produced first ("U24 · B20 · G15" → U, B, G). */
function colourRank(src){ return (src||"").split("·").map(t=>t.trim().match(/^([WUBRG])(\d+)/)).filter(Boolean).sort((a,b)=>+b[2]-+a[2]||"WUBRG".indexOf(a[1])-"WUBRG".indexOf(b[1])).map(m=>m[1]); }
/* One accent per deck, in build order: each takes its most-produced colour no earlier deck took,
   so two decks of one colour identity do not share an accent; when every colour is taken, its own top. */
function assignColours(srcs){ const used=new Set();
  return srcs.map(src=>{ const r=colourRank(src), c=r.find(x=>!used.has(x))||r[0]||"C"; used.add(c); return c; }); }

/* FULLLAB names the deck and is what Copy as text writes; PICKLAB is what the page shows,

const PICKORDER = [...DK.flatMap(k=>["add"+k,"cut"+k,"bench"+k,"out"+k]), ...DK.flatMap(k=>["prot"+k,"unprot"+k])];

function snapshot(id,label){ const before=picks[id]?JSON.parse(JSON.stringify(picks[id])):null;

  pushUndo({label,items:[{id,before}]}); }
function gesture(label, fn){ GESTURE={label,items:[]}; try{ fn(); } finally { const g=GESTURE; GESTURE=null; if(g.items.length) pushUndo(g); } }

/* The board's copy of each record as last read. A save sends only the fields the owner changed

  PFIELDS.forEach(k=>{ if(JSON.stringify(full[k]===undefined?null:full[k])!==JSON.stringify(srv[k]===undefined?null:srv[k])) ch[k]=full[k]; });

    const focusedNote=document.activeElement&&document.activeElement.classList.contains("note");
    picks=next; holdScroll(["window"], ()=>{ if(!focusedNote){ render(); } else { updateTabCounts(); } renderDecks(); });
    if(migrate.length){ try{ localStorage.removeItem(LS); }catch(e){} migrate.forEach(persist); }
    if(upg.length&&canWrite) upg.forEach(persist);
  },err=>{ clearTimeout(timer); banner("Saved picks could not be loaded. Reload the page to try again."); });
  db.collection("requests").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(Array.isArray(x.names)) next[d.id]={names:x.names.filter(n=>typeof n==="string").slice(0,300),dest:String(x.dest||""),note:typeof x.note==="string"?x.note:"",at:String(x.at||""),status:String(x.status||"pending"),reply:typeof x.reply==="string"?x.reply:""}; });
    requests=next; updateTabCounts(); if(view==="add") holdScroll(["window"], render); },()=>{});
  db.collection("log").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{};
      if(Array.isArray(x.lines)) next[d.id]={at:String(x.at||""),lines:x.lines.filter(l=>typeof l==="string").slice(0,300),failed:Array.isArray(x.failed)?x.failed.filter(l=>typeof l==="string"):[]}; });
    LOGS=next; if(view==="picks") holdScroll(["window"], render); },()=>{});
  db.collection("reasons").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data()||{}; if(BYID[d.id]&&typeof x.text==="string") next[d.id]={group:typeof x.group==="string"?x.group:"",text:x.text}; });
    reasons=next; if(isPileView(view)) holdScroll(["window"], render); },()=>{});
})();
