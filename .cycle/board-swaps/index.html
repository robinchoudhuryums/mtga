<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Swap board — generated by `scripts/builder.py swaps` from this template + builds/<slug>/swaps.json.
   The Builder's tokens and type, cut down to one job: each candidate beside the deck card it would
   replace, read at the same time. Layout: masthead, a sticky filter bar, then one section per deck
   holding a column of side-by-side pairs (stacked on a phone). */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b; --good:#2f7a45;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74; --good:#6fbf82;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74; --good:#6fbf82;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;text-wrap:balance}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch;flex:1 1 30ch}
.themebtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem}

.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.tally b{color:var(--ink);font-variant-numeric:tabular-nums}
.store{font-size:.82rem;color:var(--muted)}
.store.warn{color:var(--warn)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line)}
.bar label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bar select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.copybtn{margin-left:auto;background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
.copybox{width:100%;min-height:7em;font-family:var(--mono);font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}

section.deck{display:flex;flex-direction:column;gap:12px}
section.deck h2{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.04em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
section.deck h2 small{font-family:var(--ui);font-size:.85rem;color:var(--muted);letter-spacing:0}

.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.pair[data-pick="swap"]{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.pair[data-pick="keep"]{opacity:.72}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start}
.side{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;min-width:0}
.zoom{all:unset;cursor:zoom-in;display:block;width:150px;border-radius:8px}
.zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.side img{width:150px;aspect-ratio:488/680;border-radius:8px;display:block;background:var(--raise);object-fit:cover}
#zoom{border:0;padding:0;background:none;max-width:96vw;max-height:96vh;overflow:visible;cursor:zoom-out}
#zoom::backdrop{background:rgba(0,0,0,.78)}
#zoom img{display:block;max-width:min(96vw,672px);max-height:92vh;width:auto;height:auto;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#zoom .zclose{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.1rem;cursor:pointer;line-height:1}
#zoom .zclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side .noimg{width:150px;aspect-ratio:488/680;border-radius:8px;background:var(--raise);border:1px dashed var(--line)}
.role{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 2px}
.role.in{color:var(--good)}
.cn{margin:0;font-family:var(--read);font-weight:600;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.tl{margin:2px 0 6px;font-size:.84rem;color:var(--muted)}
.ot{margin:0;font-family:var(--read);font-size:.9rem;white-space:pre-line;overflow-wrap:anywhere}
.own{display:inline-block;margin-top:8px;font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.own.no{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.arrow{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;padding-top:40px}
.arrow .arw{font-size:1.4rem;line-height:1}
.vd{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.vd.upgrade{color:var(--good)} .vd.sidegrade{color:var(--accent)} .vd.spice{color:var(--brass)}

.why{margin:0;font-family:var(--read);font-size:.95rem}
.why em{color:var(--muted)}
.unconf{font-size:.82rem;color:var(--warn)}
.act{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.act .seg button{padding:5px 13px}
.act .seg button[data-v="swap"][aria-pressed="true"]{background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.note{flex:1 1 220px;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.empty{color:var(--muted);font-style:italic;font-family:var(--read)}
.cutrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem}
.cutrow label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cutrow select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%;min-width:0;color:var(--ink)}
.delta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:0;font-size:.82rem;color:var(--muted)}
.delta .dk{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.delta span.d{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.delta span.up{border-color:color-mix(in srgb,var(--good) 55%,var(--line));color:var(--good)}
.delta span.down{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.reply{margin:0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--raise);border-radius:0 6px 6px 0;font-family:var(--read);font-size:.92rem;white-space:pre-line}
.reply b{font-family:var(--ui);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-right:6px}
.pair.folded{padding:0}
.fold{all:unset;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;width:100%;padding:10px 14px;cursor:pointer;border-radius:8px}
.fold:focus-visible,.foldbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold .fk{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pair[data-pick="swap"] .fold .fk{color:var(--good)}
.fold .fn{font-family:var(--read);min-width:0;overflow-wrap:anywhere}
.fold .fm{font-size:.8rem;color:var(--muted)}
.fold .fo{margin-left:auto;font-size:.8rem;color:var(--accent)}
.foldbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:.84rem}

.pip{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;padding:0 .2em;border-radius:999px;font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--pip-ink);background:var(--pC);vertical-align:.1em;margin-right:1px}
.pip.W{background:var(--pW)} .pip.U{background:var(--pU)} .pip.B{background:var(--pB)} .pip.R{background:var(--pR)} .pip.G{background:var(--pG)}

@media (max-width:820px){
  .duel{grid-template-columns:minmax(0,1fr)}
  .arrow{flex-direction:row;padding-top:0;justify-content:flex-start}
  .arrow .arw{transform:rotate(90deg)}
}
@media (max-width:460px){
  .side{grid-template-columns:96px minmax(0,1fr)}
  .side img,.side .noimg,.zoom{width:96px}
  #zoom .zclose{top:4px;right:4px}
}
@media (prefers-reduced-motion:no-preference){ .pair{transition:border-color .15s, opacity .15s} }
</style>

<div class="wrap">
  <header class="mast">
    <h1 id="title"></h1>

</div>

  <img id="zimg" alt="">
</dialog>

ocked door to unlock it.) // Once each turn, you may pay {0} rather than pay the mana cost for a spell you cast from exile.\n(You may cast either half. That door unlocks on the battlefield. As a sorcery, you may pay the mana cost of a locked door to unlock it.)", "own": 1, "id": "charred-foyer", "img": "img/lg/charred-foyer.jpg"}, "Bilbo, Thief in the Night": {"n": "Bilbo, Thief in the Night", "c": "{1}{U}", "t": "Legendary Creature — Halfling Rogue", "o": "Spells you cast from anywhere other than your hand cost {1} less to cast.\nWhenever Bilbo attacks, you may cast an artifact, instant, or sorcery spell from your graveyard. If an instant or sorcery spell cast this way would be put into your graveyard, exile it instead.", "own": 1, "id": "bilbo-thief-in-the-night", "img": "img/lg/bilbo-thief-in-the-night.jpg"}, "Spider-Sense": {"n": "Spider-Sense", "c": "{1}{U}", "t": "Instant", "o": "Web-slinging {U} (You may cast this spell for {U} if you also return a tapped creature you control to its owner's hand.)\nCounter target instant spell, sorcery spell, or triggered ability.", "own": 1, "id": "spider-sense", "img": "img/lg/spider-sense.jpg"}, "Fiery Inscription": {"n": "Fiery Inscription", "c": "{2}{R}", "t": "Enchantment", "o": "When this enchantment enters, the Ring tempts you.\nWhenever you cast an instant or sorcery spell, this enchantment deals 2 damage to each opponent.", "own": 1, "id": "fiery-inscription", "img": "img/lg/fiery-inscription.jpg"}, "Bouncer's Beatdown": {"n": "Bouncer's Beatdown", "c": "{2}{G}", "t": "Instant", "o": "This spell costs {2} less to cast if it targets a black permanent.\nBouncer's Beatdown deals X damage to target creature or planeswalker, where X is the greatest power among creatures you control. If that creature or planeswalker would die this turn, exile it instead.", "own": 1, "id": "bouncer-s-beatdown", "img": "img/lg/bouncer-s-beatdown.jpg"}, "Hulk's Thunderclap": {"n": "Hulk's Thunderclap", "c": "{1}{G}", "t": "Sorcery", "o": "As <script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const CARDS = DATA.cards, DECKS = DATA.decks, SWAPS = DATA.swaps;
const PICKS = {};            // id -> {pick, note}
let db = null, local = false;
const F = {deck: "", vd: "", pk: ""};

const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function pips(cost){
  return esc(cost || "").replace(/\{([^}]+)\}/g, (m, t) => {
    const k = t.toUpperCase(), cls = /^[WUBRG]$/.test(k) ? k : (/^[WUBRG]\/[WUBRGP]$/.test(k) ? k[0] : "");
    return `<span class="pip ${cls}" title="{${esc(t)}}">${esc(t.length <= 2 ? t : t[0])}</span>`;
  }).replace(/ \/\/ /g, " // ");
}
const VLAB = {upgrade: "Upgrade", sidegrade: "Sidegrade", spice: "Spice"};

const SWAP_BY = Object.fromEntries(SWAPS.map(s => [s.id, s]));
const OPEN = new Set();      // decided pairs the owner reopened this visit
const DLAB = {interaction: "Interaction", card_advantage: "Card advantage", protection: "Protection",
  avg_mv: "Avg MV", board_power: "Board power", early_drops: "Early drops", central_themes: "Themes"};
const LOWER_IS_BETTER = {avg_mv: true};
const BANDS = "SABCD";

/* The cut this pair would make: the owner's choice when it is one of the offered cards, else the suggested one. */
function cutOf(s){
  const c = (PICKS[s.id] || {}).cut;
  return c && (c === s.cut || (s.alts || []).includes(c)) ? c : s.cut;
}
const folded = s => { const p = (PICKS[s.id] || {}).pick; return (p === "swap" || p === "keep") && !OPEN.has(s.id); };

function side(name, role){
  const c = CARDS[name] || {n: name};
  const own = c.own > 0 ? `<span class="own">Owned ×${c.own}</span>` : `<span class="own no">Not owned${role === "out" ? " — one less craft if replaced" : ""}</span>`;
  const img = c.img ? `<button type="button" class="zoom" data-zoom="${esc(c.img)}" data-name="${esc(c.n)}" aria-label="Show ${esc(c.n)} full size"><img src="${esc(c.img)}" alt="" loading="lazy"></button>` : `<div class="noimg" aria-hidden="true"></div>`;
  return `<div class="side">${img}<div>
    <p class="role ${role}">${role === "in" ? "Swap in" : "Currently in the deck"}</p>
    <p class="cn">${esc(c.n)} ${pips(c.c)}</p>
    <p class="tl">${esc(c.t || "")}</p>
    <p class="ot">${esc(c.o || "")}</p>${own}</div></div>`;
}

function deltaHTML(d){
  if (!d) return "";
  const [fb, fa] = d.floor;
  const fc = fb === fa ? "" : (BANDS.indexOf(fa) < BANDS.indexOf(fb) ? " up" : " down");
  const chips = [`<span class="d${fc}">Tier floor ${esc(fb)}${fb === fa ? "" : " → " + esc(fa)}</span>`];
  Object.keys(DLAB).forEach(k => {
    if (!d[k]) return;
    const [b, a] = d[k], better = LOWER_IS_BETTER[k] ? a < b : a > b;
    const cls = k === "avg_mv" ? "" : (better ? " up" : " down");
    chips.push(`<span class="d${cls}">${DLAB[k]} ${esc(b)} → ${esc(a)}</span>`);
  });
  if (chips.length === 1) chips.push(`<span>no other measured change</span>`);
  return `<p class="delta"><span class="dk">If swapped</span>${chips.join("")}</p>`;
}

function pairHTML(s){
  const p = PICKS[s.id] || {}, cut = cutOf(s), chosen = cut !== s.cut;
  const note = p.note ? " · your note" : "", reply = p.reply ? " · Claude replied" : "";
  if (folded(s)) {
    return `<article class="pair folded" id="p-${s.id}" data-pick="${esc(p.pick)}">
      <button type="button" class="fold" data-unfold="${s.id}" aria-expanded="false">
        <span class="fk">${p.pick === "swap" ? "✓ Swap" : "Kept"}</span>
        <span class="fn">${p.pick === "swap" ? `${esc(s.add)} for ${esc(cut)}` : `${esc(cut)} stays; ${esc(s.add)} not added`}</span>
        <span class="fm">${VLAB[s.verdict]}${note}${reply}</span><span class="fo">Reopen</span></button>
    </article>`;
  }
  const btn = (v, label) => `<button type="button" data-id="${s.id}" data-v="${v}" aria-pressed="${p.pick === v}">${label}</button>`;
  const opts = [`<option value="${esc(s.cut)}"${chosen ? "" : " selected"}>${esc(s.cut)} (suggested)</option>`]
    .concat((s.alts || []).length ? [`<optgroup label="Weakest fit in this deck">` + s.alts.map(a =>
      `<option value="${esc(a)}"${a === cut ? " selected" : ""}>${esc(a)}${(CARDS[a] || {}).own > 0 ? "" : " (not owned)"}</option>`).join("") + `</optgroup>`] : []);
  const decided = p.pick === "swap" || p.pick === "keep";
  return `<article class="pair" id="p-${s.id}" data-pick="${esc(p.pick || "")}">
    <div class="duel">${side(s.add, "in")}<div class="arrow"><span class="arw" aria-hidden="true">→</span><span class="vd ${s.verdict}">${VLAB[s.verdict]}</span></div>${side(cut, "out")}</div>
    <div class="cutrow"><label for="c-${s.id}">Card to cut</label><select id="c-${s.id}" data-cut="${s.id}">${opts.join("")}</select></div>
    ${deltaHTML((s.delta || {})[cut])}
    <p class="why">${esc(s.why)}${!chosen && s.cut_note ? ` <em>Replaces it because: ${esc(s.cut_note)}.</em>` : ""}${chosen ? ` <em>You picked a different cut; the reason above was written for ${esc(s.cut)}.</em>` : ""}</p>
    ${s.confirmed || chosen ? "" : `<p class="unconf">The suggested cut is the fit tool's weakest-fit guess for this deck, not a checked pairing. Use “Card to cut” if another card should go.</p>`}
    <div class="act"><span class="seg" role="group" aria-label="Decision for ${esc(s.add)}">${btn("swap", "Swap")}${btn("maybe", "Maybe")}${btn("keep", "Keep current")}</span>
      <input class="note" id="n-${s.id}" data-id="${s.id}" placeholder="Note for Claude (optional)" value="${esc(p.note || "")}" aria-label="Note on ${esc(s.add)}">
      ${decided ? `<button type="button" class="foldbtn" data-fold="${s.id}">Fold</button>` : ""}</div>
    ${p.reply ? `<p class="reply"><b>Claude</b>${esc(p.reply)}</p>` : ""}
  </article>`;
}

/* Redraw one pair in place, then put focus on `sel` inside it (if given). */
function redraw(id, sel){
  const art = document.getElementById("p-" + id); if (!art) return;
  art.outerHTML = pairHTML(SWAP_BY[id]);
  if (sel) { const el = document.getElementById("p-" + id).querySelector(sel); if (el) el.focus(); }
}

function visible(s){
  const p = (PICKS[s.id] || {}).pick || "";
  if (F.deck && s.deck !== F.deck) return false;
  if (F.vd && s.verdict !== F.vd) return false;
  if (F.pk === "open" && p) return false;
  if (F.pk === "swap" && p !== "swap") return false;
  return true;
}

function render(){
  const byDeck = {};
  SWAPS.filter(visible).forEach(s => (byDeck[s.deck] ||= []).push(s));
  const ids = Object.keys(DECKS).filter(d => byDeck[d]);
  document.getElementById("list").innerHTML = ids.length ? ids.map(d => `<section class="deck" aria-labelledby="h-${esc(d)}">
      <h2 id="h-${esc(d)}">${esc(DECKS[d].name)} <small>deck ${esc(d)} · ${byDeck[d].length} swap${byDeck[d].length > 1 ? "s" : ""}</small></h2>
      ${byDeck[d].map(pairHTML).join("")}</section>`).join("")
    : `<p class="empty">No swaps match these filters.</p>`;
  tally();
}

function tally(){
  const n = k => SWAPS.filter(s => (PICKS[s.id] || {}).pick === k).length;
  const open = SWAPS.length - n("swap") - n("maybe") - n("keep");
  const crafts = SWAPS.filter(s => (PICKS[s.id] || {}).pick === "swap" && !((CARDS[cutOf(s)] || {}).own > 0)).length;
  document.getElementById("tally").innerHTML =
    `<span><b>${SWAPS.length}</b> swaps in <b>${Object.keys(DECKS).length}</b> decks</span><span><b>${n("swap")}</b> to swap</span><span><b>${n("maybe")}</b> maybe</span><span><b>${n("keep")}</b> kept</span><span><b>${open}</b> undecided</span><span><b>${crafts}</b> craft${crafts === 1 ? "" : "s"} saved by your swaps</span>`;
}

function filters(){
  const sel = document.getElementById("deckf");
  sel.innerHTML = `<option value="">All decks</option>` + Object.entries(DECKS).map(([id, d]) => `<option value="${esc(id)}">${esc(id)} · ${esc(d.name)}</option>`).join("");
  sel.onchange = () => { F.deck = sel.value; render(); };
  const seg = (el, key, opts) => {
    el.innerHTML = opts.map(([v, l]) => `<button type="button" data-k="${key}" data-f="${v}" aria-pressed="${F[key] === v}">${l}</button>`).join("");
  };
  seg(document.getElementById("vdf"), "vd", [["", "All"], ["upgrade", "Upgrade"], ["sidegrade", "Sidegrade"], ["spice", "Spice"]]);
  seg(document.getElementById("pkf"), "pk", [["", "All"], ["open", "Undecided"], ["swap", "Swaps"]]);
  document.querySelector(".bar").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    F[b.dataset.k] = b.dataset.f;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
}

/* Picks live in the artifact's database (Claude reads them back, and writes `reply` beside
   them); in a view without it, in this browser only. The page writes only its own fields
   (`update` once a record exists), so a reply Claude wrote is never erased, and writes to one
   record go one at a time. */
const EXISTS = new Set(), CHAIN = {};
function save(id){
  const p = PICKS[id] || {}, body = {pick: p.pick || "", note: p.note || "", cut: p.cut || ""};
  if (!db) { try { localStorage.setItem("pack-swaps", JSON.stringify(PICKS)); } catch (e) {} return; }
  CHAIN[id] = (CHAIN[id] || Promise.resolve()).then(async () => {
    const ref = db.collection("swaps").doc(id);
    try {
      if (EXISTS.has(id)) { try { await ref.update(body); } catch (e) { await ref.set(body); } }
      else { await ref.set(body); EXISTS.add(id); }
    } catch (e) { setStore("Your last pick could not be saved: " + (e && e.message || e) + ". It is kept on this page until you reload.", true); }
  });
}
function setStore(t, warn){ const el = document.getElementById("store"); el.textContent = t; el.classList.toggle("warn", !!warn); }

/* Full-size card image: one modal dialog; Escape, the close button or any click closes it
   and focus goes back to the image that opened it. */
const ZOOM = document.getElementById("zoom"), ZIMG = document.getElementById("zimg");
let zoomFrom = null;
function openZoom(btn){
  zoomFrom = btn; ZIMG.src = btn.dataset.zoom; ZIMG.alt = btn.dataset.name;
  ZOOM.setAttribute("aria-label", btn.dataset.name);
  if (ZOOM.showModal) ZOOM.showModal(); else ZOOM.setAttribute("open", "");
  ZOOM.querySelector(".zclose").focus();
}
ZOOM.addEventListener("click", () => ZOOM.open && (ZOOM.close ? ZOOM.close() : ZOOM.removeAttribute("open")));
ZOOM.addEventListener("close", () => { if (zoomFrom && document.contains(zoomFrom)) zoomFrom.focus(); zoomFrom = null; });

document.getElementById("list").addEventListener("click", e => {
  const z = e.target.closest("button.zoom"); if (z) { openZoom(z); return; }
  const u = e.target.closest("[data-unfold]");
  if (u) { OPEN.add(u.dataset.unfold); redraw(u.dataset.unfold, ".act .seg button"); return; }
  const f = e.target.closest("[data-fold]");
  if (f) { OPEN.delete(f.dataset.fold); redraw(f.dataset.fold, ".fold"); return; }
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const id = b.dataset.id, v = b.dataset.v, cur = PICKS[id] || {};
  PICKS[id] = {...cur, pick: cur.pick === v ? "" : v};
  OPEN.delete(id);     // a fresh Swap / Keep folds the pair away
  redraw(id, folded(SWAP_BY[id]) ? ".fold" : `button[data-v="${v}"]`);
  tally(); save(id);
});
document.getElementById("list").addEventListener("change", e => {
  const sel = e.target.closest("select[data-cut]");
  if (sel) {
    const id = sel.dataset.cut, s = SWAP_BY[id];
    PICKS[id] = {...(PICKS[id] || {}), cut: sel.value === s.cut ? "" : sel.value};
    redraw(id, "select[data-cut]"); tally(); save(id); return;
  }
  const el = e.target.closest("input.note"); if (!el) return;
  const id = el.dataset.id; PICKS[id] = {...(PICKS[id] || {}), note: el.value.trim()}; save(id);
});

document.getElementById("copy").addEventListener("click", () => {
  const lines = [], byDeck = {};
  SWAPS.forEach(s => { const p = PICKS[s.id] || {}; if (p.pick === "swap") (byDeck[s.deck] ||= []).push(s); });
  Object.entries(byDeck).forEach(([d, ss]) => lines.push(`python3 scripts/deck.py swap ${d} --package ` + ss.map(s => `"${cutOf(s)}=${s.add}"`).join(" ")));
  const maybe = SWAPS.filter(s => (PICKS[s.id] || {}).pick === "maybe").map(s => `# maybe: deck ${s.deck} ${s.add} for ${cutOf(s)}`);
  const notes = SWAPS.filter(s => (PICKS[s.id] || {}).note).map(s => `# note (${s.deck} ${s.add}): ${PICKS[s.id].note}`);
  const text = [...lines, ...maybe, ...notes].join("\n") || "# no swaps picked yet";
  const box = document.getElementById("copybox"); box.value = text; box.hidden = false;
  const btn = document.getElementById("copy");
  navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy picks", 1600); })
    .catch(() => { box.focus(); box.select(); btn.textContent = "Select the box and copy"; });
});

document.getElementById("themebtn").addEventListener("click", () => {
  const r = document.documentElement, dark = r.getAttribute("data-theme") ? r.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; r.setAttribute("data-theme", next);
  try { const p = JSON.parse(localStorage.getItem("mtga-prefs") || "{}") || {}; p.theme = next; localStorage.setItem("mtga-prefs", JSON.stringify(p)); } catch (e) {}
});

document.getElementById("title").textContent = DATA.title;
document.getElementById("intro").textContent = DATA.intro;
filters(); render();

(async () => {
  try { const u = JSON.parse(localStorage.getItem("pack-swaps") || "{}"); Object.assign(PICKS, u); } catch (e) {}
  db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { local = true; setStore("Picks are kept in this browser only. Use Copy picks to send them to Claude."); render(); return; }
  const timer = setTimeout(() => setStore("Your saved picks can't be reached yet; new picks are kept on this page.", true), 10000);
  let first = true;
  db.collection("swaps").onSnapshot(snap => {
    if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
    const changed = [];
    snap.docs.forEach(d => {
      const v = d.data(); if (!v) return;
      EXISTS.add(d.id);
      const next = {pick: v.pick || "", note: v.note || "", cut: v.cut || "", reply: v.reply || ""};
      if (JSON.stringify(next) !== JSON.stringify(PICKS[d.id] || {})) { PICKS[d.id] = next; changed.push(d.id); }
    });
    setStore("Picks save as you make them; Claude reads them from here, and replies under your notes.");
    if (first) { first = false; render(); return; }
    // Redraw only records someone else changed, and never the one being typed in.
    changed.forEach(id => { const art = document.getElementById("p-" + id); if (art && !art.contains(document.activeElement)) redraw(id); });
    tally();
  }, err => { clearTimeout(timer); setStore("Saved picks are unavailable (" + (err && err.code || "error") + "); new picks are kept on this page.", true); });
})();
</script>
