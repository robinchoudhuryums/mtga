</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Swap board — generated by `scripts/builder.py swaps` from this template + builds/<slug>/swaps.json.
   The Builder's tokens and type, cut down to one job: each candidate beside the deck card it would
   replace, read at the same time. Layout: masthead, a sticky filter bar, then one section per deck
   holding a column of side-by-side pairs (stacked on a phone). */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --raise:#f8f9f7; --ink:#161a18; --muted:#5b6660; --line:#dce1dd;
  --brass:#8f7034; --accent:#0e6b62; --sel:#e5f0ee; --warn:#94590a; --bad:#a3322b; --good:#2f7a45;
  --pW:#f1e9c9; --pU:#b6d5ec; --pB:#bfb5b0; --pR:#eda48f; --pG:#acd6a3; --pC:#d4d4d0; --pip-ink:#1b1b1b;
  --display:"Marcellus SC", "Palatino Linotype", Georgia, serif;
  --read:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 18px rgba(20,30,25,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74; --good:#6fbf82;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151b19; --raise:#1a211f; --ink:#e5eae7; --muted:#93a099; --line:#26302c;
  --brass:#c8a35a; --accent:#45bcae; --sel:#16302b; --warn:#e2a64a; --bad:#ef7d74; --good:#6fbf82;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.mast h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.05em;text-wrap:balance}
.mast p{margin:0;font-family:var(--read);font-style:italic;color:var(--muted);max-width:68ch;flex:1 1 30ch}
.themebtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:.84rem}

.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.tally b{color:var(--ink);font-variant-numeric:tabular-nums}
.store{font-size:.82rem;color:var(--muted)}
.store.warn{color:var(--warn)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line)}
.bar label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bar select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.copybtn{margin-left:auto;background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
.copybox{width:100%;min-height:7em;font-family:var(--mono);font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}

section.deck{display:flex;flex-direction:column;gap:12px}
section.deck h2{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.04em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
section.deck h2 small{font-family:var(--ui);font-size:.85rem;color:var(--muted);letter-spacing:0}

.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.pair[data-pick="swap"]{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.pair[data-pick="keep"]{opacity:.72}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start}
.side{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;min-width:0}
.zoom{all:unset;cursor:zoom-in;display:block;width:150px;border-radius:8px}
.zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.side img{width:150px;aspect-ratio:488/680;border-radius:8px;display:block;background:var(--raise);object-fit:cover}
#zoom{border:0;padding:0;background:none;max-width:96vw;max-height:96vh;overflow:visible;cursor:zoom-out}
#zoom::backdrop{background:rgba(0,0,0,.78)}
#zoom img{display:block;max-width:min(96vw,672px);max-height:92vh;width:auto;height:auto;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#zoom .zclose{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.1rem;cursor:pointer;line-height:1}
#zoom .zclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side .noimg{width:150px;aspect-ratio:488/680;border-radius:8px;background:var(--raise);border:1px dashed var(--line)}
.role{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 2px}
.role.in{color:var(--good)}
.cn{margin:0;font-family:var(--read);font-weight:600;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.tl{margin:2px 0 6px;font-size:.84rem;color:var(--muted)}
.ot{margin:0;font-family:var(--read);font-size:.9rem;white-space:pre-line;overflow-wrap:anywhere}
.own{display:inline-block;margin-top:8px;font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.own.no{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.arrow{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;padding-top:40px}
.arrow .arw{font-size:1.4rem;line-height:1}
.vd{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.vd.upgrade{color:var(--good)} .vd.sidegrade{color:var(--accent)} .vd.spice{color:var(--brass)} .vd.standin{color:var(--warn)}

/* Craft order (optional): the unowned cards worth crafting, best first, grouped in tiers. */
.crafts{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.crafts > summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;list-style-position:inside}
.crafts > summary small{font-family:var(--ui);font-size:.85rem;color:var(--muted);letter-spacing:0;margin-left:8px}
.crafts .tier{padding:0 14px 12px}
.crafts h3{margin:8px 0 2px;font-family:var(--ui);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brass)}
.crafts .tierwhy{margin:0 0 6px;font-family:var(--read);font-style:italic;color:var(--muted);font-size:.9rem}
.crafts ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.craft{display:grid;grid-template-columns:2.2em 64px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.craft .rk{font-family:var(--mono);font-size:.95rem;color:var(--muted);text-align:right;padding-top:2px}
.craft .zoom,.craft img,.craft .noimg{width:64px}
.craft img{aspect-ratio:488/680;border-radius:5px;display:block;object-fit:cover}
.craft .noimg{aspect-ratio:488/680;border-radius:5px;border:1px dashed var(--line)}
.craft .cn{font-size:1rem}
.rar{display:inline-block;font-family:var(--mono);font-size:.7rem;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:.1em;margin-left:4px}
.rar.M{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)} .rar.R{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
.craft .meta{margin:2px 0 4px;font-size:.84rem;color:var(--muted)}
.craft .meta b{color:var(--ink);font-weight:500}
.craft .cw{margin:0;font-family:var(--read);font-size:.92rem}
.craft .fb{margin:4px 0 0;font-size:.84rem;color:var(--muted)}
.craft .fb a{color:var(--accent)}
@media (max-width:460px){ .craft{grid-template-columns:1.6em 48px minmax(0,1fr)} .craft .zoom,.craft img,.craft .noimg{width:48px} }

.why{margin:0;font-family:var(--read);font-size:.95rem}
.why em{color:var(--muted)}
.unconf{font-size:.82rem;color:var(--warn)}
.act{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.act .seg button{padding:5px 13px}
.act .seg button[data-v="swap"][aria-pressed="true"]{background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.note{flex:1 1 220px;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.empty{color:var(--muted);font-style:italic;font-family:var(--read)}
.cutrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem}
.cutrow label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cutrow select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:100%;min-width:0;color:var(--ink)}
.delta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:0;font-size:.82rem;color:var(--muted)}
.delta .dk{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.delta span.d{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.delta span.up{border-color:color-mix(in srgb,var(--good) 55%,var(--line));color:var(--good)}
.delta span.down{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.reply{margin:0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--raise);border-radius:0 6px 6px 0;font-family:var(--read);font-size:.92rem;white-space:pre-line}
.reply b{font-family:var(--ui);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-right:6px}
.pair.folded{padding:0}
.fold{all:unset;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;width:100%;padding:10px 14px;cursor:pointer;border-radius:8px}
.fold:focus-visible,.foldbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold .fk{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pair[data-pick="swap"] .fold .fk{color:var(--good)}
.fold .fn{font-family:var(--read);min-width:0;overflow-wrap:anywhere}
.fold .fm{font-size:.8rem;color:var(--muted)}
.fold .fo{margin-left:auto;font-size:.8rem;color:var(--accent)}
.foldbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:.84rem}

.pip{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;padding:0 .2em;border-radius:999px;font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--pip-ink);background:var(--pC);vertical-align:.1em;margin-right:1px}
.pip.W{background:var(--pW)} .pip.U{background:var(--pU)} .pip.B{background:var(--pB)} .pip.R{background:var(--pR)} .pip.G{background:var(--pG)}

@media (max-width:820px){
  .duel{grid-template-columns:minmax(0,1fr)}
  .arrow{flex-direction:row;padding-top:0;justify-content:flex-start}
  .arrow .arw{transform:rotate(90deg)}
}
@media (max-width:460px){
  .side{grid-template-columns:96px minmax(0,1fr)}
  .side img,.side .noimg,.zoom{width:96px}
  #zoom .zclose{top:4px;right:4px}
}
@media (prefers-reduced-motion:no-preference){ .pair{transition:border-color .15s, opacity .15s} }
</style>

  <header class="mast">
    <h1 id="title"></h1>

  <img id="zimg" alt="">
</dialog>

ed and attacking 1/1 red Warrior creature token. Sacrifice it at the beginning of the next end step.)", "own": 1, "id": "dragonback-lancer", "r": "C", "img": "img/lg/dragonback-lancer.jpg"}, "Mardu Thunderkite": {"n": "Mardu Thunderkite", "c": "{R}{W}{B}", "t": "Creature — Dragon", "o": "Flying\nMobilize 1\nWhen this creature enters, creatures you control perpetually gain your choice of menace, lifelink, or haste.", "own": 0, "id": "mardu-thunderkite", "r": "M", "img": "img/lg/mardu-thunderkite.jpg"}, "Captain Lannery Storm": {"n": "Captain Lannery Storm", "c": "{2}{R}", "t": "Legendary Creature — Human Pirate", "o": "Haste\nWhenever Captain Lannery Storm attacks, create a Treasure token. (It's an artifact with \"{T}, Sacrifice this token: Add one mana of any color.\")\nWhenever you sacrifice a Treasure, Captain Lannery Storm gets +1/+0 until end of turn.", "own": 1, "id": "captain-lannery-storm", "r": "R", "img": "img/lg/captain-lannery-storm.jpg"}, "Professional Face-Breaker": {"n": "Professional Face-Breaker", "c": "{2}{R}", "t": "Creature — Human Warrior", "o": "Menace\nWhenever one or more creatures you control deal combat damage to a player, create a Treasure token.\nSacrifice a Treasure: Exile the top card of your library. You may play that card this turn.", "own": 0, "id": "professional-face-breaker", "r": "R", "img": "img/lg/professional-face-breaker.jpg"}, "Cosmic Cube": {"n": "Cosmic Cube", "c": "{5}", "t": "Artifact", "o": "Ward {2}\nWhenever you attack, look at the top six cards of your library. You may cast a spell from among them with mana value less than or equal to the greatest power among attacking creatures you control without paying its mana cost. Put the rest on the bottom of your library in a random order.", "own": 1, "id": "cosmic-cube", "r": "M", "img": "img/lg/cosmic-cube.jpg"}, "Phyrexian Dragon Engine": {"n": "Phyrexian Dragon Engine", "c": "{3}", "t": "Artifact Creature — Phyrexian Dragon", "o": "Double strike\nWhen this creature enters from your graveyard, you may discard your hand. If you do, draw three cards.\nUnearth {3}{R}{R}\n(Melds with Mishra, Claimed by Gix.)", "own": 0, "id": "phyrexian-dragon-engine", "r": "R", "img": "img/lg/phyrexian-dragon-engine.jpg"}, "Captain James T. Kirk": {"n": "Captain James T. Kirk", "c": "{2}{R}", "t": "Legendary Creature — Human Officer", "o": "Whenever Captain Kirk enters or attacks, choose one. If you have no cards in hand, choose one or more instead.\n• Discard a card, then draw a card.\n• Create a 1/1 red Officer creature token.\n• Creatures you control get +1/+0 until end of turn.", "own": 1, "id": "captain-james-t-kirk", "r": "M", "img": "img/lg/captain-james-t-kirk.jpg"}, "Celes, Rune Knight": {"n": "Celes, Rune Knight", "c": "{1}{R}{W}{B}", "t": "Legendary Creature — Human Wizard Knight", "o": "When Celes enters, discard any number of cards, then draw that many cards plus one.\nWhenever one or more other creatures you control enter, if one or more of them entered from a graveyard or was cast from a graveyard, put a +1/+1 counter on each creature you control.", "own": 0, "id": "celes-rune-knight", "r": "M", "img": "img/lg/celes-rune-knight.jpg"}, "Cool but Rude": {"n": "Cool but Rude", "c": "{1}{R}", "t": "Enchantment — Class", "o": "(Gain the next level as a sorcery to add its ability.)\nWhenever you attack, you may discard a card. If you do, draw a card.\n{1}{R}: Level 2\nWhenever you discard a card, this Class deals 2 damage to each opponent.\n{1}{R}: Level 3\nWhen this Class becomes level 3, search your library for a card, put it into your hand, shuffle, then discard a card at random.", "own": 1, "id": "cool-but-rude", "r": "R", "img": "img/lg/cool-but-rude.jpg"}, "Crucias, Titan of the Waves": {"n": "Crucias, Titan of the Waves", "c": "{1}{B}{R}", "t": "Legendary Creature — Human Pirate", "o": "At the beginning of your end step, you may discard a card. If you do, create a Treasure token and choose ambitious or expedient. If you chose ambitious, seek a card with greater mana value than the discarded card. If you chose expedient, seek a card with lesser mana value than the discarded card.", "own": 0, "id": "crucias-titan-of-the-waves", "r": "M", "img": "img/lg/crucias-titan-of-the-waves.jpg"}, "Monument to Endurance": {"n": "Monument to Endurance", "c": "{3}", "t": "Artifact", "o": "Whenever you discard a card, choose one that hasn't been chosen this turn —\n• Draw a card.\n• Create a Treasure token.\n• Each opponent loses 3 life.", "own": 1, "id": "monument-to-endurance", "r": "R", "img": "img/lg/monument-to-endurance.jpg"}, "Living Laser": {"n": "Living Laser", "c": "{4}{R}", "t": "Legendary Creature — Elemental Villain", "o": "Haste\nWhenever Living Laser attacks, for each card you've discarded this turn, create a token that's a copy of Living Laser, except the token isn't legendary. The tokens enter tapped and attacking. Exile the tokens at the beginning of the next end step.", "own": 0, "id": "living-laser", "r": "R", "img": "img/lg/living-laser.jpg"}, "Magmakin Artillerist": {"n": "Magmakin Artillerist", "c": "{2}{R}", "t": "Creature — Elemental Pirate", "o": "Whenever you discard one or more cards, this creature deals that much damage to each opponent.\nCycling {1}{R} ({1}{R}, Discard this card: Draw a card.)\nWhen you cycle this card, it deals 1 damage to each opponent.", "own": 1, "id": "magmakin-artillerist", "r": "C", "img": "img/lg/magmakin-artillerist.jpg"}, "Rakdos, the Muscle": {"n": "Rakdos, the Muscle", "c": "{2}{B}{B}{R}", "t": "Legendary Creature — Demon Mercenary", "o": "Flying, trample\nWhenever you sacrifice another creature, exile cards equal to its mana value from the top of target player's library. Until your next end step, you may play those cards, and mana of any type can be spent to cast those spells.\nSacrifice another creature: Rakdos gains indestructible until end of turn. Tap it. Activate only once each turn.", "own": 0, "id": "rakdos-the-muscle", "r": "M", "img": "img/lg/rakdos-the-muscle.jpg"}, "Olivia, Crimson Bride": {"n": "Olivia, Crimson Bride", "c": "{4}{B}{R}", "t": "Legendary Creature — Vampire Noble", "o": "Flying, haste\nWhenever Olivia attacks, return target creature card from your graveyard to the battlefield tapped and attacking. It gains \"When you don't control a legendary Vampire, exile this creature.\"", "own": 1, "id": "olivia-crimson-bride", "r": "M", "img": "img/lg/olivia-crimson-bride.jpg"}, "Olivia, Opulent Outlaw": {"n": "Olivia, Opulent Outlaw", "c": "{1}{R}{W}{B}", "t": "Legendary Creature — Vampire Assassin", "o": "Flying, lifelink\nWhenever one or more outlaws you control deal combat damage to a player, create a Treasure token. (Assassins, Mercenaries, Pirates, Rogues, and Warlocks are outlaws.)\n{3}, Sacrifice two Treasures: Put two +1/+1 counters on each creature you control. Activate only as a sorcery.", "own": 0, "id": "olivia-opulent-outlaw", "r": "M", "img": "img/lg/olivia-opulent-outlaw.jpg"}, "Drakuseth, Maw of Flames": {"n": "Drakuseth, Maw of Flames", "c": "{4}{R}{R}{R}", "t": "Legendary Creature — Dragon", "o": "Flying\nWhenever Drakuseth attacks, it deals 4 damage to any target and 3 damage to each of up to two other targets.", "own": 1, "id": "drakuseth-maw-of-flames", "r": "R", "img": "img/lg/drakuseth-maw-of-flames.jpg"}, "Zagras, Thief of Heartbeats": {"n": "Zagras, Thief of Heartbeats", "c": "{4}{B}{R}", "t": "Legendary Creature — Vampire Rogue", "o": "This spell costs {1} less to cast for each creature in your party.\nFlying, deathtouch, haste\nOther creatures you control have deathtouch.\nWhenever a creature you control deals combat damage to a planeswalker, destroy that planeswalker.", "own": 0, "id": "zagras-thief-of-heartbeats", "r": "R", "img": "img/lg/zagras-thief-of-heartbeats.jpg"}, "Daredevil, Man Without Fear": {"n": "Daredevil, Man Without Fear", "c": "{2}{R}{W}", "t": "Legendary Creature — Human Hero", "o": "Vigilance, haste\nRadar Sense — You may look at the top card of your library any time.\nWhenever you attack, you may exile the top card of your library. If that card is a Hero card, Daredevil gets +2/+1 until end of turn. You may play that card this turn.", "own": 1, "id": "daredevil-man-without-fear", "r": "R", "img": "img/lg/daredevil-man-without-fear.jpg"}, "Dictate of Erebos": {"n": "Dictate of Erebos", "c": "{3}{B}{B}", "t": "Enchantment", "o": "Flash\nWhenever a creature you control dies, each opponent sacrifices a creature of their choice.", "own": 0, "id": "dictate-of-erebos", "r": "R", "img": "img/lg/dictate-of-erebos.jpg"}, "Involuntary Employment": {"n": "Involuntary Employment", "c": "{3}{R}", "t": "Sorcery", "o": "Gain control of target creature until end of turn. Untap that creature. It gains haste until end of turn. Create a Treasure token. (It's an artifact with \"{T}, Sacrifice this token: Add one mana of any color.\")", "own": 1, "id": "involuntary-employment", "r": "C", "img": "img/lg/involuntary-employment.jpg"}, "Angrath, the Flame-Chained": {"n": "Angrath, the Flame-Chained", "c": "{3}{B}{R}", "t": "Legendary Planeswalker — Angrath", "o": "+1: Each opponent discards a card and loses 2 life.\n−3: Gain control of target creature until end of turn. Untap it. It gains haste until end of turn. Sacrifice it at the beginning of the next end step if it has mana value 3 or less.\n−8: Each opponent loses life equal to the number of cards in their graveyard.", "own": 0, "id": "angrath-the-flame-chained", "r": "M", "img": "img/lg/angrath-the-flame-chained.jpg"}, "Samut, Hazoret's Champion": {"n": "Samut, Hazoret's Champion", "c": "{1}{R}", "t": "Legendary Creature — Human Warrior Cleric", "o": "Creatures you control have haste.", "own": 1, "id": "samut-hazoret-s-champion", "r": "R", "img": "img/lg/samut-hazoret-s-champion.jpg"}, "Smellerbee, Rebel Fighter": {"n": "Smellerbee, Rebel Fighter", "c": "{3}{R}", "t": "Legendary Creature — Human Rebel Ally", "o": "First strike\nOther creatures you control have haste.\nWhenever Smellerbee attacks, you may discard your hand. If you do, draw cards equal to the number of attacking creatures.", "own": 0, "id": "smellerbee-rebel-fighter", "r": "R", "img": "img/lg/smellerbee-rebel-fighter.jpg"}, "Winota, Joiner of Forces": {"n": "Winota, Joiner of Forces", "c": "{2}{R}{W}", "t": "Legendary Creature — Human Warrior", "o": "Whenever a non-Human creature you control attacks, look at the top six cards of your library. You may put a Human creature card from among them onto the battlefield tapped and attacking. It gains indestructible until end of turn. Put the rest of the cards on the bottom of your library in a random order.", "own": 1, "id": "winota-joiner-of-forces", "r": "M", "img": "img/lg/winota-joiner-of-forces.jpg"}, "Djeru and Hazoret": {"n": "Djeru and Hazoret", "c": "{2}{R}{R}{W}", "t": "Legendary Creature — Human God", "o": "As long as you have one or fewer cards in hand, Djeru and Hazoret has vigilance and haste.\nWhenever Djeru and Hazoret attacks, look at the top six cards of your library. You may exile a legendary creature card from among them. Put the rest on the bottom of your library in a random order. Until end of turn, you may cast the exiled card without paying its mana cost.", "own": 0, "id": "djeru-and-hazoret", "r": "R", "img": "img/lg/djeru-and-hazoret.jpg"}, "Full Throttle": {"n": "Full Throttle", "c": "{4}{R}{R}", "t": "Sorcery", "o": "After this main phase, there are two additional combat phases.\nAt the beginning of each combat this turn, untap all creatures that attacked this turn.", "own": 1, "id": "full-throttle", "r": "R", "img": "img/lg/full-throttle.jpg"}, "Raiyuu, Storm's Edge": {"n": "Raiyuu, Storm's Edge", "c": "{2}{R}{W}", "t": "Legendary Creature — Human Samurai", "o": "First strike\nWhenever a Samurai or Warrior you control attacks alone, untap it. If it's the first combat phase of the turn, there is an additional combat phase after this phase.", "own": 0, "id": "raiyuu-storm-s-edge", "r": "R", "img": "img/lg/raiyuu-storm-s-edge.jpg"}, "Screeching Soulbreaker": {"n": "Screeching Soulbreaker", "c": "{2}{B}", "t": "Creature — Siren Bard", "o": "Flying\nWhenever this creature attacks, it deals 1 damage to each opponent and you gain 1 life.", "own": 1, "id": "screeching-soulbreaker", "r": "C", "img": "img/lg/screeching-soulbreaker.jpg"}, "Far Fortune, End Boss": {"n": "Far Fortune, End Boss", "c": "{2}{B}{R}", "t": "Legendary Creature — Human Mercenary", "o": "Start your engines! (If you have no speed, it starts at 1. It increases once on each of your turns when an opponent loses life. Max speed is 4.)\nWhenever you attack, Far Fortune deals 1 damage to each opponent.\nMax speed — If a source you control would deal damage to an opponent or a permanent an opponent controls, it deals that much damage plus 1 instead.", "own": 0, "id": "far-fortune-end-boss", "r": "R", "img": "img/lg/far-fortune-end-boss.jpg"}, "Garruk's Uprising": {"n": "Garruk's Uprising", "c": "{2}{G}", "t": "Enchantment", "o": "When this enchantment enters, if you control a creature with power 4 or greater, draw a card.\nCreatures you control have trample. (Each of those creatures can deal excess combat damage to the player or planeswalker it's attacking.)\nWhenever a creature you control with power 4 or greater enters, draw a card.", "own": 2, "id": "garruk-s-uprising", "r": "U", "img": "img/lg/garruk-s-uprising.jpg"}, "Nylea, God of the Hunt": {"n": "Nylea, God of the Hunt", "c": "{3}{G}", "t": "Legendary Enchantment Creature — God", "o": "Indestructible\nAs long as your devotion to green is less than five, Nylea isn't a creature. (Each {G} in the mana costs of permanents you control counts toward your devotion to green.)\nOther creatures you control have trample.\n{3}{G}: Target creature gets +2/+2 until end of turn.", "own": 0, "id": "nylea-god-of-the-hunt", "r": "M", "img": "img/lg/nylea-god-of-the-hunt.jpg"}, "Punishing Punch": {"n": "Punishing Punch", "c": "{2}{G}", "t": "Instant", "o": "This spell costs {2} nters.)\n0: You draw a card and lose 1 life. Proliferate.\n−2: Target creature becomes a Treasure artifact with \"{T}, Sacrifice this artifact: Add one mana of any color\" and loses all other card types and abilities.\n−9: If target player has fewer than nine poison counters, they get a number of poison counters equal to the difference.", "own": 0, "id": "vraska-betrayal-s-sting", "r": "M", "img": "img/lg/vraska-betrayal-s-sting.jpg"}, "Wrenn and Seven": {"n": "Wrenn and Seven", "c": "{3}{G}{G}", "t": "Legendary Planeswalker — Wrenn", "o": "+1: Reveal the top four cards of your library. Put all land cards revealed this way into your hand and the rest into your graveyard.\n0: Put any number of land cards from your hand onto the battlefield tapped.\n−3: Create a green Treefolk creature token with reach and \"This token's power and toughness are each equal to the number of lands you control.\"\n−8: Return all permanent cards from your graveyard to your hand. You get an emblem with \"You have no maximum hand size.\"", "own": 1, "id": "wrenn-and-seven", "r": "M", "img": "img/lg/wrenn-and-seven.jpg"}, "Nissa, Voice of Zendikar": {"n": "Nissa, Voice of Zendikar", "c": "{1}{G}{G}", "t": "Legendary Planeswalker — Nissa", "o": "+1: Create a 0/1 green Plant creature token.\n−2: Put a +1/+1 counter on each creature you control.\n−7: You gain X life and draw X cards, where X is the number of lands you control.", "own": 0, "id": "nissa-voice-of-zendikar", "r": "M", "img": "img/lg/nissa-voice-of-zendikar.jpg"}, "Kiora, the Crashing Wave": {"n": "Kiora, the Crashing Wave", "c": "{2}{G}{U}", "t": "Legendary Planeswalker — Kiora", "o": "+1: Until your next turn, prevent all damage that would be dealt to and dealt by target permanent an opponent controls.\n−1: Draw a card. You may play an additional land this turn.\n−5: You get an emblem with \"At the beginning of your end step, create a 9/9 blue Kraken creature token.\"", "own": 1, "id": "kiora-the-crashing-wave", "r": "M", "img": "img/lg/kiora-the-crashing-wave.jpg"}, "Tezzeret the Schemer": {"n": "Tezzeret the Schemer", "c": "{2}{U}{B}", "t": "Legendary Planeswalker — Tezzeret", "o": "+1: Create a colorless artifact token named Etherium Cell with \"{T}, Sacrifice this token: Add one mana of any color.\"\n−2: Target creature gets +X/-X until end of turn, where X is the number of artifacts you control.\n−7: You get an emblem with \"At the beginning of combat on your turn, target artifact you control becomes an artifact creature with base power and toughness 5/5.\"", "own": 0, "id": "tezzeret-the-schemer", "r": "M", "img": "img/lg/tezzeret-the-schemer.jpg"}, "Jace, Reality Sculptor": {"n": "Jace, Reality Sculptor", "c": "{3}{U}{U}", "t": "Legendary Planeswalker — Jace", "o": "+1: Empower Jace X, where X is the number of Islands you control.\n−3: Until your next turn, whenever a creature attacks you or a planeswalker you control, it gets -5/-0 until end of turn.\n0: Exile all but the bottom card of each opponent's library. Activate only if there are twenty-five or more loyalty counters among Jaces you control.", "own": 1, "id": "jace-reality-sculptor", "r": "R", "img": "img/lg/jace-reality-sculptor.jpg"}, "Jace, the Perfected Mind": {"n": "Jace, the Perfected Mind", "c": "{2}{U}{U/P}", "t": "Legendary Planeswalker — Jace", "o": "Compleated ({U/P} can be paid with {U} or 2 life. If life was paid, this planeswalker enters with two fewer loyalty counters.)\n+1: Until your next turn, up to one target creature gets -3/-0.\n−2: Target player mills three cards. Then if a graveyard has twenty or more cards in it, you draw three cards. Otherwise, you draw a card.\n−X: Target player mills three times X cards.", "own": 0, "id": "jace-the-perfected-mind", "r": "M", "img": "img/lg/jace-the-perfected-mind.jpg"}, "Phyrexian Arena": {"n": "Phyrexian Arena", "c": "{1}{B}{B}", "t": "Enchantment", "o": "At the beginning of your upkeep, you draw a card and you lose 1 life.", "own": 1, "id": "phyrexian-arena", "r": "R", "img": "img/lg/phyrexian-arena.jpg"}, "Erebos, God of the Dead": {"n": "Erebos, God of the Dead", "c": "{3}{B}", "t": "Legendary Enchantment Creature — God", "o": "Indestructible\nAs long as your devotion to black is less than five, Erebos isn't a creature. (Each {B} in the mana costs of permanents you control counts toward your devotion to black.)\nYour opponents can't gain life.\n{1}{B}, Pay 2 life: Draw a card.", "own": 0, "id": "erebos-god-of-the-dead", "r": "M", "img": "img/lg/erebos-god-of-the-dead.jpg"}, "Seven of Nine, Unassimilated": {"n": "Seven of Nine, Unassimilated", "c": "{1}{U}", "t": "Legendary Artifact Creature — Human Officer", "o": "At the beginning of your first main phase, draw a card. Then discard a card unless you control five or more differently named lands.\n{6}{U}: Seven of Nine's base power and toughness become 7/9. Activate only if you control seven or more differently named lands.", "own": 2, "id": "seven-of-nine-unassimilated", "r": "M", "img": "img/lg/seven-of-nine-unassimilated.jpg"}, "Malcolm, Alluring Scoundrel": {"n": "Malcolm, Alluring Scoundrel", "c": "{1}{U}", "t": "Legendary Creature — Siren Pirate", "o": "Flash\nFlying\nWhenever Malcolm deals combat damage to a player, put a chorus counter on it. Draw a card, then discard a card. If there are four or more chorus counters on Malcolm, you may cast the discarded card without paying its mana cost.", "own": 0, "id": "malcolm-alluring-scoundrel", "r": "R", "img": "img/lg/malcolm-alluring-scoundrel.jpg"}, "Thunderous Snapper": {"n": "Thunderous Snapper", "c": "{G/U}{G/U}{G/U}{G/U}", "t": "Creature — Turtle Hydra", "o": "Whenever you cast a spell with mana value 5 or greater, draw a card.", "own": 1, "id": "thunderous-snapper", "r": "U", "img": "img/lg/thunderous-snapper.jpg"}, "Thryx, the Sudden Storm": {"n": "Thryx, the Sudden Storm", "c": "{3}{U}{U}", "t": "Legendary Creature — Elemental Giant", "o": "Flash (You may cast this spell any time you could cast an instant.)\nFlying\n aether-syphon", "r": "U", "img": "img/lg/aether-syphon.jpg"}, "Immortus, Master of Eternity": {"n": "Immortus, Master of Eternity", "c": "{2}{U}{U}", "t": "Legendary Creature — Human Hero Villain", "o": "{T}: Add {U} for each card you've drawn this turn. Spend this mana only to cast noncreature spells.\nPower-up — {5}{U}{U}: Each player shuffles their hand and graveyard into their library, then draws seven cards. Put a +1/+1 counter on Immortus. (Activate each power-up ability only once. Reduce the cost by his mana cost if he entered this turn.)", "own": 0, "id": "immortus-master-of-eternity", "r": "M", "img": "img/lg/immortus-master-of-eternity.jpg"}, "Terisian Mindbreaker": {"n": "Terisian Mindbreaker", "c": "{7}", "t": "Artifact Creature — Juggernaut", "o": "Whenever this creature attacks, defending player mills half their library, rounded up.\nUnearth {1}{U}{U}{U} ({1}{U}{U}{U}: Return this card from your graveyard to the battlefield. It gains haste. Exile it at the beginning of the next end step or if it would leave the battlefield. Unearth only as a sorcery.)", "own": 0, "id": "terisian-mindbreaker", "r": "R", "img": "img/lg/terisian-mindbreaker.jpg"}, "Smaug the Magnificent": {"n": "Smaug the Magnificent", "c": "{2}{R}{R}", "t": "Legendary Creature — Dragon", "o": "Flying, haste\nWhenever Smaug attacks, he deals damage equal to the number of Treasures you control to any target.\nAt the beginning of your upkeep, create a Treasure token.", "own": 1, "id": "smaug-the-magnificent", "r": "M", "img": "img/lg/smaug-the-magnificent.jpg"}, "Goldspan Dragon": {"n": "Goldspan Dragon", "c": "{3}{R}{R}", "t": "Creature — Dragon", "o": "Flying, haste\nWhenever this creature attacks or becomes the target of a spell, create a Treasure token.\nTreasures you control have \"{T}, Sacrifice this artifact: Add two mana of any one color.\"", "own": 0, "id": "goldspan-dragon", "r": "M", "img": "img/lg/goldspan-dragon.jpg"}, "Aggravated Assault": {"n": "Aggravated Assault", "c": "{2} er one or more creatures you control deal combat damage to a player, create two Treasure tokens.\n{B}, Sacrifice X Treasures: Target creature gets -X/-X until end of turn. Activate only as a sorcery.", "own": 1, "id": "grim-hireling", "r": "R", "img": "img/lg/grim-hireling.jpg"}, "Ancient Copper Dragon": {"n": "Ancient Copper Dragon", "c": "{4}{R}{R}", "t": "Creature — Elder Dragon", "o": "Flying\nWhenever this creature deals combat damage to a player, roll a d20. You create a number of Treasure tokens equal to the result.", "own": 0, "id": "ancient-copper-dragon", "r": "M", "img": "img/lg/ancient-copper-dragon.jpg"}, "Savage Beating": {"n": "Savage Beating", "c": "{3}{R}{R}", "t": "Instant", "o": "Cast this spell only during combat on your turn.\nChoose one —\n• Creatures you control gain double strike until end of turn.\n• Untap all creatures you control. After this phase, there is an additional combat phase.\nEntwine {1}{R} (Choose both if you pay the entwine cost.)", "own": 0, "id": "savage-beating", "r": "M", "img": "img/lg/savage-beating.jpg"}, "Zuko, Exiled Prince": {"n": "Zuko, Exiled Prince", "c": "{3}{R}", "t": "Legendary Creature — Human Noble", "o": "Firebending 3 (Whenever this creature attacks, add {R}{R}{R}. This mana lasts until end of combat.)\n{3}: Exile the top card of your library. You may play that card this turn.", "own": 1, "id": "zuko-exiled-prince", "r": "U", "img": "img/lg/zuko-exiled-prince.jpg"}, "Zuko, Firebending Master": {"n": "Zuko, Firebending Master", "c": "{1}{R}", "t": "Legendary Creature — Human Noble Ally", "o": "First strike\nFirebending X, where X is the number of experience counters you have. (Whenever this creature attacks, add X {R}. This mana lasts until end of combat.)\nWhenever you cast a spell during combat, you get an experience counter.", "own": 0, "id": "zuko-firebending-master", "r": "M", "img": "img/lg/zuko-firebending-master.jpg"}, "Zhao, Ruthless Admiral": {"n": "Zhao, Ruthless Admiral", "c": "{2}{B/R}{B/R}", "t" tan": {"n": "Summon: Titan", "c": "{3}{G}{G}", "t": "Enchantment Creature — Saga Giant", "o": "(As this Saga enters and after your draw step, add a lore counter. Sacrifice after III.)\nI — Mill five cards.\nII — Return all land cards from your graveyard to the battlefield tapped.\nIII — Until end of turn, another target creature you control gains trample and gets +X/+X, where X is the number of lands you control.\nReach, trample", "own": 1, "id": "summon-titan", "r": "R", "img": "img/lg/summon-titan.jpg"}, "Daemogoth Titan": {"n": "Daemogoth Titan", "c": "{B/G}{B/G}{B/G}{B/G}", "t": "Creature — Demon", "o": "Whenever this creature attacks or blocks, sacrifice a creature.", "own": 0, "id": "daemogoth-titan", "r": "R", "img": "img/lg/daemogoth-titan.jpg"}, "Polukranos, Unchained": {"n": "Polukranos, Unchained", "c": "{2}{B}{G}", "t": "Legendary Creature — Zombie Hydra", "o": "Polukranos enters with six +1/+1 counters on it. It escapes with twelve +1/+1 counters on it instead.\nIf damage would be dealt to Polukranos while it has a +1/+1 counter on it, prevent that damage and remove that many +1/+1 counters from it.\n{1}{B}{G}: Polukranos fights another target creature.\nEscape—{4}{B}{G}, Exile six other cards from your graveyard.", "own": 0, "id": "polukranos-unchained", "r": "M", "img": "img/lg/polukranos-unchained.jpg"}, "Garruk Relentless // Garruk, the Veil-Cursed": {"n": "Garruk Relentless // Garruk, the Veil-Cursed", "c": "{3}{G}", "t": "Legendary Planeswalker — Garruk // Legendary Planeswalker — Garruk", "o": "When Garruk has two or fewer loyalty counters on him, transform him.\n0: Garruk deals 3 damage to target creature. That creature deals damage equal to its power to him.\n0: Create a 2/2 green Wolf creature token. // +1: Create a 1/1 black Wolf creature token with deathtouch.\n−1: Sacrifice a creature. If you do, search your library for a creature card, reveal it, put it into your hand, then shuffle.\n−3: Creatures you control gain trample and get +X/+X until end of turn, where X is the number of creature cards in your graveyard.", "own": 0, "id": "garruk-relentless-garruk-the-veil-cursed", "r": "M", "img": "img/lg/garruk-relentless-garruk-the-veil-cursed.jpg"}, "Nissa of Shadowed Boughs": {"n": "Nissa of Shadowed Boughs", "c": "{2}{B}{G}", "t": "Legendary Planeswalker — Nissa", "o": "Landfall — Whenever a land you control enters, put a loyalty counter on Nissa.\n+1: Untap target land you control. You may have it become a 3/3 Elemental creature with haste and menace until end of turn. It's still a land.\n−5: You may put a creature card with mana value less than or equal to the number of lands you control onto the battlefield from your hand or graveyard with two +1/+1 counters on it.", "own": 0, "id": "nissa-of-shadowed-boughs", "r": "M", "img": "img/lg/nissa-of-shadowed-boughs.jpg"}, "Tyvar, Jubilant Brawler": {"n": "Tyvar, Jubilant Brawler", "c": "{1}{B}{G}", "t": "Legendary Planeswalker — Tyvar", "o": "You may activate abilities of creatures you control as though those creatures had haste.\n+1: Untap up to one target creature.\n−2: Mill three cards, then you may return a creature card with mana value 2 or less from your graveyard to the battlefield.", "own": 0, "id": "tyvar-jubilant-brawler", "r": "R", "img": "img/lg/tyvar-jubilant-brawler.jpg"}, "The Sackville-Bagginses": {"n": "The Sackville-Bagginses", "c": "{1}{B}", "t": "Legendary Creature — Halfling Citizen", "o": "When The Sackville-Bagginses enter, you may sacrifice another creature or artifact. If you do, draw a card and create a Treasure token.\nWhenever you sacrifice a token, target opponent loses 1 life.", "own": 1, "id": "the-sackville-bagginses", "r": "R", "img": "img/lg/the-sackville-bagginses.jpg"}, "Dina, Essence Brewer": {"n": "Dina, Essence Brewer", "c": "{1}{B}{G}", "t": "Legendary Creature — Dryad Druid", "o": "Whenever you sacrifice a creature, draw a card. This ability triggers only once each turn.\n{2}, {T}, Sacrifice another creature: You gain X life and put X +1/+1 counters on target creature you control, where X is the sacrificed creature's power.", "own": 0, "id": "dina-essence-brewer", "r": "M", "img": "img/lg/dina-essence-brewer.jpg"}, "Hidetsugu, Devouring Chaos": {"n": "Hidetsugu, Devouring Chaos", "c": "{3}{B}", "t": "Legendary Creature — Ogre Demon", "o": "{B}, Sacrifice a creature: Scry 2.\n{2}{R}, {T}: Exile the top card of your library. You may play that card this turn. When you exile a nonland card this way, Hidetsugu deals damage equal to the exiled card's mana value to any target.", "own": 0, "id": "hidetsugu-devouring-chaos", "r": "R", "img": "img/lg/hidetsugu-devouring-chaos.jpg"}, "Juri, Master of the Revue": {"n": "Juri, Master of the Revue", "c": "{B}{R}", "t": "Legendary Creature — Human Shaman", "o": "Whenever you sacrifice a permanent, put a +1/+1 counter on Juri.\nWhen Juri dies, it deals damage equal to its power to any target.", "own": 1, "id": "juri-master-of-the-revue", "r": "U", "img": "img/lg/juri-master-of-the-revue.jpg"}, "Bontu the Glorified": {"n": "Bontu the Glorified", "c": "{2}{B}", "t": "Legendary Creature — God", "o": "Menace, indestructible\nBontu can't attack or block unless a creature died under your control this turn.\n{1}{B}, Sacrifice another creature: Scry 1. Each opponent loses 1 life and you gain 1 life.", "own": 0, "id": "bontu-the-glorified", "r": "M", "img": "img/lg/bontu-the-glorified.jpg"}, "Redrock Sentinel": {"n": "Redrock Sentinel", "c": "{3}", "t": "Artifact Creature — Golem", "o": "Defender\n{2}, {T}, Sacrifice a land: Draw a card and create a Treasure token. (It's an artifact with \"{T}, Sacrifice this token: Add one mana of any color.\")", "own": 1, "id": "redrock-sentinel", "r": "U", "img": "img/lg/redrock-sentinel.jpg"}, "Hearthhull, the Worldseed": {"n": "Hearthhull, the Worldseed", "c": "{1}{B}{R}{G}", "t": "Legendary Artifact — Spacecraft", "o": "Station (Tap another creature you control: Put charge counters equal to its power on this Spacecraft. Station only as a sorcery. It's an artifact creature at 8+.)\n2+ | {1}, {T}, Sacrifice a land: Draw two cards. You may play an additional land this turn.\n8+ | Flying, vigilance, haste\nWhenever you sacrifice a land, each opponent loses 2 life.", "own": 0, "id": "hearthhull-the-worldseed", "r": "M", "img": "img/lg/hearthhull-the-worldseed.jpg"}, "Cycle of Renewal": {"n": "Cycle of Renewal", "c": "{2}{G}", "t": "Instant — Lesson", "o": "Sacrifice a land. Search your library for up to two basic land cards, put them onto the battlefield tapped, then shuffle.", "own": 1, "id": "cycle-of-renewal", "r": "C", "img": "img/lg/cycle-of-renewal.jpg"}, "Genesis Device": {"n": "Genesis Device", "c": "{2}{G}", "t": "Legendary Artifact", "o": "When Genesis Device enters, search your library for a basic land card or Planet card, put it onto the battlefield tapped, then shuffle.\n{3}{G}{G}, {T}, Sacrifice Genesis Device: Sacrifice any number of lands you control, then search your library for up to that many land cards, put them onto the battlefield tapped, then shuffle. Activate only as a sorcery.", "own": 0, "id": "genesis-device", "r": "R", "img": "img/lg/genesis-device.jpg"}, "Venom Connoisseur": {"n": "Venom Connoisseur", "c": "{1}{G}", "t": "Creature — Human Druid", "o": "Alliance — Whenever another creature you control enters, this creature gains deathtouch until end of turn. If this is the second time this ability has resolved this turn, all creatures you control gain deathtouch until end of turn.", "own": 1, "id": "venom-connoisseur", "r": "U", "img": "img/lg/venom-connoisseur.jpg"}, "Vraska Joins Up": {"n": "Vraska Joins Up", "c": "{B}{G}", "t": "Legendary Enchantment", "o": "When Vraska Joins Up enters, put a deathtouch counter on each creature you control.\nWhenever a legendary creature you control deals combat damage to a player, draw a card.", "own": 0, "id": "vraska-joins-up", "r": "R", "img": "img/lg/vraska-joins-up.jpg"}, "Icetill Explorer": {"n": "Icetill Explorer", "c": "{2}{G}{G}", "t": "Creature — Insect Scout", "o": "You may play an additional land on each of your turns.\nYou may play lands from your graveyard.\nLandfall — Whenever a land you control enters, mill a card.", "own": 1, "id": "icetill-explorer", "r": "R", "img": "img/lg/icetill-explorer.jpg"}, "Azusa, Lost but Seeking": {"n": "Azusa, Lost but Seeking", "c": "{2}{G}", "t": "Legendary Creature — Human Monk", "o": "You may play two additional lands on each of your turns.", "own": 0, "id": "azusa-lost-but-seeking", "r": "R", "img": "img/lg/azusa-lost-but-seeking.jpg"}, "Doubling Season": {"n": "Doubling Season", "c": "{4}{G}", "t": "Enchantment", "o": "If an effect would create one or more tokens under your control, it creates twice that many of those tokens instead.\nIf an effect would put one or more counters on a permanent you control, it puts twice that many of those counters on that permanent instead.", "own": 1, "id": "doubling-season", "r": "M", "img": "img/lg/doubling-season.jpg"}, "Vorinclex, Monstrous Raider": {"n": "Vorinclex, Monstrous Raider", "c": "{4}{G}{G}", "t": "Legendary Creature — Phyrexian Praetor", "o": "Trample, haste\nIf you would put one or more counters on a permanent or player, put twice that many of each of those kinds of counters on that permanent or player instead.\nIf an opponent would put one or more counters on a permanent or player, they put half that many of each of those kinds of counters on that permanent or player instead, rounded down.", "own": 0, "id": "vorinclex-monstrous-raider", "r": "M", "img": "img/lg/vorinclex-monstrous-raider.jpg"}, "Samut, the Driving Force": {"n": "Samut, the Driving Force", "c": "{3}{R}{G}{W}", "t": "Legendary Creature — Human Warrior Cleric", "o": "First strike, vigilance, haste\nStart your engines! (If you have no speed, it starts at 1. It increases once on each of your turns when an opponent loses life. Max speed is 4.)\nOther creatures you control get +X/+0, where X is your speed.\nNoncreature spells you cast cost {X} less to cast, where X is your speed.", "own": 0, "id": "samut-the-driving-force", "r": "R", "img": "img/lg/samut-the-driving-force.jpg"}, "Feather, the Redeemed": {"n": "Feather, the Redeemed", "c": "{R}{W}{W}", "t": "Legendary Creature — Angel", "o": "Flying\nWhenever you cast an instant or sorcery spell that targets a creature you control, exile that card instead of putting it into your graveyard as it resolves. If you do, return it to your hand at the beginning of the next end step.", "own": 0, "id": "feather-the-redeemed", "r": "R", "img": "img/lg/feather-the-redeemed.jpg"}, "Szarel, Genesis Shepherd": {"n": "Szarel, Genesis Shepherd", "c": "{2}{B}{R}{G}", "t": "Legendary Creature — Insect Druid", "o": "Flying\nYou may play lands from your graveyard.\nWhenever you sacrifice another nontoken permanent during your turn, put a number of +1/+1 counters equal to Szarel's power on up to one other target creature.", "own": 0, "id": "szarel-genesis-shepherd", "r": "M", "img": "img/lg/szarel-genesis-shepherd.jpg"}, "G'raha Tia, Scion Reborn": {"n": "G'raha Tia, Scion Reborn", "c": "{W}{U}{B}", "t": "Legendary Creature — Cat Wizard", "o": "Lifelink\nThrow Wide the Gates — Whenever you cast a noncreature spell, you may pay X life, where X is that spell's mana value. If you do, create a 1/1 colorless Hero creature token and put X +1/+1 counters on it. Do this only once each turn.", "own": 0, "id": "g-raha-tia-scion-reborn", "r": "M", "img": "img/lg/g-raha-tia-scion-reborn.jpg"}, "Hashaton, Scarab's Fist": {"n": "Hashaton, Scarab's Fist", "c": "{W}{B}", "t": "Legendary Creature — Zombie Wizard", "o": "Whenever you discard a creature card, you may pay {2}{U}. If you do, create a tapped token that's a copy of that card, except it's a 4/4 black Zombie.", "own": 0, "id": "hashaton-scarab-s-fist", "r": "M", "img": "img/lg/hashaton-scarab-s-fist.jpg"}, "Fiery Confluence": {"n": "Fiery Confluence", "c": "{2}{R}{R}", "t": "Sorcery", "o": "Choose three. You may choose the same mode more than once.\n• Fiery Confluence deals 1 damage to each creature.\n• Fiery Confluence deals 2 damage to each opponent.\n• Destroy target artifact.", "own": 0, "id": "fiery-confluence", "r": "R", "img": "img/lg/fiery-confluence.jpg"}, "Mishra, Claimed by Gix": {"n": "Mishra, Claimed by Gix", "c": "{2}{B}{R}", "t": "Legendary Creature — Phyrexian Human Artificer", "o": "Whenever you attack, each opponent loses X life and you gain X life, where X is the number of attacking creatures. If Mishra, Claimed by Gix and a creature named Phyrexian Dragon Engine are attacking, and you both own and control them, exile them, then meld them into Mishra, Lost to Phyrexia. It enters tapped and attacking.", "own": 0, "id": "mishra-claimed-by-gix", "r": "M", "img": "img/lg/mishra-claimed-by-gix.jpg"}, "Hellrider": {"n": "Hellrider", "c": "{2}{R}{R}", "t": "Creature — Devil", "o": "Haste\nWhenever a creature you control attacks, this creature deals 1 damage to the player or planeswalker it's attacking.", "own": 0, "id": "hellrider", "r": "R", "img": "img/lg/hellrider.jpg"}, "Avatar Roku, Firebender": {"n": "Avatar Roku, Firebender", "c": "{3}{R}{R}{R}", "t": "Legendary Creature — Human Avatar", "o": "Whenever a player attacks, add six {R}. Until end of combat, you don't lose this mana as steps end.\n{R}{R}{R}: Target creature gets +3/+0 until end of turn.", "own": 0, "id": "avatar-roku-firebender", "r": "M", "img": "img/lg/avatar-roku-firebender.jpg"}, "Fire Nation Turret": {"n": "Fire Nation Turret", "c": "{2}{R}", "t": "Artifact", "o": "At the beginning of combat on your turn, up to one target creature gets +2/+0 and gains firebending 2 until end of turn.\n{R}: Put a charge counter on this artifact.\nRemove fifty charge counters from this artifact: It deals 50 damage to any target.", "own": 0, "id": "fire-nation-turret", "r": "R", "img": "img/lg/fire-nation-turret.jpg"}, "Fire Lord Ozai": {"n": "Fire Lord Ozai", "c": "{3}{B}", "t": "Legendary Creature — Human Noble", "o": "Whenever Fire Lord Ozai attacks, you may sacrifice another creature. If you do, add an amount of {R} equal to the sacrificed creature's power. Until end of combat, you don't lose this mana as steps end.\n{6}: Exile the top card of each opponent's library. Until end of turn, you may play one of those cards without paying its mana cost.", "own": 0, "id": "fire-lord-ozai", "r": "M", "img": "img/lg/fire-lord-ozai.jpg"}, "The Gitrog Monster": {"n": "The Gitrog Monster", "c": "{3}{B}{G}", "t": "Legendary Creature — Frog Horror", "o": "Deathtouch\nAt the beginning of your upkeep, sacrifice The Gitrog Monster unless you sacrifice a land.\nYou may play an additional land on each of your turns.\nWhenever one or more land cards are put into your graveyard from anywhere, draw a card.", "own": 0, "id": "the-gitrog-monster", "r": "M", "img": "img/lg/the-gitrog-monster.jpg"}, "Titania, Protector of Argoth": {"n": "Titania, Protector of Argoth", "c": "{3}{G}{G}", "t": "Legendary Creature — Elemental", "o": "When Titania enters, return target land card from your graveyard to the battlefield.\nWhenever a land you control is put into a graveyard from the battlefield, create a 5/3 green Elemental creature token.", "own": 0, "id": "titania-protector-of-argoth", "r": "M", "img": "img/lg/titania-protector-of-argoth.jpg"}, "Korvold, Fae-Cursed King": {"n": "Korvold, Fae-Cursed King", "c": "{2}{B}{R}{G}", "t": "Legendary Creature — Dragon Noble", "o": "Flying\nWhenever Korvold enters or attacks, sacrifice another permanent.\nWhenever you sacrifice a permanent, put a +1/+1 counter on Korvold and draw a card.", "own": 0, "id": "korvold-fae-cursed-king", "r": "M", "img": "img/lg/korvold-fae-cursed-king.jpg"}, "Ephara, God of the Polis": {"n": "Ephara, God of the Polis", "c": "{2}{W}{U}", "t": "Legendary Enchantment Creature — God", "o": "Indestructible\nAs long as your devotion to white and blue is less than seven, Ephara isn't a creature.\nAt the beginning of each upkeep, if you had another creature enter the battlefield under your control last turn, draw a card.", "own": 0, "id": "ephara-god-of-the-polis", "r": "M", "img": "img/lg/ephara-god-of-the-polis.jpg"}, "Sram, Senior Edificer": {"n": "Sram, Senior Edificer", "c": "{1}{W}", "t": "Legendary Creature — Dwarf Advisor", "o": "Whenever you cast an Aura, Equipment, or Vehicle spell, draw a card.", "own": 0, "id": "sram-senior-edificer", "r": "R", "img": "img/lg/sram-senior-edificer.jpg"}, "Eriette of the Charmed Apple": {"n": "Eriette of the Charmed Apple", "c": "{1}{W}{B}", "t": "Legendary Creature — Human Warlock", "o": "Each creature that's enchanted by an Aura you control can't attack you or planeswalkers you control.\nAt the beginning of your end step, each opponent loses X life and you gain X life, where X is the number of Auras you control.", "own": 0, "id": "eriette-of-the-charmed-apple", "r": "M", "img": "img/lg/eriette-of-the-charmed-apple.jpg"}, "Killian, Decisive Mentor": {"n": "Killian, Decisive Mentor", "c": "{1}{W}{B}", "t": "Legendary Creature — Human Warlock", "o": "Whenever an enchantment you control enters, tap up to one target creature and goad it. (Until your next turn, that creature attacks each combat if able and attacks a player other than you if able.)\nWhenever one or more creatures that are enchanted by an Aura you control attack, draw a card.", "own": 0, "id": "killian-decisive-mentor", "r": "M", "img": "img/lg/killian-decisive-mentor.jpg"}, "Bruvac the Grandiloquent": {"n": "Bruvac the Grandiloquent", "c": "{2}{U}", "t": "Legendary Creature — Human Advisor", "o": "If an opponent would mill one or more cards, they mill twice that many cards instead. (To mill a card, a player puts the top card of their library into their graveyard.)", "own": 0, "id": "bruvac-the-grandiloquent", "r": "M", "img": "img/lg/bruvac-the-grandiloquent.jpg"}, "The Water Crystal": {"n": "The Water Crystal", "c": "{2}{U}{U}", "t": "Legendary Artifact", "o": "Blue spells you cast cost {1} less to cast.\nIf an opponent would mill one or more cards, they mill that many cards plus four instead.\n{4}{U}{U}, {T}: Each opponent mills cards equal to the number of cards in your hand.", "own": 0, "id": "the-water-crystal", "r": "R", "img": "img/lg/the-water-crystal.jpg"}, "Fraying Sanity": {"n": "Fraying Sanity", "c": "{2}{U}", "t": "Enchantment — Aura Curse", "o": "Enchant player\nAt the beginning of each end step, enchanted player mills X cards, where X is the number of cards put into their graveyard from anywhere this turn.", "own": 0, "id": "fraying-sanity", "r": "R", "img": "img/lg/fraying-sanity.jpg"}, "Jace, Memory Adept": {"n": "Jace, Memory Adept", "c": "{3}{U}{U}", "t": "Legendary Planeswalker — Jace", "o": "+1: Draw a card. Target player mills a card.\n0: Target player mills ten cards.\n−7: Any number of target players each draw twenty cards.", "own": 0, "id": "jace-memory-adept", "r": "M", "img": "img/lg/jace-memory-adept.jpg"}, "Ashiok, Nightmare Muse": {"n": "Ashiok, Nightmare Muse", "c": "{3}{U}{B}", "t": "Legendary Planeswalker — Ashiok", "o": "+1: Create a 2/3 blue and black Nightmare creature token with \"Whenever this token attacks or blocks, each opponent exiles the top two cards of their library.\"\n−3: Return target nonland permanent to its owner's hand, then that player exiles a card from their hand.\n−7: You may cast up to three spells from among face-up cards your opponents own from exile without paying their mana costs.", "own": 0, "id": "ashiok-nightmare-muse", "r": "M", "img": "img/lg/ashiok-nightmare-muse.jpg"}, "Phenax, God of Deception": {"n": "Phenax, God of Deception", "c": "{3}{U}{B}", "t": "Legendary Enchantment Creature — God", "o": "Indestructible\nAs long as your devotion to blue and black is less than seven, Phenax isn't a creature.\nCreatures you control have \"{T}: Target player mills X cards, where X is this creature's toughness.\"", "own": 0, "id": "phenax-god-of-deception", "r": "M", "img": "img/lg/phenax-god-of-deception.jpg"}, "Necroduality": {"n": "Necroduality", "c": "{3}{U}", "t": "Enchantment", "o": "Whenever a nontoken Zombie you control enters, create a token that's a copy of that creature.", "own": 0, "id": "necroduality", "r": "M", "img": "img/lg/necroduality.jpg"}, "The Sibsig Ceremony": {"n": "The Sibsig Ceremony", "c": "{B}{B}{B}", "t": "Legendary Enchantment", "o": "Creature spells you cast cost {2} less to cast.\nWhenever a creature you control enters, if you cast it, destroy that creature, then create a 2/2 black Zombie Druid creature token.", "own": 0, "id": "the-sibsig-ceremony", "r": "R", "img": "img/lg/the-sibsig-ceremony.jpg"}, "Waste Not": {"n": "Waste Not", "c": "{1}{B}", "t": "Enchantment", "o": "Whenever an opponent discards a creature card, create a 2/2 black Zombie creature token.\nWhenever an opponent discards a land card, add {B}{B}.\nWhenever an opponent discards a noncreature, nonland card, draw a card.", "own": 0, "id": "waste-not", "r": "M", "img": "img/lg/waste-not.jpg"}, "The Scarab God": {"n": "The Scarab God", "c": "{3}{U}{B}", "t": "Legendary Creature — God", "o": "At the beginning of your upkeep, each opponent loses X life and you scry X, where X is the number of Zombies you control.\n{2}{U}{B}: Exile target creature card from a graveyard. Create a token that's a copy of it, except it's a 4/4 black Zombie.\nWhen The Scarab God dies, return it to its owner's hand at the beginning of the next end step.", "own": 0, "id": "the-scarab-god", "r": "M", "img": "img/lg/the-scarab-god.jpg"}, "Cursecloth Wrappings": {"n": "Cursecloth Wrappings", "c": "{2}{B}{B}", "t": "Artifact", "o": "Zombies you control get +1/+1.\n{T}: Target creature card in your graveyard gains embalm until end of turn. The embalm cost is equal to its mana cost. (Exile that card and pay its embalm cost: Create a token that's a copy of it, except it's a white Zombie in addition to its other types and has no mana cost. Embalm only as a sorcery.)", "own": 0, "id": "cursecloth-wrappings", "r": "R", "img": "img/lg/cursecloth-wrappings.jpg"}, "Gisa and Geralf": {"n": "Gisa and Geralf", "c": "{2}{U}{B}", "t": "Legendary Creature — Human Wizard", "o": "When Gisa and Geralf enters, mill four cards.\nOnce during each of your turns, you may cast a Zombie creature spell from your graveyard.", "own": 0, "id": "gisa-and-geralf", "r": "M", "img": "img/lg/gisa-and-geralf.jpg"}, "Liliana, Death's Majesty": {"n": "Liliana, Death's Majesty", "c": "{3}{B}{B}", "t": "Legendary Planeswalker — Liliana", "o": "+1: Create a 2/2 black Zombie creature token. Mill two cards.\n−3: Return target creature card from your graveyard to the battlefield. That creature is a black Zombie in addition to its other colors and types.\n−7: Destroy all non-Zombie creatures.", "own": 0, "id": "liliana-death-s-majesty", "r": "M", "img": "img/lg/liliana-death-s-majesty.jpg"}, "Kalitas, Traitor of Ghet": {"n": "Kalitas, Traitor of Ghet", "c": "{2}{B}{B}", "t": "Legendary Creature — Vampire Warrior", "o": "Lifelink\nIf a nontoken creature an opponent controls would die, instead exile that card and create a 2/2 black Zombie creature token.\n{2}{B}, Sacrifice another Vampire or Zombie: Put two +1/+1 counters on Kalitas.", "own": 0, "id": "kalitas-traitor-of-ghet", "r": "M", "img": "img/lg/kalitas-traitor-of-ghet.jpg"}, "God-Eternal Oketra": {"n": "God-Eternal Oketra", "c": "{3}{W}{W}", "t": "Legendary Creature — Zombie God", "o": "Double strike\nWhenever you cast a creature spell, create a 4/4 black Zombie Warrior creature token with vigilance.\nWhen God-Eternal Oketra dies or is put into exile from the battlefield, you may put it into its owner's library third from the top.", "own": 0, "id": "god-eternal-oketra", "r": "M", "img": "img/lg/god-eternal-oketra.jpg"}, "Jace, Wielder of Mysteries": {"n": "Jace, Wielder of Mysteries", "c": "{1}{U}{U}{U}", "t": "Legendary Planeswalker — Jace", "o": "If you would draw a card while your library has no cards in it, you win the game inst
