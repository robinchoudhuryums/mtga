name: Tests

# Runs the project's checks on every push to main and every PR: the pytest unit layer
# (tests/) plus the deterministic integrity + model-sanity gate (scripts/check_all.py).
# Both are OFFLINE — they use only committed data and pure functions, no Scryfall — so
# nothing here can hang on the network (same reason the Pages build disables it).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # requirements-app.txt too, NOT just -dev: tests/test_app_editor.py importorskips
        # Flask, so installing only the dev pin silently skipped its six write-safety pins
        # on app.py — 1,035 lines that write card-library.csv and deck files — on every
        # push and PR since they were written. They pass; nothing automated ran them.
        run: pip install -r requirements-dev.txt -r requirements-app.txt
      - name: Unit tests (pytest)
        # PYTEST_NO_SKIPS turns a skip into a failure HERE only (see tests/conftest.py).
        # Fixing the Flask instance leaves the class open; this closes it, so the next
        # optional dependency cannot quietly take a module out of CI coverage.
        env:
          PYTEST_NO_SKIPS: "1"
        run: pytest
      - name: Integrity gate (check_all)
        run: python3 scripts/check_all.py
